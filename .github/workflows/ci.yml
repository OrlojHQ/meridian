name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    name: Build, test, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.0"

      - name: Bootstrap
        run: make bootstrap

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Race test
        run: go test -race ./... -count=1

      - name: Test UI
        run: make ui-test

      - name: Lint
        run: make lint

      - name: Build UI
        run: make ui-build

      - name: Test Helm policy
        run: make helm-test

      - name: Validate snapshot release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --snapshot --clean --skip=docker --skip=sbom

      - name: Check whitespace
        run: git diff --check
