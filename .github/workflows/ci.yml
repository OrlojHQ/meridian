name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # Docs-only changes skip the build. A job skipped by `if:` reports
      # success, so the required "Build, test, and lint" check still passes.
      # Deletions always build: releases package README, SECURITY, and
      # docs/operations.md. An unknown base (new branch, force push) builds.
      - name: Classify changed files
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "pull_request" ]]; then base="$PR_BASE"; else base="$PUSH_BEFORE"; fi
          code=true
          if [[ -n "$base" && ! "$base" =~ ^0+$ ]] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            code=false
            if [[ -n "$(git diff --name-only --no-renames --diff-filter=D "$base" HEAD)" ]]; then
              code=true
            fi
            while IFS= read -r path; do
              case "$path" in
                */testdata/*) code=true ;;
                ''|*.md|docs/*|LICENSE|.github/ISSUE_TEMPLATE/*) ;;
                *) code=true ;;
              esac
            done <<<"$(git diff --name-only --no-renames "$base" HEAD)"
          fi
          echo "code=$code" >>"$GITHUB_OUTPUT"
          echo "Run full build: $code"

  build-test-lint:
    name: Build, test, and lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.5"
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.0"

      - name: Bootstrap
        run: make bootstrap

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Race test
        run: go test -race ./... -count=1

      - name: Test UI
        run: make ui-test

      - name: Lint
        run: make lint

      - name: Build UI
        run: make ui-build

      - name: Test Helm policy
        run: make helm-test

      - name: Validate snapshot release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --snapshot --clean --skip=docker --skip=sbom

      - name: Check whitespace
        run: git diff --check
