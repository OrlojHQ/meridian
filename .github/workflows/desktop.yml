name: desktop

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Not a required check. A failure here does not fail "Build, test, and lint".
concurrency:
  group: desktop-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Build desktop (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check desktop release scripts
        run: |
          set -euo pipefail
          bash -n scripts/release-desktop.sh
          bash -n scripts/desktop-apple-signing.sh
          bash -n scripts/render-homebrew-cask.sh
          hash="$(printf '%064d' 0 | tr '0-9' 'a')"
          printf '%s  %s\n' "${hash}" "meridian-desktop_0.0.0_macOS_universal.dmg" > "${RUNNER_TEMP}/checksums.txt"
          scripts/render-homebrew-cask.sh 0.0.0 "${RUNNER_TEMP}/checksums.txt" > "${RUNNER_TEMP}/meridian-desktop.rb"
          ruby -c "${RUNNER_TEMP}/meridian-desktop.rb"
          grep -q 'cask "meridian-desktop"' "${RUNNER_TEMP}/meridian-desktop.rb"
          grep -q 'meridian-install-source' "${RUNNER_TEMP}/meridian-desktop.rb"
          python3 scripts/write-desktop-updater-manifest-test.py
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          sh -n scripts/install-desktop.sh
          sh -n scripts/install-desktop-test.sh
          shellcheck -s sh scripts/install-desktop.sh scripts/install-desktop-test.sh
          scripts/install-desktop-test.sh

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.11"
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.0"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable

      - name: Cache Rust
        uses: swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: desktop/src-tauri

      - name: Install webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Test the shell
        run: make desktop-test

      - name: Build the desktop app
        run: make desktop-build

  macos:
    name: Build desktop (macOS)
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.11"
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.0"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable

      - name: Cache Rust
        uses: swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: desktop/src-tauri

      - name: Test the shell
        run: make desktop-test

      - name: Build the desktop app
        run: make desktop-build
