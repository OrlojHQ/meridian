name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout complete history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.11"
          cache: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.0"
      - name: Verify generated source, tests, and policy
        run: |
          set -euo pipefail
          make bootstrap
          make generate
          make check-generated
          make build
          make test
          make ui-test
          make lint
          make ui-build
          make helm-test
          git diff --exit-code
          git diff --check
      - name: Race test
        run: go test -race ./... -count=1
      - name: Vulnerability check
        run: make vulncheck

  release:
    name: Build, attest, and draft release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout complete history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.11"
          cache: true
      - name: Setup QEMU for arm64 RUN steps
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install pinned Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          syft-version: v1.33.0
      - name: Build and publish draft release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest release archives and checksums
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/*.spdx.json
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.1
      - name: Keyless-sign release images and files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cosign sign --yes "ghcr.io/orlojhq/meridiand:${TAG}"
          cosign sign --yes "ghcr.io/orlojhq/meridian-capsule:${TAG}"
          for artifact in dist/*.tar.gz dist/checksums.txt dist/*.spdx.json; do
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "${artifact}"
          done
          gh release upload "${TAG}" dist/*.sigstore.json --clobber
      - name: Attach desktop install script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "${TAG}" scripts/install-desktop.sh --clobber

  harness-images:
    name: Publish official harness pack images
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout complete history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Setup QEMU for arm64 RUN steps
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.1
      - name: Build, publish, and keyless-sign official pack images
        env:
          COMMIT: ${{ github.sha }}
        run: scripts/publish-harness-images.sh "${{ github.ref_name }}"

  desktop-macos:
    name: Publish macOS desktop app
    needs: release
    runs-on: macos-latest
    timeout-minutes: 50
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout complete history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.11"
          cache: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.0"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install pinned Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          syft-version: v1.33.0
      # TODO: Apple code signing and notarization. scripts/desktop-apple-signing.sh
      # imports a Developer ID certificate and exports Tauri's notarization
      # variables only when every secret in that set is present. With no Apple
      # Developer account, the secrets are empty and the app stays unsigned.
      - name: Apple signing hook
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/desktop-apple-signing.sh
      - name: Build universal disk image and app zip
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}" scripts/release-desktop.sh macos-universal
      - name: Upload desktop artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r -d '' file; do
            files+=("${file}")
          done < <(find dist/desktop -type f ! -name 'checksums-fragment.txt' -print0)
          gh release upload "${TAG}" "${files[@]}" --clobber
      - name: Attest desktop artifacts
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/desktop/*.dmg
            dist/desktop/*.zip
            dist/desktop/*.spdx.json
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.1
      - name: Keyless-sign desktop artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for artifact in dist/desktop/*; do
            [[ "${artifact}" == *.txt ]] && continue
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "${artifact}"
          done
          gh release upload "${TAG}" dist/desktop/*.sigstore.json --clobber
      - name: Save checksum fragment
        run: cp dist/desktop/checksums-fragment.txt checksums-macos.txt
      - name: Upload checksum fragment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-checksums-macos
          path: checksums-macos.txt
          if-no-files-found: error

  desktop-linux:
    name: Publish Linux desktop package
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout complete history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.11"
          cache: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.0"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - name: Install webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install pinned Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          syft-version: v1.33.0
      - name: Build amd64 package
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}" scripts/release-desktop.sh linux-amd64
      - name: Upload desktop package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r -d '' file; do
            files+=("${file}")
          done < <(find dist/desktop -type f ! -name 'checksums-fragment.txt' -print0)
          gh release upload "${TAG}" "${files[@]}" --clobber
      - name: Attest desktop package
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/desktop/*.deb
            dist/desktop/*.spdx.json
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.1
      - name: Keyless-sign desktop package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for artifact in dist/desktop/*; do
            [[ "${artifact}" == *.txt ]] && continue
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "${artifact}"
          done
          gh release upload "${TAG}" dist/desktop/*.sigstore.json --clobber
      - name: Save checksum fragment
        run: cp dist/desktop/checksums-fragment.txt checksums-linux.txt
      - name: Upload checksum fragment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-checksums-linux
          path: checksums-linux.txt
          if-no-files-found: error

  desktop-checksums:
    name: Sign desktop checksums
    needs: [desktop-macos, desktop-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download checksum fragments
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-checksums-*
          merge-multiple: true
          path: fragments
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.1
      - name: Append desktop checksums and re-sign
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/release"
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir "${dir}" \
            --pattern checksums.txt
          cat fragments/*.txt >> "${dir}/checksums.txt"
          sort -u -k2,2 -o "${dir}/checksums.txt" "${dir}/checksums.txt"
          cosign sign-blob --yes --bundle "${dir}/checksums.txt.sigstore.json" "${dir}/checksums.txt"
          gh release upload "${TAG}" "${dir}/checksums.txt" "${dir}/checksums.txt.sigstore.json" --clobber
          mv "${dir}/checksums.txt" checksums.txt
      - name: Attest checksums
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: checksums.txt
