name: images

on:
  pull_request:
    paths:
      - "images/**"
      - "Makefile"
      - "scripts/publish-harness-images.sh"
      - ".github/workflows/images.yml"
  push:
    branches:
      - main
    paths:
      - "images/**"
      - "Makefile"
      - "scripts/publish-harness-images.sh"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an in-progress pull request run. Pushes to main get
# one group per commit, so every merged change keeps its full run; otherwise a
# docs-only merge would cancel the previous code merge's build.
concurrency:
  group: images-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  packs:
    name: List harness packs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packs: ${{ steps.list.outputs.packs }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Every images/capsule-<pack>/pack.env is an official pack.
      - name: List packs
        id: list
        run: echo "packs=$(make -s list-packs | jq -Rc 'split(" ")')" >> "$GITHUB_OUTPUT"

  pack:
    name: Build ${{ matrix.pack }} pack image
    needs: packs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pack: ${{ fromJSON(needs.packs.outputs.packs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Builds the thin Capsule image, then the pack FROM it. The shared
      # pack Dockerfile verifies the pinned harness checksum and runs --version.
      # Nothing is pushed; release.yml publishes on tags.
      - name: Build Capsule and pack images
        run: make capsule-${{ matrix.pack }}-image
