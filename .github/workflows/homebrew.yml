name: homebrew

# Release drafts are not publicly downloadable, so the formula and the
# desktop cask are rendered and committed to OrlojHQ/homebrew-tap only after
# a release is published. Prereleases never reach the tap. A release event
# renders the templates from the tagged source; a manual run renders them
# from the selected branch. HOMEBREW_TAP_TOKEN must be able to push both
# Formula/meridian.rb and Casks/meridian-desktop.rb.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to push to the tap, such as v0.4.0
        required: true

concurrency:
  group: homebrew-tap
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tap:
    name: Update OrlojHQ/homebrew-tap
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Resolve release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "not a stable release tag: ${TAG}" >&2
            exit 1
          fi
          state="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" \
            --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"')"
          if [[ "${state}" != "false false" ]]; then
            echo "${TAG} is a draft or prerelease; not updating the tap" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${TAG#v}" >> "${GITHUB_OUTPUT}"
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.1
      - name: Download and verify checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/release"
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir "${dir}" \
            --pattern checksums.txt --pattern checksums.txt.sigstore.json
          cosign verify-blob \
            --bundle "${dir}/checksums.txt.sigstore.json" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${dir}/checksums.txt"
      - name: Render formula and desktop cask
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          scripts/render-homebrew-formula.sh "${VERSION}" \
            "${RUNNER_TEMP}/release/checksums.txt" > "${RUNNER_TEMP}/meridian.rb"
          scripts/render-homebrew-cask.sh "${VERSION}" \
            "${RUNNER_TEMP}/release/checksums.txt" > "${RUNNER_TEMP}/meridian-desktop.rb"
          ruby -c "${RUNNER_TEMP}/meridian.rb"
          ruby -c "${RUNNER_TEMP}/meridian-desktop.rb"
      - name: Checkout tap
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: OrlojHQ/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Commit formula and desktop cask
        env:
          TAG: ${{ steps.release.outputs.tag }}
        working-directory: tap
        run: |
          set -euo pipefail
          mkdir -p Formula Casks
          cp "${RUNNER_TEMP}/meridian.rb" Formula/meridian.rb
          cp "${RUNNER_TEMP}/meridian-desktop.rb" Casks/meridian-desktop.rb
          git add Formula/meridian.rb Casks/meridian-desktop.rb
          if git diff --cached --quiet; then
            echo "Formula and desktop cask already at ${TAG}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Brew formula and desktop cask update for meridian version ${TAG}"
          git push origin HEAD
