{{- if and .Values.agentSandbox.namespace (ne .Values.agentSandbox.namespace (include "meridian.namespace" .)) -}}
{{- fail "agentSandbox.namespace must equal the chart namespace; cross-namespace operation is not supported" -}}
{{- end }}
{{- if and .Values.agentSandbox.isolationClass (not (or (eq .Values.agentSandbox.isolationClass "sandbox") (eq .Values.agentSandbox.isolationClass "microvm"))) }}
{{- fail "agentSandbox.isolationClass must be empty, sandbox, or microvm; container is the default when unset" }}
{{- end }}
{{- if and .Values.agentSandbox.isolationClass (not .Values.agentSandbox.runtimeClassName) }}
{{- fail "agentSandbox.isolationClass requires agentSandbox.runtimeClassName naming the RuntimeClass meridiand verifies" }}
{{- end }}
{{- if and (not .Values.agentSandbox.isolationClass) .Values.agentSandbox.isolationHandlers }}
{{- fail "agentSandbox.isolationHandlers require agentSandbox.isolationClass" }}
{{- end }}
{{- if .Values.oidc.issuer }}
{{- if not .Values.oidc.clientId }}
{{- fail "oidc.clientId is required when oidc.issuer is set" }}
{{- end }}
{{- if not .Values.publicUrl }}
{{- fail "publicUrl is required when oidc.issuer is set" }}
{{- end }}
{{- else if or .Values.oidc.clientId .Values.oidc.clientSecret.existingSecret .Values.oidc.requiredGroup .Values.oidc.groupsClaim }}
{{- fail "oidc.issuer is required when OIDC settings are set" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meridian.fullname" . }}
  namespace: {{ include "meridian.namespace" . }}
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "meridian.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "meridian.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: control-plane
    spec:
      serviceAccountName: {{ include "meridian.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: initialize-data-directory
          image: {{ include "meridian.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/meridiand"]
          args:
            - init-data-dir
            - --path=/var/lib/meridian-volume/data
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/meridian-volume}
      containers:
        - name: meridiand
          image: {{ include "meridian.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --provider=agentsandbox
            {{- if .Values.providerGatewayURL }}
            - --provider-gateway-url={{ .Values.providerGatewayURL }}
            {{- if .Values.providerGatewayAllowPrivateHTTP }}
            - --provider-gateway-allow-private-http
            {{- end }}
            {{- end }}
            {{- with .Values.publicUrl }}
            - {{ printf "--public-url=%s" . | quote }}
            {{- end }}
            {{- with .Values.auditRetention }}
            - {{ printf "--audit-retention=%s" . | quote }}
            {{- end }}
            {{- with .Values.oidc.issuer }}
            - {{ printf "--oidc-issuer=%s" . | quote }}
            {{- end }}
            {{- with .Values.oidc.clientId }}
            - {{ printf "--oidc-client-id=%s" . | quote }}
            {{- end }}
            {{- if .Values.oidc.clientSecret.existingSecret }}
            - --oidc-client-secret-file=/etc/meridian/oidc/client-secret
            {{- end }}
            {{- with .Values.oidc.requiredGroup }}
            - {{ printf "--oidc-required-group=%s" . | quote }}
            {{- end }}
            {{- with .Values.oidc.groupsClaim }}
            - {{ printf "--oidc-groups-claim=%s" . | quote }}
            {{- end }}
            - --listen=0.0.0.0:8080
            - --allow-non-loopback-listen
            - --preview-listen=127.0.0.1:8081
            - --data-dir=/var/lib/meridian-volume/data
            - --agentsandbox-in-cluster
            - --agentsandbox-namespace={{ default (include "meridian.namespace" .) .Values.agentSandbox.namespace }}
            - --agentsandbox-image={{ include "meridian.capsuleImage" . }}
            - --official-pack-tag={{ .Values.capsuleImage.tag }}
            - --agentsandbox-class={{ .Values.agentSandbox.class }}
            - --agentsandbox-runtime-class={{ .Values.agentSandbox.runtimeClassName }}
            {{- if .Values.agentSandbox.isolationClass }}
            - --agentsandbox-isolation-class={{ .Values.agentSandbox.isolationClass }}
            {{- range .Values.agentSandbox.isolationHandlers }}
            - {{ printf "--agentsandbox-isolation-handler=%s" . | quote }}
            {{- end }}
            {{- end }}
            - --agentsandbox-storage-class={{ .Values.agentSandbox.storageClassName }}
            - --agentsandbox-volume-size={{ .Values.agentSandbox.workspaceSize }}
            - --agentsandbox-ttl={{ .Values.agentSandbox.ttl }}
            - --agentsandbox-operation-timeout={{ .Values.agentSandbox.operationTimeout }}
            - --agentsandbox-setup-timeout={{ .Values.agentSandbox.setupTimeout }}
            - --agentsandbox-cpu-limit={{ .Values.agentSandbox.limits.cpu }}
            - --agentsandbox-memory-limit={{ .Values.agentSandbox.limits.memory }}
            - --agentsandbox-ephemeral-limit={{ .Values.agentSandbox.limits.ephemeralStorage }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          volumeMounts:
            - {name: data, mountPath: /var/lib/meridian-volume}
            - {name: tmp, mountPath: /tmp}
            {{- if .Values.oidc.clientSecret.existingSecret }}
            - name: oidc-client-secret
              mountPath: /etc/meridian/oidc
              readOnly: true
            {{- end }}
      volumes:
        {{- if .Values.oidc.clientSecret.existingSecret }}
        - name: oidc-client-secret
          secret:
            secretName: {{ .Values.oidc.clientSecret.existingSecret | quote }}
            defaultMode: 0440
            items:
              - key: {{ .Values.oidc.clientSecret.key | quote }}
                path: client-secret
        {{- end }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "meridian.fullname" . }}-data
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "meridian.fullname" . }}-data
  namespace: {{ include "meridian.namespace" . }}
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "meridian.fullname" . }}
  namespace: {{ include "meridian.namespace" . }}
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "meridian.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: control-plane
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
