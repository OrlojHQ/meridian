{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "meridian.fullname" . }}-default-deny
  namespace: {{ include "meridian.namespace" . }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "meridian.fullname" . }}-control-plane
  namespace: {{ include "meridian.namespace" . }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "meridian.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: control-plane
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - {protocol: TCP, port: {{ .Values.service.port }}}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dnsNamespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dnsPodSelector | nindent 14 }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- $apiPorts := .Values.networkPolicy.kubernetesAPIServerPorts }}
    {{- range .Values.networkPolicy.kubernetesAPIServerCIDRs }}
    - to:
        - ipBlock: {cidr: {{ . | quote }}}
      ports:
        {{- range $apiPorts }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
    {{- end }}
    {{- range .Values.networkPolicy.providerEgressCIDRs }}
    - to:
        - ipBlock: {cidr: {{ . | quote }}}
      ports:
        - {protocol: TCP, port: 443}
    {{- end }}
    # ADR 0065: capsuled's pod-network mutual TLS listener.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ default (include "meridian.namespace" .) .Values.agentSandbox.namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: meridian
              meridian.orloj.io/role: pod
      ports:
        - {protocol: TCP, port: 7778}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "meridian.fullname" . }}-capsules
  namespace: {{ include "meridian.namespace" . }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: meridian
      meridian.orloj.io/role: pod
  policyTypes: [Ingress, Egress]
  ingress:
    # ADR 0065: only the control plane reaches capsuled's pod-network
    # listener, which also requires the Capsule's pinned client certificate.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "meridian.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: control-plane
      ports:
        - {protocol: TCP, port: 7778}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dnsNamespaceSelector | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dnsPodSelector | nindent 14 }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "meridian.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: control-plane
      ports:
        - {protocol: TCP, port: {{ .Values.service.port }}}
    {{- range .Values.networkPolicy.capsuleEgressCIDRs }}
    - to:
        - ipBlock: {cidr: {{ . | quote }}}
    {{- end }}
{{- end }}
