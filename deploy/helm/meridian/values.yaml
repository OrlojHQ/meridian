providerGatewayURL: ""
# Let custom endpoint connections opt in to plaintext HTTP model servers on
# loopback or private-network addresses (ADR 0027). Requires providerGatewayURL.
providerGatewayAllowPrivateHTTP: false

# Team-mode browser origin and sign-in. Empty values preserve single-user mode.
publicUrl: ""
# Go duration, e.g. 2160h for 90 days; empty or 0 retains all audit records.
auditRetention: ""
oidc:
  issuer: ""
  clientId: ""
  clientSecret:
    # Existing Secret in this namespace. No plaintext secret belongs in values.
    existingSecret: ""
    key: client-secret
  requiredGroup: ""
  # Empty uses the daemon's default groups claim (groups).
  groupsClaim: ""

nameOverride: ""
fullnameOverride: ""

namespace:
  create: false
  name: ""

image:
  repository: ghcr.io/orlojhq/meridiand
  tag: dev
  digest: ""
  pullPolicy: IfNotPresent

capsuleImage:
  repository: ghcr.io/orlojhq/meridian-capsule
  tag: dev
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 1
serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: true

service:
  type: ClusterIP
  port: 8080

agentSandbox:
  namespace: ""
  class: ""
  runtimeClassName: ""
  storageClassName: ""
  workspaceSize: 10Gi
  ttl: 24h
  operationTimeout: 2m
  setupTimeout: 10m
  limits:
    cpu: "2"
    memory: 2Gi
    ephemeralStorage: 2Gi

persistence:
  storageClassName: ""
  size: 10Gi

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 1Gi
    ephemeral-storage: 1Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

networkPolicy:
  enabled: true
  # Kubernetes NetworkPolicy cannot select the API server. Set its routable
  # CIDR explicitly; the safe empty default denies API access.
  kubernetesAPIServerCIDRs: []
  dnsNamespaceSelector:
    kubernetes.io/metadata.name: kube-system
  dnsPodSelector:
    k8s-app: kube-dns
  # Control-plane HTTPS to model providers and the OIDC issuer. NetworkPolicy
  # cannot select hostnames; set routable CIDRs for model providers, HTTPS
  # custom endpoints, and OIDC discovery/token/device/JWKS destinations. Empty
  # denies that traffic. These CIDRs are not granted to Capsules; inference
  # leaves through the gateway.
  providerEgressCIDRs: []
  # Capsule package/repository egress and the HTTPS gateway origin are
  # denied unless explicitly scoped. Capsules already receive in-namespace
  # TCP to the control-plane provider gateway.
  capsuleEgressCIDRs: []

resourceQuota:
  enabled: true
  hard:
    requests.cpu: "16"
    requests.memory: 32Gi
    limits.cpu: "32"
    limits.memory: 64Gi
    persistentvolumeclaims: "50"
    requests.storage: 500Gi

podDisruptionBudget:
  enabled: false
  minAvailable: 1
