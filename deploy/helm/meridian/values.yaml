providerGatewayURL: ""
# Let custom endpoint connections opt in to plaintext HTTP model servers on
# loopback or private-network addresses (ADR 0027). Requires providerGatewayURL.
providerGatewayAllowPrivateHTTP: false

nameOverride: ""
fullnameOverride: ""

namespace:
  create: false
  name: ""

image:
  repository: ghcr.io/orlojhq/meridiand
  tag: dev
  digest: ""
  pullPolicy: IfNotPresent

capsuleImage:
  repository: ghcr.io/orlojhq/meridian-capsule
  tag: dev
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 1
serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: true

service:
  type: ClusterIP
  port: 8080

agentSandbox:
  namespace: ""
  class: ""
  runtimeClassName: ""
  storageClassName: ""
  workspaceSize: 10Gi
  ttl: 24h
  operationTimeout: 2m
  setupTimeout: 10m
  limits:
    cpu: "2"
    memory: 2Gi
    ephemeralStorage: 2Gi

persistence:
  storageClassName: ""
  size: 10Gi

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 1Gi
    ephemeral-storage: 1Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

networkPolicy:
  enabled: true
  # Kubernetes NetworkPolicy cannot select the API server. Set its routable
  # CIDR explicitly; the safe empty default denies API access.
  kubernetesAPIServerCIDRs: []
  dnsNamespaceSelector:
    kubernetes.io/metadata.name: kube-system
  dnsPodSelector:
    k8s-app: kube-dns
  # Control-plane HTTPS to model providers. NetworkPolicy cannot select
  # api.openai.com or api.anthropic.com by name; set their routable CIDRs,
  # plus any HTTPS custom endpoint. Empty denies provider traffic. These
  # CIDRs are not granted to Capsules; inference leaves through the gateway.
  providerEgressCIDRs: []
  # Capsule package/repository egress and the HTTPS gateway origin are
  # denied unless explicitly scoped. Capsules already receive in-namespace
  # TCP to the control-plane provider gateway.
  capsuleEgressCIDRs: []

resourceQuota:
  enabled: true
  hard:
    requests.cpu: "16"
    requests.memory: 32Gi
    limits.cpu: "32"
    limits.memory: 64Gi
    persistentvolumeclaims: "50"
    requests.storage: 500Gi

podDisruptionBudget:
  enabled: false
  minAvailable: 1
