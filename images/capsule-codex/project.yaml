# Copy this file into a repository as .meridian/project.yaml.
# The Capsule image must contain /usr/local/bin/codex
# (make capsule-codex-image → meridian-capsule-codex:dev).
# Terminal sessions (native) sign in inside the Codex TUI (`codex login`).
# Threads (structured) run `codex app-server` through the Meridian adapter;
# the adapter does not collect credentials. Attach an OpenAI provider
# connection so capsuled writes the gateway model provider into
# ~/.codex/config.toml, or sign in once in a terminal session.
# Codex's own sandbox needs user namespaces the Capsule does not grant, so the
# Capsule is the boundary and every non-read-only command asks the operator.
# Neither profile injects provider credentials itself, and a repository
# cannot define profiles or secretReferences under this name.
version: v1
harnesses:
  - name: codex
    interactionMode: native
    executable: /usr/local/bin/codex
    workingDirectory: .
    promptMode: interactive
    outputMode: text
    pty: true
    timeout: 24h
    secretReferences: []
  - name: codex
    interactionMode: structured
    adapter:
      protocol: meridian.adapter.v1
      executable: /usr/local/bin/meridian-harness-adapter
      arguments: ["codex-app-server", "--mcp-server", "meridian-coord=/usr/local/bin/meridian-coord,mcp", "--approval-policy", "untrusted", "--sandbox", "danger-full-access", "--", "/usr/local/bin/codex"]
    workingDirectory: .
    pty: false
    timeout: 24h
    secretReferences: []
