# Copy this file into a repository as .meridian/project.yaml.
# The Capsule image must contain /usr/local/bin/codex
# (make capsule-codex-image → meridian-capsule-codex:dev).
# Sign in inside the Codex TUI. This trusted profile does not inject provider
# credentials; a repository cannot add secretReferences under the same name.
version: v1
harnesses:
  - name: codex
    interactionMode: native
    executable: /usr/local/bin/codex
    workingDirectory: .
    promptMode: interactive
    outputMode: text
    pty: true
    timeout: 24h
    secretReferences: []
