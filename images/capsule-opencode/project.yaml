# Copy this file into a repository as .meridian/project.yaml.
# The Capsule image must contain /usr/local/bin/opencode
# (make capsule-opencode-image → meridian-capsule-opencode:dev).
# Sign in inside the OpenCode TUI. This trusted profile does not inject
# provider credentials; a repository cannot add secretReferences under the
# same name.
version: v1
harnesses:
  - name: opencode
    interactionMode: native
    executable: /usr/local/bin/opencode
    workingDirectory: .
    promptMode: interactive
    outputMode: text
    pty: true
    timeout: 24h
    secretReferences: []
