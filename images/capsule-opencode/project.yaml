# Copy this file into a repository as .meridian/project.yaml.
# The Capsule image must contain /usr/local/bin/opencode
# (make capsule-opencode-image → meridian-capsule-opencode:dev).
# Terminal sessions (native) sign in inside the OpenCode TUI
# (`opencode auth login`). Threads (structured) run `opencode acp`
# (Agent Client Protocol over stdio) through the Meridian adapter; ACP does
# not collect credentials. Attach a provider connection, or sign in once in
# a terminal session in the same Capsule. A fresh password is set on
# OpenCode's loopback server for each launch.
# meridian-coord is registered as a stdio MCP server through ACP session/new,
# so a lead Thread gets the coordination tools.
# Neither profile injects provider credentials itself, and a repository
# cannot define profiles or secretReferences under this name.
version: v1
harnesses:
  - name: opencode
    interactionMode: native
    executable: /usr/local/bin/opencode
    workingDirectory: .
    promptMode: interactive
    outputMode: text
    pty: true
    timeout: 24h
    secretReferences: []
  - name: opencode
    interactionMode: structured
    adapter:
      protocol: meridian.adapter.v1
      executable: /usr/local/bin/meridian-harness-adapter
      arguments:
        - acp
        - --secret-env
        - OPENCODE_SERVER_PASSWORD
        - --mcp-server
        - meridian-coord=/usr/local/bin/meridian-coord,mcp
        - --
        - /usr/local/bin/opencode
        - acp
        - --hostname
        - 127.0.0.1
        - --mdns=false
    workingDirectory: .
    pty: false
    timeout: 24h
    secretReferences: []
