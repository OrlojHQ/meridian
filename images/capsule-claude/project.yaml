# Copy this file into a repository as .meridian/project.yaml.
# The Capsule image must contain /usr/local/bin/claude
# (make capsule-claude-image → meridian-capsule-claude:dev).
# Threads (structured) run Claude Code headless through the Meridian adapter.
# The adapter does not collect credentials. Sign in to Claude from Meridian's
# Harness settings. An API key or setup token is only a fallback. The login is
# stored encrypted and the provider gateway attaches it to api.anthropic.com. capsuled sets
# ANTHROPIC_BASE_URL and a gateway lease in ANTHROPIC_API_KEY. The login is
# not an environment variable, file, volume, image layer, or prompt in this
# Capsule. Neither profile injects provider credentials itself, and a
# repository cannot define profiles or secretReferences under this name.
version: v1
harnesses:
  - name: claude
    interactionMode: native
    executable: /usr/local/bin/claude
    workingDirectory: .
    promptMode: interactive
    outputMode: text
    pty: true
    timeout: 24h
    secretReferences: []
  - name: claude
    interactionMode: structured
    adapter:
      protocol: meridian.adapter.v1
      executable: /usr/local/bin/meridian-harness-adapter
      arguments: ["claude-stream", "--mcp-server", "meridian-coord=/usr/local/bin/meridian-coord,mcp", "--", "/usr/local/bin/claude"]
    workingDirectory: .
    pty: false
    timeout: 24h
    secretReferences: []
