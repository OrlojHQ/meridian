# Copy this file into a repository as .meridian/project.yaml.
# The Capsule image must contain /usr/local/bin/pi
# (make capsule-pi-image → meridian-capsule-pi:dev).
# Terminal sessions (native) sign in inside the Pi TUI.
# Threads (structured) run Pi RPC mode through the Meridian adapter; attach a
# provider connection for credentials.
# Neither profile injects provider credentials itself, and a repository
# cannot define profiles or secretReferences under this name.
version: v1
harnesses:
  - name: pi
    interactionMode: native
    executable: /usr/local/bin/pi
    workingDirectory: .
    promptMode: interactive
    outputMode: text
    pty: true
    timeout: 24h
    secretReferences: []
  - name: pi
    interactionMode: structured
    adapter:
      protocol: meridian.adapter.v1
      executable: /usr/local/bin/meridian-harness-adapter
      arguments: ["pi-rpc", "--session-dir", "/home/capsule/.pi-sessions", "--", "/usr/local/bin/pi"]
    workingDirectory: .
    pty: false
    timeout: 24h
    secretReferences: []
