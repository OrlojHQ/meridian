# Copy this file into a repository as .meridian/project.yaml.
# The Capsule image must contain /usr/local/bin/pi
# (make capsule-pi-image → meridian-capsule-pi:dev).
# Sign in inside the Pi TUI. This trusted profile does not inject provider
# credentials; a repository cannot add secretReferences under the same name.
version: v1
harnesses:
  - name: pi
    interactionMode: native
    executable: /usr/local/bin/pi
    workingDirectory: .
    promptMode: interactive
    outputMode: text
    pty: true
    timeout: 24h
    secretReferences: []
