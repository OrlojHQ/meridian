[package]
name = "meridian-desktop"
version = "0.0.0"
description = "Meridian desktop shell"
edition = "2021"
license = "Apache-2.0"
publish = false
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
libc = "0.2"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2.8.1"
tauri-plugin-shell = "2.6.0"
tauri-plugin-updater = "2.14.1"
url = "2"
