<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Meridian</title>
    <link rel="stylesheet" href="picker.css?v=5" />
  </head>
  <body>
    <main>
      <img src="mark.svg" alt="" width="72" height="72" />
      <h1>Meridian</h1>
      <p class="lead">
        Choose the Station this window uses. The app loads that Station's web UI.
      </p>
      <!-- The shell validates the address and reports errors in #status.
           Browser validation of the hidden field would silently block
           "Local" after a bad address was typed. -->
      <section id="recent" class="recent" aria-labelledby="recent-title" hidden>
        <h2 id="recent-title">Recent Stations</h2>
        <ul id="recent-list"></ul>
      </section>
      <form id="gateway-form" novalidate>
        <fieldset>
          <legend>Station</legend>
          <label class="choice">
            <input type="radio" name="mode" value="local" checked />
            <span>
              <strong>Local</strong>
              <small>Start the bundled local Station, or use one already running here.</small>
            </span>
          </label>
          <label class="choice">
            <input type="radio" name="mode" value="remote" />
            <span>
              <strong>Another Station</strong>
              <small>A remote or other local meridiand address. The bundled Station is not started.</small>
            </span>
          </label>
          <label class="url-field" id="url-field" hidden>
            Station address
            <input
              name="url"
              type="url"
              inputmode="url"
              spellcheck="false"
              autocomplete="off"
              placeholder="https://meridian.example.com"
            />
            <small>Sign-in stays on the Station's own page. This app does not save the installation token.</small>
          </label>
        </fieldset>
        <button type="submit">Continue</button>
        <p id="status" role="status"></p>
      </form>
      <label class="setup-check">
        <input type="checkbox" id="setup-check" checked />
        <span>
          <strong>Check this computer for setup changes</strong>
          <small>When your harness settings or git identity change, Meridian offers to review them. Nothing is uploaded until you click Save.</small>
        </span>
      </label>
    </main>
    <script src="picker.js"></script>
  </body>
</html>
