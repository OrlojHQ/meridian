        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/LifecycleMutation"
      responses:
        "202":
          $ref: "#/components/responses/CapsuleAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
  /capsules/{capsuleId}/retry:
    post:
      operationId: retryCapsule
      summary: Retry failed preparation in the same Capsule
      tags: [capsules]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/LifecycleMutation"
      responses:
        "202":
          $ref: "#/components/responses/CapsuleAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
  /capsules/{capsuleId}/delete:
    post:
      operationId: deleteCapsule
      summary: Request Capsule deletion
      description: Active Runs and Thread sessions block deletion. Capsule deletion retains encrypted Thread history; use the explicitly confirmed Thread delete endpoint to crypto-shred a transcript.
      tags: [capsules]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/LifecycleMutation"
      responses:
        "202":
          $ref: "#/components/responses/CapsuleAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
  /capsules/{capsuleId}/runs:
    post:
      operationId: startRun
      summary: Start a Run from a Capsule harness profile
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRunRequest"
      responses:
        "202":
          description: Run accepted
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        default:
          $ref: "#/components/responses/DefaultError"
    get:
      operationId: listRuns
      summary: List a Capsule's Runs
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Run page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
  /runs/{runId}:
    get:
      operationId: getRun
      summary: Get a Run
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
  /runs/{runId}/cancel:
    post:
      operationId: cancelRun
      summary: Request Run cancellation
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/LifecycleMutation"
      responses:
        "202":
          description: Cancellation accepted
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        default:
          $ref: "#/components/responses/DefaultError"
  /runs/{runId}/events:
    get:
      operationId: listRunEvents
      summary: Replay ordered, content-free Run events after a stable cursor
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/After"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: Ordered Run event page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunEventPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
  /runs/{runId}/attach-ticket:
    post:
      operationId: createRunAttachTicket
      summary: Mint a short-lived, scoped, in-memory PTY attach ticket
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: after
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
      responses:
        "201":
          description: Attach ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachTicket"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
  /runs/{runId}/events/stream:
    get:
      operationId: streamRunEvents
      summary: Follow ordered Run events using Server-Sent Events
      description: Reconnect with Last-Event-ID or the after cursor. Event IDs are stable durable Run event sequences.
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/After"
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Server-Sent Event stream
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
  /runs/{runId}/attach:
    get:
      operationId: attachRunWebSocket
      summary: Upgrade to the reconnectable PTY WebSocket
      description: Binary client frames are PTY input. JSON text frames carry resize controls. Server text frames carry ordered output events with cursors.
      security: []
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: ticket
          in: query
          required: true
          schema:
            type: string
            minLength: 32
      responses:
        "101":
          description: WebSocket protocol switch
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/DefaultError"
  /capsules/{capsuleId}/shell/attach-ticket:
    post:
      operationId: createShellAttachTicket
      summary: Start the Capsule workspace shell if needed and mint an attach ticket
      description: The shell runs in the Capsule workspace. It ends when the Capsule stops. A new ticket after the shell exits starts another shell.
      tags: [capsules]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
        - name: columns
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 80}
        - name: rows
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 24}
      responses:
        "201":
          description: Attach ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachTicket"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
  /capsules/{capsuleId}/shell/attach:
    get:
      operationId: attachShellWebSocket
      summary: Upgrade to the workspace shell WebSocket
      description: Binary frames are shell input and output. A JSON text frame of type exit means the shell ended. A JSON text frame of type resize sets the terminal size.
      security: []
      tags: [capsules]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
        - name: ticket
          in: query
          required: true
          schema: {type: string, minLength: 32}
      responses:
        "101":
          description: WebSocket protocol switch
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/DefaultError"
  /capsules/{capsuleId}/previews:
    get:
      operationId: listCapsulePreviewPorts
      summary: Discover bounded listening HTTP ports owned by a Capsule
      description: Available only when the effective preview capability is true.
      tags: [previews]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
      responses:
        "200":
          description: Discovered Capsule-local preview ports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewPortPage"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        default:
          $ref: "#/components/responses/DefaultError"
  /capsules/{capsuleId}/previews/{port}/tickets:
    post:
      operationId: createCapsulePreviewTicket
      summary: Mint a short-lived Capsule and port-scoped preview URL
      description: URLs are reusable until expiry and are revoked when the Capsule is deleted or sealed.
      tags: [previews]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
        - $ref: "#/components/parameters/PreviewPort"
      responses:
        "201":
          description: Short-lived loopback preview URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewTicket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
  /capsules/{capsuleId}/git/status:
    get:
      operationId: getCapsuleGitStatus
      summary: Get bounded porcelain Git status
      tags: [capsules]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
      responses:
        "200":
          description: Git status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        default:
          $ref: "#/components/responses/DefaultError"
  /capsules/{capsuleId}/git/diff:
    get:
      operationId: getCapsuleGitDiff
      summary: Get a bounded unified working-tree diff
      tags: [capsules]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
      responses:
        "200":
          description: Git diff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        default:
          $ref: "#/components/responses/DefaultError"
  /capsules/{capsuleId}/files:
    get:
      operationId: listCapsuleFiles
      summary: List a bounded Capsule workspace directory
      description: Available only for a Ready Capsule. Private Git metadata and the supervisor marker are never exposed.
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
        - name: path
          in: query
          schema: { type: string, maxLength: 4096 }
        - name: after
          in: query
          schema: { type: string, maxLength: 255 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 512, default: 128 }
      responses:
        "200":
          description: Bounded lexicographically ordered directory page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceFilePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
  /capsules/{capsuleId}/files/content:
    get:
      operationId: readCapsuleFile
      summary: Read one bounded regular workspace file
      description: Content is base64 encoded in JSON and is binary-safe. Symlinks and files over the supervisor bound are rejected.
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
        - name: path
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 4096 }
      responses:
        "200":
          description: Bounded file content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceFile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          description: File exceeds the browser read bound
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
  /capsules/{capsuleId}/workspace:
    get:
      operationId: exportCapsuleWorkspace
      summary: Stream a bounded portable Capsule workspace archive
      description: Uses installation authentication in the Authorization header. The archive is never addressed by a token in the URL and is serialized against Moment and Delivery maintenance.
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
      responses:
        "200":
          description: Portable Moment-contract tar stream
          headers:
            Meridian-Repository-URL:
              description: Base64url-encoded Project repository URL used for fail-closed local worktree verification.
              schema: { type: string }
            Meridian-Git-Branch:
              schema: { type: string }
            Meridian-Git-Head:
              schema: { type: string }
            Meridian-Git-Dirty:
              schema: { type: string }
          content:
            application/x-tar:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
  /capsules/{capsuleId}/deliveries/inspection:
    get:
      operationId: inspectCapsuleDelivery
      summary: Inspect exact Git objects for Delivery approval
      tags: [deliveries]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
      responses:
        "200":
          description: Exact current Git state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryInspection" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
  /capsules/{capsuleId}/deliveries:
    post:
      operationId: createCapsuleDelivery
      summary: Commit and push an explicitly approved reviewed Git state
      description: Approval binds the exact Capsule resource version, HEAD, and worktree tree. Only one exact non-protected refs/heads destination is pushed.
      tags: [deliveries]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDeliveryRequest" }
      responses:
        "201":
          description: Durable Delivery result
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delivery" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
    get:
      operationId: listCapsuleDeliveries
      summary: List durable Delivery resources
      tags: [deliveries]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Delivery page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryPage" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/DefaultError" }
  /deliveries/{deliveryId}:
    get:
      operationId: getDelivery
      summary: Get a durable Delivery
      tags: [deliveries]
      parameters:
        - $ref: "#/components/parameters/DeliveryId"
      responses:
        "200":
          description: Delivery resource
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delivery" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/DefaultError" }
  /deliveries/{deliveryId}/approve:
    post:
      operationId: approveDelivery
      summary: Approve a proposed Delivery and bind the reviewed Git objects
      description: >-
        Operator-only. Turns a proposed Delivery into the existing queued
        execute path. Approval binds the exact Capsule resource version, HEAD,
        and worktree tree. Capsules cannot call this.
      tags: [deliveries]
      parameters:
        - $ref: "#/components/parameters/DeliveryId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApproveDeliveryRequest" }
      responses:
        "200":
          description: Approved Delivery, possibly still executing
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delivery" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
  /deliveries/{deliveryId}/reject:
    post:
      operationId: rejectDelivery
      summary: Reject a proposed Delivery
      description: Operator-only. Capsules cannot call this. A rejected Delivery is terminal and is never executed.
      tags: [deliveries]
      parameters:
        - $ref: "#/components/parameters/DeliveryId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RejectDeliveryRequest" }
      responses:
        "200":
          description: Rejected Delivery
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delivery" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
  /capsules/{capsuleId}/moments:
    post:
      operationId: captureMoment
      summary: Capture an immutable filesystem Moment
      tags: [moments]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureMomentRequest"
      responses:
        "201":
          description: Moment captured and published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Moment"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
    get:
      operationId: listMoments
      summary: List a Capsule Timeline's Moments
      tags: [moments]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Moment page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MomentPage"
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/DefaultError" }
  /moments/{momentId}:
    get:
      operationId: getMoment
      summary: Get an immutable Moment
      tags: [moments]
      parameters:
        - $ref: "#/components/parameters/MomentId"
      responses:
        "200":
          description: Moment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Moment"
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/DefaultError" }
  /timelines/{timelineId}:
    get:
      operationId: getTimeline
      summary: Get a Timeline and its ancestry
      tags: [timelines]
      parameters:
        - $ref: "#/components/parameters/TimelineId"
      responses:
        "200":
          description: Timeline and ancestry from current to root
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineView"
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/DefaultError" }
  /moments/{momentId}/shards:
    post:
      operationId: createShard
      summary: Create a new Capsule and Timeline from a Moment
      tags: [timelines]
      parameters:
        - $ref: "#/components/parameters/MomentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDescendantRequest"
      responses:
        "202":
          description: Descendant restore accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DescendantResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
  /capsules/{capsuleId}/rewind:
    post:
      operationId: rewindCapsule
      summary: Create a non-destructive descendant from an earlier Moment
      tags: [timelines]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RewindRequest"
      responses:
        "202":
          description: Rewind descendant restore accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DescendantResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
  /capsules/{capsuleId}/seal:
    post:
      operationId: sealCapsule
      summary: Capture a final Moment and permanently seal a Capsule
      description: Active Runs and Thread sessions block capture/seal. Sealing retains encrypted Thread history and does not crypto-shred transcript keys.
      tags: [moments]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/LifecycleMutation"
      responses:
        "201":
          description: Capsule sealed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SealResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
  /auth/mode:
    get:
      operationId: getAuthenticationMode
      summary: Report how this installation signs people in
      description: >-
        Single-user mode accepts the installation token and the loopback
        browser session. Team mode (ADR 0046) signs members in through the
        configured OIDC issuer; the installation token is then break-glass
        administration only.
      security: []
      tags: [authentication]
      responses:
        "200":
          description: Authentication mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationMode"
        default:
          $ref: "#/components/responses/DefaultError"
  /auth/oidc/start:
    get:
      operationId: startOidcSignIn
      summary: Redirect the browser to the OIDC issuer to sign in
      description: >-
        Starts an authorization code sign-in with PKCE. State, nonce, and the
        PKCE verifier stay in daemon memory and are single-use. Before the
        installation is claimed, this sign-in can only claim it. The desktop
        shell (ADR 0047) opens this in the system browser with all three
        desktop parameters; the callback then hands off to the shell's
        loopback listener instead of setting a cookie in that browser.
      security: []
      tags: [authentication]
      parameters:
        - name: desktopPort
          in: query
          description: The desktop shell's loopback listener port on 127.0.0.1.
          schema:
            type: integer
            minimum: 1024
            maximum: 65535
        - name: desktopState
          in: query
          description: 32 random bytes, base64url; echoed to the listener.
          schema:
            type: string
            minLength: 43
            maxLength: 43
        - name: desktopChallenge
          in: query
          description: >-
            Base64url SHA-256 of the verifier the shell keeps for
            redeemDesktopSignIn.
          schema:
            type: string
            minLength: 43
            maxLength: 43
      responses:
        "302":
          description: Redirect to the OIDC issuer
          headers:
            Location:
              schema:
                type: string
        default:
          $ref: "#/components/responses/DefaultError"
  /auth/oidc/callback:
    get:
      operationId: completeOidcSignIn
      summary: OIDC redirect target; completes a sign-in
      description: >-
        Authorized by the single-use state. In team mode it sets an HttpOnly
        SameSite=Strict session cookie. Before the claim it sets a short-lived
        claim cookie instead. A desktop sign-in sets no cookie: it redirects
        to http://127.0.0.1:{desktopPort}/meridian-sign-in with the shell's
        state and a single-use ticket. It answers with a redirect, or an
        HTML page that names no account.
      security: []
      tags: [authentication]
      parameters:
        - name: state
          in: query
          schema:
            type: string
        - name: code
          in: query
          schema:
            type: string
      responses:
        "303":
          description: Signed in; redirect to the web UI
        "400":
          description: The sign-in failed or is not allowed
          content:
            text/html:
              schema:
                type: string
        default:
          $ref: "#/components/responses/DefaultError"
  /auth/claim:
    post:
      operationId: claimInstallation
      summary: Claim the installation for the signed-in OIDC identity and turn on team mode
      description: >-
        Needs both the installation token in the Authorization header and the
        claim cookie from an OIDC sign-in in the same browser. Binds that
        identity to the bootstrap owner, turns on team mode, and signs the
        browser in. It can happen once.
      tags: [authentication]
      responses:
        "204":
          description: Installation claimed; the browser is signed in
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
  /auth/me:
    get:
      operationId: getCurrentMember
      summary: Describe the signed-in member
      tags: [authentication]
      responses:
        "200":
          description: The signed-in member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/DefaultError"
  /auth/sign-out:
    post:
      operationId: signOut
      summary: End the current browser session
      tags: [authentication]
      responses:
        "204":
          description: Signed out
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/DefaultError"
  /auth/sessions:
    get:
      operationId: listSessions
      summary: List the signed-in member's browser sessions
      tags: [authentication]
      responses:
        "200":
          description: Sessions, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/DefaultError"
  /auth/sessions/{sessionId}/revoke:
    post:
      operationId: revokeSession
      summary: Revoke one of the signed-in member's sessions
      tags: [authentication]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        "204":
          description: Session revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
  /auth/tokens:
    get:
      operationId: listPersonalAccessTokens
      summary: List the signed-in member's personal access tokens
      description: Token values are never returned after minting.
      tags: [authentication]
      responses:
        "200":
          description: Tokens, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalAccessTokenPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: mintPersonalAccessToken
      summary: Mint a personal access token for the CLI or TUI
      description: >-
        Team mode only, and only from a signed-in browser session; a token
        cannot mint another. The value carries the mrd_pat_ prefix, is shown
        once in this response, and is stored only as a digest. Tokens expire
        (90 days by default, at most 365) and can be read-only.
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MintPersonalAccessTokenRequest"
      responses:
        "201":
          description: Minted token; the value is shown only here
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MintedPersonalAccessToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/DefaultError"
  /auth/tokens/{tokenId}/revoke:
    post:
      operationId: revokePersonalAccessToken
      summary: Revoke one of the signed-in member's personal access tokens
      tags: [authentication]
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        "204":
          description: Token revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
  /users:
    get:
      operationId: listMembers
      summary: List the installation's members
      description: >-
        Team mode, for an admin or the break-glass installation token. Admins
        manage membership; they cannot read or change another member's
        objects.
      tags: [members]
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
  /users/{userId}/disable:
    post:
      operationId: disableMember
      summary: Disable a member, revoking their sessions, tokens, tickets, and gateway leases
      tags: [members]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        "204":
          description: Done
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"
  /users/{userId}/enable:
    post:
      operationId: enableMember
      summary: Re-enable a member; their old sessions and tokens stay revoked
      tags: [members]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        "204":
          description: Done
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"
  /users/{userId}/revoke-credentials:
    post:
      operationId: revokeMemberCredentials
      summary: Revoke every session and token of a member
      tags: [members]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        "204":
          description: Done
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"
  /users/{userId}/identity-rebind:
    post:
      operationId: beginMemberIdentityRebind
      summary: Start OIDC identity recovery for the bootstrap owner (break-glass only)
      description: >-
        Requires the installation bearer in team mode, and userId must be the
        bootstrap owner (usr_bootstrap_owner); any other member is refused
        with 400, since rebinding them would let the bearer's holder sign in
        as them. Returns a sign-in URL
        and a single-use completion token bound to this member for ten minutes.
        Open the URL as the replacement identity. The OIDC callback only
        verifies that identity; it creates neither a member nor a session.
        Keep the completion token private and use it with the installation
        bearer to complete the rebind. Normal member admins cannot do this.
      tags: [members]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, maxLength: 128 }
      responses:
        "201":
          description: Recovery started; never cache the completion token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityRebind"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/DefaultError" }
  /users/{userId}/identity-rebind/complete:
    post:
      operationId: completeMemberIdentityRebind
      summary: Rebind a verified OIDC identity and revoke member credentials (break-glass only)
      description: >-
        Requires the installation bearer and the completion token. Returns
        202 until the browser finishes sign-in. Consumes the token once
        verified, even if the rebind fails. Before the identity changes it
        revokes the owner's personal Claude and ChatGPT logins (ADR 0038);
        if that fails, nothing changes. Replaces only the identity and
        display fields on the existing member, preserving role, disabled
        state, and owned objects. An identity held by another member or a
        concurrent identity change is refused. Revokes sessions and personal
        access tokens and appends the audit record atomically. Drops live
        tickets and gateway leases. The replacement identity signs in again;
        this operation issues no credentials.
      tags: [members]
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "202":
          description: Waiting for browser sign-in; retry after two seconds
        "204":
          description: Identity rebound; all old member sessions and tokens revoked
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/DefaultError" }
  /users/{userId}/transfer:
    post:
      operationId: transferMemberObjects
      summary: Move a departed member's work to another member (break-glass only)
      description: >-
        The member must be disabled. Their Projects with everything under
        them, their secrets (re-wrapped for the new owner), and their harness
        setups move to the receiving member in one transaction. Provider
        connections do not move, since a personal login stays with its
        account holder; Project grants of them are dropped. Refused when the
        receiving member already has a secret of the same name.
      tags: [members]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [toUserId]
              properties:
                toUserId:
                  type: string
                  maxLength: 128
      responses:
        "204":
          description: Moved
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"
  /users/{userId}/delete-objects:
    post:
      operationId: deleteMemberObjects
      summary: Delete a departed member's work (break-glass only)
      description: >-
        The member must be disabled. Starts deletion of each of their
        Projects, crypto-shreds their secrets, revokes their provider
        connections, and deletes their harness setups. The member's row and
        audit records stay. Older backups still hold their ciphertext.
      tags: [members]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        "200":
          description: What was deleted or started
          content:
            application/json:
              schema:
                type: object
                required: [projects, secrets, connections, setups]
                properties:
                  projects:
                    type: integer
                  secrets:
                    type: integer
                  connections:
                    type: integer
                  setups:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"
  /users/{userId}/role:
    put:
      operationId: setMemberRole
      summary: Grant or remove the admin role
      tags: [members]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role:
                  type: string
                  enum: [member, admin]
      responses:
        "204":
          description: Role set
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"
  /auth/desktop/redeem:
    post:
      operationId: redeemDesktopSignIn
      summary: Redeem a desktop sign-in handoff in the shell's webview
      description: >-
        ADR 0047. Authorized by the ticket the callback sent to the shell's
        loopback listener plus the verifier only that shell holds, in the
        body so neither appears in a URL. Requires a same-origin Origin
        header. The ticket is single-use, even when the verifier is wrong,
        and expires two minutes after the callback. Sets the cookie the
        browser callback would have set (a session, or a claim cookie before
        the claim) and names the page to open next.
      security: []
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ticket, verifier]
              properties:
                ticket:
                  type: string
                  maxLength: 128
                verifier:
                  type: string
                  maxLength: 128
      responses:
        "200":
          description: Signed in, or ready to claim
          content:
            application/json:
              schema:
                type: object
                required: [next]
                properties:
                  next:
                    type: string
                    description: A /ui/ path to open next.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Not same-origin, or this account may not sign in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
  /auth/device:
    post:
      operationId: beginDeviceLogin
      summary: Start meridian login with the OAuth device authorization grant
      description: >-
        Team mode, when the OIDC issuer offers device sign-in. Returns a code
        for the member to enter at the issuer and a handle only this client
        knows. Without device sign-in, mint a personal access token in the
        web UI instead.
      security: []
      tags: [authentication]
      responses:
        "201":
          description: Device login started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceLogin"
        "422":
          $ref: "#/components/responses/Unprocessable"
        default:
          $ref: "#/components/responses/DefaultError"
  /auth/device/token:
    post:
      operationId: pollDeviceLogin
      summary: Collect the personal access token once the member approves
      description: >-
        Authorized by the handle from beginDeviceLogin, in the body so it
        never appears in a URL. Answers 202 until the member approves at the
        issuer, then returns a new personal access token, once.
      security: []
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [handle]
              properties:
                handle:
                  type: string
                  maxLength: 128
      responses:
        "200":
          description: Approved; the token is shown only here
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token:
                    type: string
        "202":
          description: Waiting for approval
          content:
            application/json:
              schema:
                type: object
                required: [status, intervalSeconds]
                properties:
                  status:
                    type: string
                    enum: [pending]
                  intervalSeconds:
                    type: integer
        "403":
          description: The member refused, or the code expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
  /auth/browser-session:
    post:
      operationId: createBrowserSession
      summary: Exchange installation bearer authentication for an HttpOnly same-origin browser session
      description: The installation token is accepted only in the Authorization header and is never returned. The session cookie is scoped to this origin and daemon lifetime. Remote bootstrap requires HTTPS; plain HTTP is accepted only for verified loopback source and Host addresses.
      tags: [authentication]
      responses:
        "204":
          description: Browser session established
          headers:
            Set-Cookie:
              description: HttpOnly SameSite=Strict browser session cookie
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/DefaultError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Meridian installation token
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    CapsuleId:
      name: capsuleId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    CheckRunId:
      name: checkRunId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ThreadId:
      name: threadId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ProjectThreadIntentId:
      name: intentId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    LinkId:
      name: linkId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    RoutineId:
      name: routineId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    GrantId:
      name: grantId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    NoteName:
      name: noteName
      in: path
      required: true
      description: Note name without the .md suffix.
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9-]{0,47}$"
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    MomentId:
      name: momentId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    TimelineId:
      name: timelineId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    DeliveryId:
      name: deliveryId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    PreviewPort:
      name: port
      in: path
      required: true
      schema:
        type: integer
        minimum: 1024
        maximum: 65535
    After:
      name: after
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  headers:
    ETag:
      description: Resource version as a quoted decimal value
      schema:
        type: string
  requestBodies:
    LifecycleMutation:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LifecycleMutationRequest"
  responses:
    Unauthorized:
      description: Missing or invalid installation authentication
      headers:
        WWW-Authenticate:
          description: Bearer authentication challenge
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ThreadMutation:
      description: Thread lifecycle mutation completed
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Thread" }
    ThreadSessionMutation:
      description: Structured session mutation accepted
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ThreadMutationResult" }
    CapsuleAccepted:
      description: Lifecycle intent accepted
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Capsule"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Resource version or idempotency conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Locked:
      description: Transcript installation key is missing or does not match the encrypted Thread
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Corrupt:
      description: Encrypted transcript or ordered event stream is corrupt
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unprocessable:
      description: Unsupported capability or illegal lifecycle transition
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TooManyRequests:
      description: Request rate limit exceeded
      headers:
        Retry-After:
          description: Seconds until retry
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    DefaultError:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    ProbeResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, not_ready]
    Capabilities:
      type: object
      required: [providerVersion, attach, run, git, pause, snapshot, clone, preview, browse, delivery, resourceMetrics, isolation]
      properties:
        providerVersion:
          type: string
        isolation:
          $ref: "#/components/schemas/IsolationClass"
          description: >
            The isolation class the provider actually verified against its own
            runtime configuration, never merely what was declared. A provider
            without a verifiable boundary reports container (ADR 0050).
        attach:
          type: boolean
        run:
          type: boolean
        structured:
          type: boolean
          description: True only when the provider and runtime expose meridian.adapter.v1 structured sessions.
        structuredProtocol:
          type: string
          enum: [meridian.adapter.v1]
        ptyFallback:
          type: boolean
          description: True when native Run and PTY attachment remain available independently of structured profiles.
        git:
          type: boolean
        pause:
          type: boolean
        snapshot:
          type: boolean
          description: False unless the provider and application share a safe Moment storage contract; CSI discovery alone is insufficient.
        clone:
          type: boolean
          description: False unless provider-native restore preserves Meridian lineage and failure semantics.
        preview:
          type: boolean
          description: False unless a provider exposes bounded port discovery and Capsule-scoped proxying.
        browse:
          type: boolean
          description: False unless a provider exposes the authenticated bounded workspace browser.
        delivery:
          type: boolean
          description: False unless a provider exposes authenticated exact-object commit and exact-ref push operations.
        resourceMetrics:
          type: boolean
          description: False when provider resource metrics are not exposed by the public API.
        coordination:
          $ref: "#/components/schemas/CoordinationCapability"
        harnessImages:
          type: array
          description: >
            Installation-known harness packs the operator may apply on a
            Project. Not a boolean capability. Spawn still uses only names
            stored on that Project.
          items:
            $ref: "#/components/schemas/HarnessImage"
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        repositoryUrl:
          type: string
          maxLength: 4096
          description: >
            Clone URL, GitHub owner/repo, or GitHub SSH URL. Owner/repo and
            GitHub SSH are stored as HTTPS. An absolute local path is also
            accepted.
        setup:
          type: array
          maxItems: 128
          description: Setup executable followed by its arguments; never interpreted by a shell.
          items:
            type: string
            minLength: 1
            maxLength: 4096
        imageReference:
          type: string
          maxLength: 1024
          description: Default Capsule image reference; Docker resolves it to an immutable image identity.
        harnessImages:
          type: array
          maxItems: 16
          description: >
            Named harness-pack images allowlisted on this Project. Capsule
            creation and Project Thread spawn resolve a selected name to one
            of these images; clients never supply a free image reference at
            spawn time.
          items:
            $ref: "#/components/schemas/HarnessImage"
        gitSecretName:
          type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_.-]{0,127}$"
          description: Name of a git_https secret authorized only for HTTPS clone.
        harnessSecretNames:
          type: array
          maxItems: 64
          uniqueItems: true
          description: Explicit allowlist of harness_env secret names.
          items:
            type: string
            pattern: "^[A-Za-z_][A-Za-z0-9_.-]{0,127}$"
        gitPushSecretName:
          type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_.-]{0,127}$"
          description: Name of a git_push secret authorized only for one exact Delivery push.
        githubAPISecretName:
          type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_.-]{0,127}$"
          description: Name of a github_api secret used only by meridiand to open a pull request.
        commitAuthorName:
          type: string
          maxLength: 320
        commitAuthorEmail:
          type: string
          maxLength: 320
        defaultBaseBranch:
          type: string
          maxLength: 255
        requiredIsolation:
          $ref: "#/components/schemas/IsolationClass"
          description: >
            Minimum isolation class every Capsule in this Project must run
            behind (ADR 0050). Omit for no requirement. Set once at creation;
            later requests cannot change it.
    PatchProjectRequest:
      type: object
      required: [expectedResourceVersion, harnessImages]
      properties:
        expectedResourceVersion:
          type: integer
          format: int64
          minimum: 1
        harnessImages:
          type: array
          maxItems: 16
          description: Replacement allowlist. Empty clears it and spawn uses the default image.
          items:
            $ref: "#/components/schemas/HarnessImage"
    HarnessImage:
      type: object
      required: [name, imageReference]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Harness pack/profile name selected by Capsule creation or Thread spawn.
        imageReference:
          type: string
          minLength: 1
          maxLength: 1024
          description: Capsule image that contains that harness; Docker resolves it to an immutable identity.
        interactionModes:
          type: array
          readOnly: true
          maxItems: 2
          uniqueItems: true
          description: >
            Session kinds the pack's trusted profile supports. Present only on
            installation catalog entries in capabilities, and only when the
            pack ships a trusted profile under its name. Absent means the
            repository's harness configuration decides, so nothing is known
            before a Capsule exists. A catalog pack without `structured`
            cannot start a Project Thread. Ignored in requests and never
            stored on a Project.
          items:
            type: string
            enum: [native, structured]
    PutSecretRequest:
      type: object
      required: [purpose]
      properties:
        purpose:
          type: string
          enum: [git_https, git_push, github_api, harness_env]
        value:
          type: string
          maxLength: 262144
          description: Token or harness environment value. Never returned.
        username:
          type: string
          maxLength: 4096
          description: Git username, encrypted with the password/token.
        password:
          type: string
          maxLength: 262144
          description: Git password or token. Never returned.
        expectedResourceVersion:
          type: integer
          format: int64
          minimum: 1
          description: Required when replacing an existing name; omit when creating.
    DeleteSecretRequest:
      type: object
      required: [expectedResourceVersion]
      properties:
        expectedResourceVersion:
          type: integer
          format: int64
          minimum: 1
    CreateCapsuleRequest:
      type: object
      required: [name]
      properties:
        setup:
          type: string
          description: Saved setup ID, clean to omit personal setups, or omitted to pin current defaults.
        name:
          type: string
          minLength: 1
          maxLength: 128
        harness:
          type: string
          minLength: 1
          maxLength: 128
          description: Optional Project-allowlisted native harness pack to freeze on the Capsule and launch when Ready.
    LifecycleMutationRequest:
      type: object
      required: [expectedResourceVersion]
      properties:
        expectedResourceVersion:
          type: integer
          format: int64
          minimum: 1
        force:
          type: boolean
          description: Stop active sessions, ending any that do not answer, then delete.
    PromoteCapsuleRequest:
      type: object
      required: [expectedResourceVersion]
      properties:
        expectedResourceVersion:
          type: integer
          format: int64
          minimum: 1
        detach:
          type: boolean
          default: false
          description: Close the link to the lead. The lead can no longer message or hear from this Capsule.
    RenameCapsuleRequest:
      type: object
      required: [name, expectedResourceVersion]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        expectedResourceVersion:
          type: integer
          format: int64
          minimum: 1
    CaptureMomentRequest:
      type: object
      required: [name, expectedResourceVersion]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        expectedResourceVersion:
          type: integer
          format: int64
          minimum: 1
    CreateDescendantRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
    RewindRequest:
      type: object
      required: [momentId, name]
      properties:
        momentId:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          maxLength: 128
    Project:
      type: object
      required: [id, name, createdAt, updatedAt, resourceVersion]
      properties:
        id:
          type: string
        name:
          type: string
        repositoryUrl:
          type: string
        setup:
          type: array
          items:
            type: string
        imageReference:
          type: string
        harnessImages:
          type: array
          items:
            $ref: "#/components/schemas/HarnessImage"
        gitSecretName:
          type: string
        harnessSecretNames:
          type: array
          items:
            type: string
        gitPushSecretName: { type: string }
        githubAPISecretName: { type: string }
        commitAuthorName: { type: string }
        commitAuthorEmail: { type: string }
        defaultBaseBranch: { type: string }
        requiredIsolation:
          $ref: "#/components/schemas/IsolationClass"
          description: >
            Minimum isolation class every Capsule in this Project must run
            behind (ADR 0050). Omitted when the Project has no requirement.
        state:
          $ref: "#/components/schemas/ProjectState"
        failure:
          type: string
          description: Why deletion stopped. Set when state is failed.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        resourceVersion:
          type: integer
          format: int64
          minimum: 1
    ProjectState:
      type: string
      description: >
        active is a live Project. deleting means cascade cleanup is in
        progress. failed means an owned container could not be removed.
        deleted means the Project and its transcripts, artifacts, environment,
        and exclusive named secrets are gone.
      enum: [active, deleting, failed, deleted]
    IsolationClass:
      type: string
      description: >
        Strength of the boundary a Capsule runs behind (ADR 0050). container
        is ordinary namespace sharing. sandbox adds a user-space kernel
        boundary. microvm adds a hardware virtualization boundary. A stronger
        class satisfies a weaker requirement. Empty means no requirement or
        none declared.
      enum: [container, sandbox, microvm]
    Secret:
      type: object
      required: [id, name, purpose, createdAt, updatedAt, resourceVersion]
      description: Secret metadata only; plaintext and ciphertext are never returned.
      properties:
        id: { type: string }
        name: { type: string }
        purpose:
          type: string
          enum: [git_https, git_push, github_api, harness_env]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        resourceVersion: { type: integer, format: int64, minimum: 1 }
    SecretPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Secret"
        nextCursor:
          type: string
    GitHubConnection:
      type: object
      required: [connected, deviceFlow]
      description: GitHub connection metadata. The token is never included.
      properties:
        connected: { type: boolean }
        deviceFlow:
          type: boolean
          description: True when this Station can start the GitHub device flow.
        login: { type: string }
        status:
          type: string
          enum: [active, needs_reconnect]
        reason:
          type: string
          enum: [invalid, expired, missing_access]
        scopes: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        resourceVersion: { type: integer, format: int64, minimum: 1 }
    DisconnectGitHubRequest:
      type: object
      required: [expectedResourceVersion]
      properties:
        expectedResourceVersion: { type: integer, format: int64, minimum: 1 }
    UseHostGitHubRequest:
      type: object
      required: [expectedResourceVersion]
      properties:
        expectedResourceVersion: { type: integer, format: int64, minimum: 0 }
    ConnectGitHubTokenRequest:
      type: object
      required: [token, expectedResourceVersion]
      properties:
        token: { type: string, minLength: 8, maxLength: 2048 }
        expectedResourceVersion: { type: integer, format: int64, minimum: 0 }
    BeginGitHubDeviceRequest:
      type: object
      required: [expectedResourceVersion]
      properties:
        expectedResourceVersion: { type: integer, format: int64, minimum: 0 }
    HostGitHubLogin:
      type: object
      required: [available, state]
      description: >
        Whether this computer's GitHub CLI login can be reused. The token
        is never included.
      properties:
        available:
          type: boolean
          description: True when gh is signed in and a login was read from gh auth status.
        login:
          type: string
          description: The signed-in account, when state is signed_in.
        state:
          type: string
          enum: [signed_in, not_signed_in, token_unreadable, not_found, unavailable]
          description: >
            signed_in: gh was found and reports an account.
            not_signed_in: gh was found and is not signed in.
            token_unreadable: gh knows an account but could not read its token.
            not_found: gh was not found.
            unavailable: this request must not look for a host login.
        path:
          type: string
          description: Absolute path of the gh binary when one was found.
        searched:
          type: array
          maxItems: 32
          description: Locations checked while looking for gh. A token is never included.
          items:
            type: string
            maxLength: 4096
        detail:
          type: string
          maxLength: 4096
          description: A short explanation safe to show. A token is never included.
    GitHubDevice:
      type: object
      required: [userCode, verificationUri, expiresAt, intervalSeconds]
      properties:
        userCode: { type: string }
        verificationUri: { type: string }
        expiresAt: { type: string, format: date-time }
        intervalSeconds: { type: integer, minimum: 1 }
    GitHubDeviceStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, connected, denied, expired]
        connection:
          $ref: "#/components/schemas/GitHubConnection"
    GitHubRepo:
      type: object
      required: [fullName, private, url]
      properties:
        fullName: { type: string }
        private: { type: boolean }
        description: { type: string }
        defaultBranch: { type: string }
        url: { type: string }
    GitHubRepoPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GitHubRepo"
    ProjectEnvironment:
      type: object
      required: [enabled, generation, setup, imageReference, resourceVersion]
      properties:
        enabled: {type: boolean}
        generation: {type: integer, format: int64}
        setup: {type: array, items: {type: string}}
        imageReference: {type: string}
        resourceVersion: {type: integer, format: int64}
        latest: {$ref: "#/components/schemas/PreparationProgress"}
    EnvironmentMutation:
      type: object
      required: [expectedResourceVersion]
      properties:
        enabled: {type: boolean}
        setup: {type: array, maxItems: 128, items: {type: string, maxLength: 4096}}
        rebuild: {type: boolean}
        expectedResourceVersion: {type: integer, format: int64, minimum: 1}
    CheckCommand:
      type: object
      required: [name, argv, timeoutSeconds]
      description: An executable and its arguments. Meridian does not start a shell.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        argv:
          type: array
          minItems: 1
          maxItems: 128
          items: { type: string, minLength: 1, maxLength: 4096 }
        timeoutSeconds:
          type: integer
          minimum: 1
          maximum: 3600
    ProjectChecks:
      type: object
      required: [checks, autoRework, maxReworkAttempts, resourceVersion]
      properties:
        checks:
          type: array
          maxItems: 16
          items: { $ref: "#/components/schemas/CheckCommand" }
        autoRework: { type: boolean }
        maxReworkAttempts:
          type: integer
          minimum: 0
          maximum: 10
          description: >
            Total tries, including the first. 0 runs the checks once and does
            not send the agent back.
        resourceVersion: { type: integer, format: int64, minimum: 1 }
        updatedAt: { type: string, format: date-time }
    ProjectChecksUpdate:
      type: object
      required: [checks, autoRework, maxReworkAttempts, expectedResourceVersion]
      properties:
        checks:
          type: array
          maxItems: 16
          items: { $ref: "#/components/schemas/CheckCommand" }
        autoRework: { type: boolean }
        maxReworkAttempts: { type: integer, minimum: 0, maximum: 10 }
        expectedResourceVersion: { type: integer, format: int64, minimum: 1 }
    CheckSuggestion:
      type: object
      required: [checks]
      properties:
        checks:
          type: array
          items: { $ref: "#/components/schemas/CheckCommand" }
        ignored:
          type: boolean
          description: A repository file was present and was not usable.
    CheckRunRequest:
      type: object
      description: Empty object. The idempotency key is the header.
      additionalProperties: false
    CheckAutoReworkRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: false stops automatic rework for this Capsule.
    CheckResult:
      type: object
      required: [name, argv, durationMs, timedOut, outputTruncated]
      properties:
        name: { type: string }
        argv:
          type: array
          items: { type: string }
        exitCode: { type: integer }
        durationMs: { type: integer, format: int64, minimum: 0 }
        timedOut: { type: boolean }
        outputTruncated: { type: boolean }
        output:
          type: string
          description: Redacted tail of the command output. Absent when there is none.
    CheckRun:
      type: object
      required: [id, capsuleId, projectId, attempt, maxAttempts, trigger, state, reworkSent, results, resourceVersion, createdAt]
      properties:
        id: { type: string }
        capsuleId: { type: string }
        projectId: { type: string }
        threadId: { type: string }
        attempt:
          type: integer
          minimum: 1
          description: One-based try number.
        maxAttempts: { type: integer, minimum: 1 }
        trigger:
          type: string
          enum: [turn_idle, delivery_proposed, run_exit, manual]
        state:
          type: string
          enum: [queued, running, passed, failed, error, cancelled, stale]
        phase:
          type: string
          enum: [queued, running, reworking, passed, failing, stale, error]
        gitHead: { type: string }
        gitTree: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        reworkSent: { type: boolean }
        banner: { type: string }
        pullRequestSection:
          type: string
          description: Server-generated pull request text. It contains no command output.
        results:
          type: array
          items: { $ref: "#/components/schemas/CheckResult" }
        resourceVersion: { type: integer, format: int64, minimum: 1 }
        createdAt: { type: string, format: date-time }
    CheckRunPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CheckRun" }
        nextCursor: { type: string }
    ChecksSummary:
      type: object
      required: [configured, autoRework]
      description: Content-free check summary. It carries no command text and no output.
      properties:
        configured: { type: boolean }
        phase:
          type: string
          enum: [queued, running, reworking, passed, failing, stale, error]
        attempt: { type: integer, minimum: 1 }
        maxAttempts: { type: integer, minimum: 1 }
        tree: { type: string }
        head: { type: string }
        finishedAt: { type: string, format: date-time }
        reworkSent: { type: boolean }
        autoRework: { type: boolean }
        stopped: { type: boolean }
        proposalWithheld: { type: boolean }
        passed: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        runId: { type: string }
        remoteCI:
          $ref: "#/components/schemas/RemoteCISummary"
    RoutineFireTrigger:
      type: string
      enum: [clock, catch_up, manual]
    RoutineFireState:
      type: string
      enum: [skipped, missed, starting, selecting, running, cleaning, finished]
    RoutineOutcome:
      type: string
      description: >
        Content-free result. no_changes deletes the Capsule; the others keep
        it and ask for the operator.
      enum: [proposed, changed, no_changes, waiting, timed_out, failed]
    RoutineFire:
      type: object
      required: [id, routineId, trigger, scheduledFor, state, capsuleDeleted, createdAt]
      description: One tick of a routine's clock. It carries codes, never prompt text.
      properties:
        id: { type: string }
        routineId: { type: string }
        trigger: { $ref: "#/components/schemas/RoutineFireTrigger" }
        scheduledFor: { type: string, format: date-time }
        state: { $ref: "#/components/schemas/RoutineFireState" }
        outcome: { $ref: "#/components/schemas/RoutineOutcome" }
        reason:
          type: string
          maxLength: 64
          description: Skip or failure code, such as overlap, backlog, capacity, or model_unavailable.
        capsuleId: { type: string }
        threadId: { type: string }
        capsuleDeleted: { type: boolean }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    RoutineFirePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RoutineFire" }
        nextCursor: { type: string }
    Routine:
      type: object
      required:
        [id, projectId, name, harness, prompt, cadence, timeZone, maxRunSeconds, catchUpSeconds,
         maxKept, enabled, includeNotes, keptCapsules, resourceVersion, createdAt, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        name: { type: string, pattern: "^[a-z0-9-]{1,48}$" }
        harness: { type: string }
        model:
          type: string
          description: Model option ID the harness reports. Absent means the harness default.
        effort:
          type: string
          description: Reasoning effort option ID. Absent means the harness default.
        prompt: { type: string, maxLength: 32768 }
        cadence:
          type: string
          description: Five-field cron expression (minute hour day month weekday) or a macro such as @daily.
        timeZone: { type: string, description: IANA time zone name. }
        maxRunSeconds: { type: integer, minimum: 300, maximum: 86400 }
        catchUpSeconds: { type: integer, minimum: 0, maximum: 86400 }
        maxKept: { type: integer, minimum: 1, maximum: 20 }
        enabled: { type: boolean }
        includeNotes: { type: boolean, description: Scheduled Threads receive the Project's notes. }
        disabledReason:
          type: string
          description: Why Meridian turned the routine off, such as start_failures or transferred.
        nextFireAt: { type: string, format: date-time }
        lastFireAt: { type: string, format: date-time }
        keptCapsules:
          type: integer
          minimum: 0
          description: Capsules this routine kept that nobody has deleted yet.
        active: { $ref: "#/components/schemas/RoutineFire" }
        lastFire: { $ref: "#/components/schemas/RoutineFire" }
        resourceVersion: { type: integer, format: int64, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RoutineList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Routine" }
    CreateRoutineRequest:
      type: object
      required: [name, harness, prompt, cadence, timeZone]
      properties:
        name: { type: string, pattern: "^[a-z0-9-]{1,48}$" }
        harness: { type: string, minLength: 1, maxLength: 128 }
        model: { type: string, maxLength: 256 }
        effort: { type: string, maxLength: 256 }
        prompt: { type: string, minLength: 1, maxLength: 32768 }
        cadence: { type: string, minLength: 1, maxLength: 128 }
        timeZone: { type: string, minLength: 1, maxLength: 64 }
        maxRunSeconds: { type: integer, minimum: 300, maximum: 86400, default: 7200 }
        catchUpSeconds: { type: integer, minimum: 0, maximum: 86400, default: 3600 }
        maxKept: { type: integer, minimum: 1, maximum: 20, default: 5 }
        enabled: { type: boolean, default: true }
        includeNotes:
          type: boolean
          default: false
          description: Deliver the Project's notes to each scheduled Thread as files (ADR 0060).
    UpdateRoutineRequest:
      type: object
      required: [expectedResourceVersion]
      properties:
        name: { type: string, pattern: "^[a-z0-9-]{1,48}$" }
        harness: { type: string, minLength: 1, maxLength: 128 }
        model: { type: string, maxLength: 256, description: Empty uses the harness default. }
        effort: { type: string, maxLength: 256, description: Empty uses the harness default. }
        prompt: { type: string, minLength: 1, maxLength: 32768 }
        cadence: { type: string, minLength: 1, maxLength: 128 }
        timeZone: { type: string, minLength: 1, maxLength: 64 }
        maxRunSeconds: { type: integer, minimum: 300, maximum: 86400 }
        catchUpSeconds: { type: integer, minimum: 0, maximum: 86400 }
        maxKept: { type: integer, minimum: 1, maximum: 20 }
        enabled: { type: boolean }
        includeNotes: { type: boolean }
        expectedResourceVersion: { type: integer, format: int64, minimum: 1 }
    ReportedModelOption:
      type: object
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string }
        description: { type: string }
    ReportedModels:
      type: object
      required: [models, efforts]
      properties:
        models:
          type: array
          maxItems: 128
          items: { $ref: "#/components/schemas/ReportedModelOption" }
        current: { type: string }
        efforts:
          type: array
          maxItems: 16
          items: { $ref: "#/components/schemas/ReportedModelOption" }
        currentEffort: { type: string }
        threadId: { type: string }
    NoteRevisionKind:
      type: string
      enum: [operator_write, agent_write, approved_proposal, approved_with_edits, restore, delete]
    NoteWriter:
      type: string
      enum: [agent, operator]
    NoteSource:
      type: object
      description: Content-free provenance of agent text.
      properties:
        threadId: { type: string }
        capsuleId: { type: string }
        linkId: { type: string }
        linkName: { type: string }
        leadThreadId: { type: string }
        grantId: { type: string }
        workingNoteName: { type: string }
        workingNoteRevision: { type: integer, format: int64 }
        workingCapsuleId: { type: string }
    NoteSummary:
      type: object
      required: [name, revision, live, size, digest, kind, writer, agentProposed, createdAt, updatedAt]
      properties:
        name: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,47}$" }
        revision: { type: integer, format: int64, minimum: 1 }
        live: { type: boolean }
        size: { type: integer, minimum: 0, maximum: 32768 }
        digest: { type: string }
        kind: { $ref: "#/components/schemas/NoteRevisionKind" }
        writer: { $ref: "#/components/schemas/NoteWriter" }
        linkName: { type: string, description: "The subagent that wrote the head revision, if any." }
        agentProposed:
          type: boolean
          description: The head revision is agent text, written by a member or approved from a proposal.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    NoteList:
      type: object
      required: [items, liveCount, totalBytes, maxNotes, maxBytes, notesDelivery, settingsVersion, pendingProposals]
      properties:
        items:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/NoteSummary" }
        liveCount: { type: integer, minimum: 0 }
        totalBytes: { type: integer, minimum: 0 }
        maxNotes: { type: integer }
        maxBytes: { type: integer }
        notesDelivery: { $ref: "#/components/schemas/NotesDelivery" }
        settingsVersion:
          type: integer
          format: int64
          minimum: 0
          description: Pass as expectedVersion to change notesDelivery.
        pendingProposals: { type: integer, minimum: 0 }
    NoteRevision:
      type: object
      required: [revision, name, kind, writer, baseRevision, digest, size, retained, createdAt]
      properties:
        revision: { type: integer, format: int64, minimum: 1 }
        name: { type: string }
        kind: { $ref: "#/components/schemas/NoteRevisionKind" }
        writer: { $ref: "#/components/schemas/NoteWriter" }
        writerUserId: { type: string }
        source: { $ref: "#/components/schemas/NoteSource" }
        proposalId: { type: string }
        baseRevision: { type: integer, format: int64, minimum: 0 }
        restoredFrom: { type: integer, format: int64, minimum: 0 }
        digest: { type: string }
        size: { type: integer, minimum: 0 }
        retained: { type: boolean }
        createdAt: { type: string, format: date-time }
    NoteHistory:
      type: object
      required: [note, items]
      properties:
        note: { $ref: "#/components/schemas/NoteSummary" }
        items:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/NoteRevision" }
    NoteContent:
      type: object
      required: [note, revision, content, credentialShaped]
      properties:
        note: { $ref: "#/components/schemas/NoteSummary" }
        revision: { $ref: "#/components/schemas/NoteRevision" }
        content: { type: string, maxLength: 32768 }
        credentialShaped:
          type: boolean
          description: The content matches the credential-shaped checks of ADR 0024.
    WriteNoteRequest:
      type: object
      required: [content, expectedRevision]
      properties:
        content: { type: string, maxLength: 32768 }
        expectedRevision: { type: integer, format: int64, minimum: 0 }
        rename:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,47}$"
          description: Give the note a new name in the same revision.
        sourceThreadId:
          type: string
          description: The Thread a transcript selection came from, recorded as provenance.
    DeleteNoteRequest:
      type: object
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer, format: int64, minimum: 1 }
        withHistory: { type: boolean, default: false }
    RestoreNoteRequest:
      type: object
      required: [revision, expectedRevision]
      properties:
        revision: { type: integer, format: int64, minimum: 1 }
        expectedRevision: { type: integer, format: int64, minimum: 0 }
    NotesDelivery:
      type: string
      enum: [all_threads, leads_only, "off"]
    NotesDeliveryRequest:
      type: object
      required: [notesDelivery, expectedVersion]
      properties:
        notesDelivery: { $ref: "#/components/schemas/NotesDelivery" }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
    NotesDeliverySetting:
      type: object
      required: [notesDelivery, settingsVersion]
      properties:
        notesDelivery: { $ref: "#/components/schemas/NotesDelivery" }
        settingsVersion: { type: integer, format: int64, minimum: 1 }
    NoteProposalState:
      type: string
      enum: [pending, approved, approved_with_edits, rejected, stale, expired]
    NoteProposalSummary:
      type: object
      required: [id, projectId, name, delete, baseRevision, currentRevision, state, origin, digest, size, createdAt, expiresAt]
      description: Content-free.
      properties:
        id: { type: string }
        projectId: { type: string }
        name: { type: string }
        delete: { type: boolean }
        baseRevision: { type: integer, format: int64, minimum: 0 }
        currentRevision: { type: integer, format: int64, minimum: 0 }
        state: { $ref: "#/components/schemas/NoteProposalState" }
        reason:
          type: string
          enum: ["", operator, owner_changed, shredded, purged]
        origin:
          type: string
          enum: [agent, promotion]
        source: { $ref: "#/components/schemas/NoteSource" }
        digest: { type: string }
        size: { type: integer, minimum: 0 }
        resolvedRevision: { type: integer, format: int64, minimum: 0 }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    NoteProposalList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/NoteProposalSummary" }
    NoteProposalReview:
      type: object
      required: [proposal, content, currentContent, currentLive, credentialShaped]
      properties:
        proposal: { $ref: "#/components/schemas/NoteProposalSummary" }
        content: { type: string, maxLength: 32768, description: Proposed text. Untrusted agent text. }
        currentContent: { type: string, maxLength: 32768 }
        currentLive: { type: boolean }
        credentialShaped: { type: boolean }
    ApproveNoteProposalRequest:
      type: object
      required: [digest, expectedRevision]
      properties:
        digest: { type: string, minLength: 1 }
        expectedRevision: { type: integer, format: int64, minimum: 0 }
        content:
          type: string
          maxLength: 32768
          description: The operator's edited text, when it differs from the proposal.
    DeliveredNote:
      type: object
      required: [tier, name, revision, size, digest]
      properties:
        tier: { type: string, enum: [project, working] }
        name: { type: string }
        revision: { type: integer, format: int64 }
        size: { type: integer }
        digest: { type: string }
    ThreadNotes:
      type: object
      required: [choice, delivered, indexed]
      properties:
        choice:
          type: string
          enum: ["", include, exclude]
          description: The Thread's Include Project notes choice; empty follows the Project setting.
        delivered:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/DeliveredNote" }
        deliveredAt: { type: string, format: date-time }
        indexed:
          type: boolean
          description: The harness negotiated the notes index. False means it got the files without being told.
    CapsuleRoutine:
      type: object
      required: [routineId, routineName, fireId, state]
      description: Content-free note on a Capsule a routine started.
      properties:
        routineId: { type: string }
        routineName: { type: string }
        fireId: { type: string }
        state: { $ref: "#/components/schemas/RoutineFireState" }
        outcome: { $ref: "#/components/schemas/RoutineOutcome" }
    RemoteCISummary:
      type: object
      required: [state, label]
      description: Content-free GitHub CI line for the pushed commit. It has no log tail.
      properties:
        state:
          type: string
          enum: [waiting, passed, failing, reconnect, connect, unreadable, absent]
        label: { type: string }
        head: { type: string }
        attempt: { type: integer, minimum: 1 }
        maxAttempts: { type: integer, minimum: 1 }
        passed: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        pending: { type: integer, minimum: 0 }
        pullRequestUrl: { type: string }
        pushReview: { type: boolean }
        reworkSent: { type: boolean }
    RemoteCICheck:
      type: object
      required: [name, source, conclusion]
      properties:
        name: { type: string }
        source:
          type: string
          enum: [check_run, status]
        conclusion: { type: string }
        url: { type: string }
        output:
          type: string
          description: Redacted tail. Absent when there is none.
    RemoteCI:
      type: object
      required: [state, label, checks]
      properties:
        state:
          type: string
          enum: [waiting, passed, failing, reconnect, connect, unreadable, absent]
        label: { type: string }
        head: { type: string }
        attempt: { type: integer, minimum: 1 }
        maxAttempts: { type: integer, minimum: 1 }
        passed: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        pending: { type: integer, minimum: 0 }
        pullRequestUrl: { type: string }
        pushReview: { type: boolean }
        reworkSent: { type: boolean }
        checks:
          type: array
          items: { $ref: "#/components/schemas/RemoteCICheck" }
    PreparationProgress:
      type: object
      required: [stage, reused, updatedAt]
      properties:
        stage: {type: string, enum: [checkout, preparing, restoring, reclone, saving, ready]}
        reused: {type: boolean}
        detail: {type: string}
        sourceRevision: {type: string}
        updatedAt: {type: string, format: date-time}
    Capsule:
      type: object
      required:
        [id, projectId, timelineId, name, state, desiredState, restoreComplete, createdAt, updatedAt, resourceVersion]
      properties:
        preparation:
          $ref: "#/components/schemas/PreparationProgress"
        startup:
          $ref: "#/components/schemas/CapsuleStartup"
        failureCode:
          $ref: "#/components/schemas/CapsuleFailureCode"
        id:
          type: string
        projectId:
          type: string
        timelineId:
          type: string
        originMomentId:
          type: string
        name:
          type: string
        harness:
          type: string
          description: Immutable native launcher harness selected when the Capsule was created.
        imageReference:
          type: string
          description: >-
            Image this Capsule was created from. An official harness pack uses
            the release of the daemon that created it (ADR 0041), and the Capsule
            keeps the resolved image digest until it is deleted. Absent for
            Capsules created before Capsules recorded their image.
        pinnedHarnessSetups:
          description: >-
            Harness setup revisions pinned when this Capsule was created.
            Absent when the Capsule started without a saved setup.
            A later edit in Settings does not change this Capsule.
          type: array
          items:
            $ref: "#/components/schemas/PinnedHarnessSetup"
        state:
          $ref: "#/components/schemas/CapsuleState"
        desiredState:
          $ref: "#/components/schemas/CapsuleIntent"
        failure:
          type: string
          description: >-
            Public failure summary. Image-pull failures use a fixed sentence
            and failureCode; registry text is never copied here.
        restoreComplete:
          type: boolean
        maintenance:
          type: string
        role:
          $ref: "#/components/schemas/CapsuleRole"
        leadThreadId:
          type: string
          description: On sub-Capsules, the lead Thread that spawned this subagent.
        linkId:
          type: string
          description: On sub-Capsules and promoted Capsules that kept their link, the Thread link to the lead.
        promotedAt:
          type: string
          format: date-time
          description: When a subagent Capsule was promoted to a main Capsule.
        checks:
          $ref: "#/components/schemas/ChecksSummary"
          description: >
            Content-free check summary. Absent when the Project has no checks.
            This is not a Capsule lifecycle state.
        routine:
          $ref: "#/components/schemas/CapsuleRoutine"
          description: Present on a Capsule a routine started (ADR 0057).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        resourceVersion:
          type: integer
          format: int64
          minimum: 1
    CapsuleRole:
      type: string
      enum: [main, sub]
      description: main Capsules are operator-created; sub Capsules were spawned by a lead Thread.
    CapsuleStartup:
      type: object
      required: [phase, phases, updatedAt]
      description: >-
        Bounded startup progress. phases is the ordered set this provider
        reports for the current start. pull is present only while an image is
        pulling and contains byte counts, never registry text.
      properties:
        phase:
          $ref: "#/components/schemas/CapsuleStartupPhase"
        phases:
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: "#/components/schemas/CapsuleStartupPhase"
        pull:
          $ref: "#/components/schemas/ImagePullProgress"
        updatedAt:
          type: string
          format: date-time
    CapsuleStartupPhase:
      type: string
      enum: [pulling_image, creating_capsule, starting_harness, connecting]
    ImagePullProgress:
      type: object
      required: [currentBytes]
      properties:
        currentBytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 1099511627776
        totalBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 1099511627776
          description: Omitted when the registry did not report a total.
    CapsuleFailureCode:
      type: string
      description: >
        Image-pull failure, or repository_access when a clone cannot read the
        repository. Git output is never copied into the failure text.
      enum: [registry_unreachable, auth_required, image_not_found, repository_access]
    CapsuleState:
      type: string
      enum: [Creating, Preparing, Ready, Paused, Failed, Sealed, Deleting, Deleted]
    CapsuleIntent:
      type: string
      enum: [Ready, Paused, Deleted, Sealed]
    Moment:
      type: object
      required:
        [id, projectId, capsuleId, timelineId, name, archiveSha256, archiveSize,
         manifestSha256, imageDigest, projectSetupHash, createdAt, final]
      properties:
        id: { type: string }
        projectId: { type: string }
        capsuleId: { type: string }
        timelineId: { type: string }
        parentMomentId: { type: string }
        name: { type: string }
        archiveSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        archiveSize: { type: integer, format: int64, minimum: 0 }
        manifestSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        imageDigest: { type: string }
        projectSetupHash: { type: string }
        gitBranch: { type: string }
        gitHead: { type: string }
        gitDirtySummary: { type: string }
        createdAt: { type: string, format: date-time }
        final: { type: boolean }
    MomentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Moment" }
        nextCursor: { type: string }
    Timeline:
      type: object
      required: [id, projectId, capsuleId, reason, createdAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        capsuleId: { type: string }
        forkedFromMomentId: { type: string }
        reason:
          type: string
          enum: [root, shard, rewind]
        createdAt: { type: string, format: date-time }
    TimelineView:
      type: object
      required: [timeline, ancestry]
      properties:
        timeline: { $ref: "#/components/schemas/Timeline" }
        ancestry:
          type: array
          items: { $ref: "#/components/schemas/Timeline" }
    DescendantResult:
      type: object
      required: [capsule, timeline, reason]
      properties:
        capsule: { $ref: "#/components/schemas/Capsule" }
        timeline: { $ref: "#/components/schemas/Timeline" }
        reason:
          type: string
          enum: [shard, rewind]
    SealResult:
      type: object
      required: [capsule, moment]
      properties:
        capsule: { $ref: "#/components/schemas/Capsule" }
        moment: { $ref: "#/components/schemas/Moment" }
    StartRunRequest:
      type: object
      required: [harness, prompt]
      properties:
        harness:
          type: string
          minLength: 1
          maxLength: 128
        prompt:
          type: string
          maxLength: 262144
          description: Transient input; never persisted in Run records or normal events.
        columns:
          type: integer
          minimum: 1
          maximum: 65535
        rows:
          type: integer
          minimum: 1
          maximum: 65535
    Run:
      type: object
      required: [id, capsuleId, harness, state, createdAt, updatedAt, resourceVersion]
      properties:
        id:
          type: string
        capsuleId:
          type: string
        harness:
          type: string
        state:
          $ref: "#/components/schemas/RunState"
        exitStatus:
          type: integer
        failure:
          type: string
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        resourceVersion:
          type: integer
          format: int64
          minimum: 1
    RunState:
      type: string
      enum: [Queued, Starting, Running, Succeeded, Failed, Cancelling, Cancelled]
    RunPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Run"
        nextCursor:
          type: string
    RunEvent:
      type: object
      required: [sequence, type, timestamp]
      properties:
        sequence:
          type: integer
          format: int64
          minimum: 1
        type:
          type: string
        timestamp:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true
          description: Bounded structured metadata; never prompt text, PTY bytes, full diffs, setup output, or secrets.
    AuthenticationMode:
      type: object
      required: [mode, signIn, claimable]
      properties:
        mode:
          type: string
          enum: [single_user, team]
        signIn:
          type: boolean
          description: An OIDC issuer is configured.
        claimable:
          type: boolean
          description: The installation can still be claimed for team mode.
    Member:
      type: object
      required: [mode, id, role]
      properties:
        mode:
          type: string
          enum: [single_user, team]
        id:
          type: string
        role:
          type: string
          enum: [member, admin]
        displayName:
          type: string
          description: Display only; refreshed at sign-in.
        email:
          type: string
          description: Display only; refreshed at sign-in.
    Session:
      type: object
      required: [id, createdAt, lastUsedAt, expiresAt, revoked, current]
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revoked:
          type: boolean
        current:
          type: boolean
    SessionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Session"
    PersonalAccessToken:
      type: object
      required: [id, name, readOnly, createdAt, lastUsedAt, expiresAt, revoked]
      properties:
        id:
          type: string
        name:
          type: string
          maxLength: 64
        readOnly:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revoked:
          type: boolean
    PersonalAccessTokenPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PersonalAccessToken"
    MintPersonalAccessTokenRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        readOnly:
          type: boolean
          default: false
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 365
          default: 90
    MintedPersonalAccessToken:
      allOf:
        - $ref: "#/components/schemas/PersonalAccessToken"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: The token value, shown once. Pass it to the CLI with --token-file.
    MemberAdmin:
      type: object
      required: [id, role, disabled, createdAt]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [member, admin]
        displayName:
          type: string
        email:
          type: string
        disabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
    IdentityRebind:
      type: object
      additionalProperties: false
      required: [signInUrl, token, expiresAt]
      properties:
        signInUrl:
          type: string
          format: uri
        token:
          type: string
          description: Single-use completion token; returned once, never logged or persisted.
          minLength: 1
          maxLength: 128
