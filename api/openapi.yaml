      responses:
        "200":
          description: Pending proposals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteProposalList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/DefaultError" }
  /note-proposals/{proposalId}:
    get:
      operationId: getNoteProposal
      summary: Review a note proposal
      description: >-
        Returns the proposed text and the note's current text for a source
        diff, and flags credential-shaped content. Both are agent text until
        the operator approves. Cache-Control no-store.
      tags: [notes]
      parameters:
        - $ref: "#/components/parameters/ProposalId"
      responses:
        "200":
          description: Proposal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteProposalReview" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/DefaultError" }
  /note-proposals/{proposalId}/approve:
    post:
      operationId: approveNoteProposal
      summary: Approve one note proposal
      description: >-
        Binds one exact change: the proposal's digest and the note's current
        revision. A proposal whose note moved past its base is stale and
        cannot be approved; open it in the editor and merge by hand. content,
        when given and different, is the operator's edit and is recorded as
        approved_with_edits.
      tags: [notes]
      parameters:
        - $ref: "#/components/parameters/ProposalId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApproveNoteProposalRequest" }
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteProposalSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
  /note-proposals/{proposalId}/reject:
    post:
      operationId: rejectNoteProposal
      summary: Reject one note proposal
      description: There is no reason field; message the proposing Thread to explain.
      tags: [notes]
      parameters:
        - $ref: "#/components/parameters/ProposalId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteProposalSummary" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
  /threads/{threadId}/notes:
    get:
      operationId: getThreadNotes
      summary: Show the note set a Thread's latest session received
      description: Content-free names, revisions and digests, and whether the harness was told about them.
      tags: [notes]
      parameters:
        - $ref: "#/components/parameters/ThreadId"
      responses:
        "200":
          description: Thread notes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreadNotes" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/DefaultError" }
  /threads/{threadId}/delete:
    post:
      operationId: deleteThread
      summary: Permanently crypto-shred a Thread transcript
      description: This removes the wrapped data key but retains ciphertext and content-free lifecycle metadata. It is irreversible and requires an explicit confirmation token.
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/ThreadId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteThreadRequest" }
      responses:
        "200": { $ref: "#/components/responses/ThreadMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/DefaultError" }
  /threads/{threadId}/start:
    post:
      operationId: startThread
      summary: Start a new structured adapter session for an active Thread
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/ThreadId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody: { $ref: "#/components/requestBodies/LifecycleMutation" }
      responses:
        "202": { $ref: "#/components/responses/ThreadSessionMutation" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
  /threads/{threadId}/resume:
    post:
      operationId: resumeThread
      summary: Resume a structured adapter session from encrypted adapter state
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/ThreadId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody: { $ref: "#/components/requestBodies/LifecycleMutation" }
      responses:
        "202": { $ref: "#/components/responses/ThreadSessionMutation" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "423": { $ref: "#/components/responses/Locked" }
        default: { $ref: "#/components/responses/DefaultError" }
  /threads/{threadId}/messages:
    post:
      operationId: sendThreadMessage
      summary: Durably append and send a user message
      description: The encrypted message and idempotency resource references commit before the adapter side effect.
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/ThreadId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendThreadMessageRequest" }
      responses:
        "202": { $ref: "#/components/responses/ThreadSessionMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "423": { $ref: "#/components/responses/Locked" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/DefaultError" }
  /threads/{threadId}/responses:
    post:
      operationId: respondThread
      summary: Answer one permission or input request
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/ThreadId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ThreadResponseRequest" }
      responses:
        "202": { $ref: "#/components/responses/ThreadSessionMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
  /threads/{threadId}/model:
    post:
      operationId: setThreadModel
      summary: Switch the active session to another model its harness reported
      description: >-
        The model must be an option ID from the session's latest models event.
        The harness switches from its next turn and reports its models again;
        an ID it does not offer produces a model_unavailable error event. A
        session whose harness reports no models answers 422.
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/ThreadId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ThreadModelRequest" }
      responses:
        "202": { $ref: "#/components/responses/ThreadSessionMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
  /threads/{threadId}/effort:
    post:
      operationId: setThreadEffort
      summary: Change the active session's reasoning effort to a level its harness reported
      description: >-
        The effort must be an option ID from the effort of the session's latest
        models event. The harness applies it from its next turn and reports its
        models again; a level it does not offer produces an effort_unavailable
        error event. A session whose harness reports no effort answers 422.
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/ThreadId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ThreadEffortRequest" }
      responses:
        "202": { $ref: "#/components/responses/ThreadSessionMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
  /threads/{threadId}/cancel:
    post:
      operationId: cancelThread
      summary: Cancel the active structured session
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/ThreadId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody: { $ref: "#/components/requestBodies/LifecycleMutation" }
      responses:
        "202": { $ref: "#/components/responses/ThreadSessionMutation" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
  /threads/{threadId}/blocks:
    get:
      operationId: listThreadBlocks
      summary: Replay ordered decrypted Thread blocks
      description: This is an explicit decryption boundary. Deltas are persisted as delta events; a final assistant message is authoritative and clients should replace matching displayed deltas rather than append duplicate text.
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/ThreadId"
        - $ref: "#/components/parameters/After"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      responses:
        "200":
          description: Ordered decrypted block page with explicit replay-gap information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreadBlockPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Corrupt" }
        "423": { $ref: "#/components/responses/Locked" }
        default: { $ref: "#/components/responses/DefaultError" }
  /threads/{threadId}/blocks/stream:
    get:
      operationId: streamThreadBlocks
      summary: Follow decrypted Thread blocks over Server-Sent Events
      description: Reconnect with Last-Event-ID or after. Heartbeats carry no content; slow clients are disconnected.
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/ThreadId"
        - $ref: "#/components/parameters/After"
        - name: Last-Event-ID
          in: header
          schema: { type: string }
      responses:
        "200":
          description: SSE stream with durable message-sequence event IDs
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "423": { $ref: "#/components/responses/Locked" }
        default: { $ref: "#/components/responses/DefaultError" }
  /capsules/{capsuleId}/pause:
    post:
      operationId: pauseCapsule
      summary: Request Capsule pause
      tags: [capsules]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/LifecycleMutation"
      responses:
        "202":
          $ref: "#/components/responses/CapsuleAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
  /capsules/{capsuleId}/promote:
    post:
      operationId: promoteCapsule
      summary: Promote a subagent Capsule to a main Capsule
      description: >
        Promotion is permanent and grants no coordination authority. The link
        to the lead stays open unless detach is set; a promoted Capsule that
        kept its link can be detached later. Promoted subagents are never
        auto-archived or stopped by their lead.
      tags: [capsules]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoteCapsuleRequest"
      responses:
        "200":
          description: Promoted Capsule
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capsule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        default:
          $ref: "#/components/responses/DefaultError"
  /projects/{projectId}/environment:
    get:
      operationId: getProjectEnvironment
      summary: Inspect project preparation settings and recent progress
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project environment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectEnvironment" }
        default:
          $ref: "#/components/responses/DefaultError"
    put:
      operationId: updateProjectEnvironment
      summary: Configure preparation or rebuild on next launch
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnvironmentMutation" }
      responses:
        "200":
          description: Updated project environment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectEnvironment" }
        default:
          $ref: "#/components/responses/DefaultError"
  /projects/{projectId}/checks:
    get:
      operationId: getProjectChecks
      summary: Read the Project's required checks
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project checks. An empty list means checks are not used.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectChecks" }
        default:
          $ref: "#/components/responses/DefaultError"
    put:
      operationId: updateProjectChecks
      summary: Replace the Project's required checks
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectChecksUpdate" }
      responses:
        "200":
          description: Updated project checks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectChecks" }
        default:
          $ref: "#/components/responses/DefaultError"
  /projects/{projectId}/checks/suggestion:
    get:
      operationId: suggestProjectChecks
      summary: Read a repository suggestion without applying it
      description: >
        When a Ready Capsule has .meridian/checks.yaml, return those commands
        as a suggestion. Nothing is saved. A missing or unusable file returns
        an empty list.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: capsuleId
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Suggestion, which may be empty
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckSuggestion" }
        default:
          $ref: "#/components/responses/DefaultError"
  /projects/{projectId}/routines:
    get:
      operationId: listProjectRoutines
      summary: List the Project's routines
      description: >
        Each routine starts one fresh Project Thread per fire (ADR 0057). The
        owner sees the prompt; fires and Capsule notes never carry it.
      tags: [routines]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Routines, by name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutineList" }
        "404": { $ref: "#/components/responses/NotFound" }
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: createProjectRoutine
      summary: Save a routine on the Project
      description: >
        The harness must be a structured harness on the Project allowlist.
        Fires must be at least 15 minutes apart. A routine never ships:
        Delivery still needs the operator.
      tags: [routines]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRoutineRequest" }
      responses:
        "201":
          description: Saved routine
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Routine" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        default:
          $ref: "#/components/responses/DefaultError"
  /projects/{projectId}/harnesses/{harness}/reported-models:
    get:
      operationId: getReportedModels
      summary: Read the models a harness last reported in this Project
      description: >
        The model and effort options the most recent session of this harness
        in the Project reported, for a routine form to offer. Empty when no
        session has reported any.
      tags: [routines]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: harness
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: Reported models, which may be empty
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportedModels" }
        "404": { $ref: "#/components/responses/NotFound" }
        default:
          $ref: "#/components/responses/DefaultError"
  /routines:
    get:
      operationId: listRoutines
      summary: List every routine you own
      description: >
        Routines across all of your Projects, ordered by Project and name, for
        the Routines page (ADR 0057).
      tags: [routines]
      responses:
        "200":
          description: Routines, by Project then name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutineList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default:
          $ref: "#/components/responses/DefaultError"
  /routines/{routineId}:
    get:
      operationId: getRoutine
      summary: Get a routine
      tags: [routines]
      parameters:
        - $ref: "#/components/parameters/RoutineId"
      responses:
        "200":
          description: Routine
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Routine" }
        "404": { $ref: "#/components/responses/NotFound" }
        default:
          $ref: "#/components/responses/DefaultError"
    patch:
      operationId: updateRoutine
      summary: Change a routine
      description: >
        Changes only the named fields. Turning a routine on clears the reason
        Meridian turned it off. A run in progress keeps its settings.
      tags: [routines]
      parameters:
        - $ref: "#/components/parameters/RoutineId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRoutineRequest" }
      responses:
        "200":
          description: Updated routine
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Routine" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        default:
          $ref: "#/components/responses/DefaultError"
  /routines/{routineId}/delete:
    post:
      operationId: deleteRoutine
      summary: Delete a routine and its fire history
      description: >
        Capsules the routine kept are ordinary Capsules and stay until the
        operator deletes them.
      tags: [routines]
      parameters:
        - $ref: "#/components/parameters/RoutineId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/LifecycleMutation"
      responses:
        "204":
          description: Deleted
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        default:
          $ref: "#/components/responses/DefaultError"
  /routines/{routineId}/run:
    post:
      operationId: runRoutine
      summary: Fire a routine now
      description: >
        Follows the clock's rules: an overlapping run, a full backlog, or the
        live-Capsule cap records a skipped fire instead.
      tags: [routines]
      parameters:
        - $ref: "#/components/parameters/RoutineId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Fire recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutineFire" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        default:
          $ref: "#/components/responses/DefaultError"
  /routines/{routineId}/fires:
    get:
      operationId: listRoutineFires
      summary: List a routine's fires
      tags: [routines]
      parameters:
        - $ref: "#/components/parameters/RoutineId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Fires, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutineFirePage" }
        "404": { $ref: "#/components/responses/NotFound" }
        default:
          $ref: "#/components/responses/DefaultError"
  /capsules/{capsuleId}/remote-ci:
    get:
      operationId: getCapsuleRemoteCI
      summary: Read GitHub CI for the commit Meridian pushed
      description: >
        Names, conclusions, links, and a short redacted tail. The response
        has no token. Absent when this Capsule has no Meridian pull request.
      tags: [capsules]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
      responses:
        "200":
          description: The latest CI reading for this Capsule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteCI" }
        "404": { $ref: "#/components/responses/NotFound" }
        default:
          $ref: "#/components/responses/DefaultError"
  /capsules/{capsuleId}/check-runs:
    get:
      operationId: listCapsuleCheckRuns
      summary: List check runs for a Capsule
      tags: [capsules]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Check runs, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckRunPage" }
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: createCapsuleCheckRun
      summary: Run the Project's checks now
      tags: [capsules]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckRunRequest" }
      responses:
        "202":
          description: Check run queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckRun" }
        default:
          $ref: "#/components/responses/DefaultError"
  /capsules/{capsuleId}/checks/auto-rework:
    post:
      operationId: setCapsuleCheckAutoRework
      summary: Stop or resume automatic rework for one Capsule
      tags: [capsules]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckAutoReworkRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckAutoReworkRequest" }
        default:
          $ref: "#/components/responses/DefaultError"
  /check-runs/{checkRunId}:
    get:
      operationId: getCheckRun
      summary: Read one check run, including redacted output tails
      tags: [capsules]
      parameters:
        - $ref: "#/components/parameters/CheckRunId"
      responses:
        "200":
          description: Check run
          content:
