          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Proposals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteProposalList" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/DefaultError" }
  /note-proposals:
    get:
      operationId: listPendingNoteProposals
      summary: List every pending note proposal of the caller's Projects
      description: >-
        For the Inbox's Notes to review. Content-free: names the Project, the
        note and the proposing Thread only, never proposal text.
