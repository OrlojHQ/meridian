openapi: 3.1.0
info:
  title: Meridian API
  version: 0.5.0
  description: Control-plane API for fake, trusted-development Docker, and Kubernetes Agent Sandbox Capsules.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://127.0.0.1:8080
    description: Loopback local development
security:
  - bearerAuth: []
paths:
  /provider-gateway/{provider}/v1/{operation}:
    post:
      operationId: proxyProviderInference
      summary: Forward an inference request using a scoped Capsule lease
      description: >-
        Requires a live Capsule gateway lease in Authorization (Bearer) or X-Api-Key.
        Installation API tokens and browser sessions do not authorize this operation.
        Only OpenAI responses/chat completions and Anthropic messages/token counting
        are supported; unsupported provider/operation combinations return 404.
        The origin must be enabled explicitly by the deployment operator.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [openai, anthropic]
        - name: operation
          in: path
          required: true
          schema:
            type: string
          description: responses, chat/completions, messages, or messages/count_tokens.
        - name: Authorization
          in: header
          schema:
            type: string
          description: Bearer Capsule lease; required unless X-Api-Key supplies the lease.
        - name: X-Api-Key
          in: header
          schema:
            type: string
          description: Capsule lease for Anthropic native clients.
        - name: Anthropic-Beta
          in: header
          schema:
            type: string
            maxLength: 2048
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Native provider JSON or bounded event stream.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/event-stream:
              schema:
                type: string
        default:
          $ref: "#/components/responses/DefaultError"
  /provider-connections:
    get:
      operationId: listProviderConnections
      summary: listProviderConnections
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConnectionPage"
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: createProviderConnection
      summary: createProviderConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderConnectionRequest"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConnection"
        default:
          $ref: "#/components/responses/DefaultError"
  /provider-connections/{connectionId}:
    put:
      operationId: updateProviderConnection
      summary: updateProviderConnection
      parameters:
        - name: connectionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderConnectionRequest"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConnection"
        default:
          $ref: "#/components/responses/DefaultError"
  /projects/{projectId}/harnesses/{harness}/connection:
    get:
      operationId: getProjectProviderConnection
      summary: getProjectProviderConnection
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: harness
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectProviderConnection"
        default:
          $ref: "#/components/responses/DefaultError"
    put:
      operationId: grantProjectProviderConnection
      summary: grantProjectProviderConnection
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: harness
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectProviderConnection"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectProviderConnection"
        default:
          $ref: "#/components/responses/DefaultError"
  /projects/{projectId}/harnesses/{harness}/setup:
    get:
      operationId: getProjectHarnessSetup
      summary: getProjectHarnessSetup
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: harness
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectHarnessSetup"
        default:
          $ref: "#/components/responses/DefaultError"
    put:
      operationId: setProjectHarnessSetup
      summary: setProjectHarnessSetup
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: harness
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectHarnessSetup"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectHarnessSetup"
        default:
          $ref: "#/components/responses/DefaultError"
  /harness-setups/preview:
    post:
      operationId: previewHarnessSetup
      summary: Review explicitly selected configuration files without saving
      description: Original file content is processed in memory only. Returns sanitized portable files and exclusions. Does not read server filesystem paths or execute imported code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HarnessSetupUpload"
      responses:
        "200":
          description: Reviewed import, not yet saved
          headers:
            Cache-Control:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HarnessSetupPreview"}
        default:
          $ref: "#/components/responses/DefaultError"
  /harness-setups:
    get:
      operationId: listHarnessSetups
      summary: listHarnessSetups
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarnessSetupPage"
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: importHarnessSetup
      summary: importHarnessSetup
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportHarnessSetupRequest"
      responses:
        "201":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarnessSetup"
        default:
          $ref: "#/components/responses/DefaultError"
  /harness-setups/{setupId}:
    patch:
      operationId: mutateHarnessSetup
      summary: mutateHarnessSetup
      parameters:
        - name: setupId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MutateHarnessSetupRequest"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarnessSetup"
        default:
          $ref: "#/components/responses/DefaultError"
  /harness-setups/{setupId}/contents:
    get:
      operationId: getHarnessSetupContents
      summary: Read saved configuration for editing
      parameters:
        - name: setupId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current setup content and version; never cached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportHarnessSetupRequest'
        default:
          $ref: '#/components/responses/DefaultError'
  /harness-setups/{setupId}/revisions:
    get:
      operationId: listHarnessSetupRevisions
      summary: listHarnessSetupRevisions
      parameters:
        - name: setupId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarnessSetupRevisionPage"
        default:
          $ref: "#/components/responses/DefaultError"
  /healthz:
    get:
      operationId: getHealth
      summary: Report process health
      security: []
      tags: [probes]
      responses:
        "200":
          description: Process is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
  /readyz:
    get:
      operationId: getReadiness
      summary: Report service readiness
      security: []
      tags: [probes]
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"
        "503":
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
  /capabilities:
    get:
      operationId: getCapabilities
      summary: Report provider-backed product capabilities
      description: Clients must treat false capabilities as unsupported and must not construct private provider URLs.
      tags: [capabilities]
      responses:
        "200":
          description: Effective capabilities for this daemon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
  /secrets:
    get:
      operationId: listSecrets
      summary: List named secret metadata
      tags: [secrets]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Secret metadata page; values are never returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
  /secrets/{secretName}:
    parameters:
      - name: secretName
        in: path
        required: true
        schema:
          type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_.-]{0,127}$"
    put:
      operationId: putSecret
      summary: Create or replace an encrypted named secret
      tags: [secrets]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutSecretRequest"
      responses:
        "200":
          description: Stored secret metadata; value is never returned
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Secret"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
    delete:
      operationId: deleteSecret
      summary: Crypto-shred a named secret by deleting its envelope
      tags: [secrets]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteSecretRequest"
      responses:
        "200":
          description: Deleted secret metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Secret"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
  /projects:
    post:
      operationId: createProject
      summary: Create a project
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
    get:
      operationId: listProjects
      summary: List projects
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Project page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
  /projects/{projectId}:
    get:
      operationId: getProject
      summary: Get a project
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
    patch:
      operationId: patchProject
      summary: Replace the Project harness-image allowlist
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchProjectRequest"
      responses:
        "200":
          description: Project updated
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
  /projects/{projectId}/threads:
    post:
      operationId: createProjectThread
      summary: Provision a fresh Capsule and start its first structured Thread
      description: Persists a durable encrypted session intent before asynchronously provisioning a new Capsule. Idempotent replay returns the same intent and resource IDs.
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectThreadRequest" }
      responses:
        "202":
          description: Project Thread session accepted
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectThreadIntent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/DefaultError" }
  /project-thread-intents/{intentId}:
    get:
      operationId: getProjectThreadIntent
      summary: Get deterministic Project Thread provisioning status
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/ProjectThreadIntentId"
      responses:
        "200":
          description: Project Thread intent
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectThreadIntent" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/DefaultError" }
  /projects/{projectId}/capsules:
    post:
      operationId: createCapsule
      summary: Request Capsule creation
      tags: [capsules]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCapsuleRequest"
      responses:
        "202":
          description: Capsule creation accepted
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capsule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
    get:
      operationId: listCapsules
      summary: List a project's Capsules
      tags: [capsules]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Capsule page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsulePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
  /capsules/{capsuleId}:
    get:
      operationId: getCapsule
      summary: Get a Capsule
      tags: [capsules]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
      responses:
        "200":
          description: Capsule
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capsule"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
  /capsules/{capsuleId}/harness-profiles:
    get:
      operationId: listHarnessProfiles
      summary: Discover effective native and structured harness profiles
      description: Provider-independent discovery. A false structured value identifies PTY/native fallback; clients never inspect provider internals.
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
      responses:
        "200":
          description: Effective Capsule-local harness profiles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HarnessProfilePage" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
  /capsules/{capsuleId}/threads:
    post:
      operationId: createThread
      summary: Create an encrypted structured Thread, optionally with an atomic first message and session start
      description: The Thread, encrypted first message, Run intent, and idempotency resource references are committed before runtime side effects.
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateThreadRequest" }
      responses:
        "201":
          description: Thread created; session status is represented by currentRun when start was requested
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreadMutationResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "423": { $ref: "#/components/responses/Locked" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/DefaultError" }
    get:
      operationId: listThreads
      summary: List retained Thread histories for a Capsule
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Thread history page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreadPage" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/DefaultError" }
  /threads/{threadId}:
    get:
      operationId: getThread
      summary: Get Thread lifecycle and current session status
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/ThreadId"
      responses:
        "200":
          description: Thread metadata; transcript content is not included
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Thread" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/DefaultError" }
  /threads/{threadId}/archive:
    post:
      operationId: archiveThread
      summary: Archive a Thread history
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/ThreadId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody: { $ref: "#/components/requestBodies/LifecycleMutation" }
      responses:
        "200": { $ref: "#/components/responses/ThreadMutation" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
  /threads/{threadId}/delete:
    post:
      operationId: deleteThread
      summary: Permanently crypto-shred a Thread transcript
      description: This removes the wrapped data key but retains ciphertext and content-free lifecycle metadata. It is irreversible and requires an explicit confirmation token.
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/ThreadId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteThreadRequest" }
      responses:
        "200": { $ref: "#/components/responses/ThreadMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/DefaultError" }
  /threads/{threadId}/start:
    post:
      operationId: startThread
      summary: Start a new structured adapter session for an active Thread
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/ThreadId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody: { $ref: "#/components/requestBodies/LifecycleMutation" }
      responses:
        "202": { $ref: "#/components/responses/ThreadSessionMutation" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
  /threads/{threadId}/resume:
    post:
      operationId: resumeThread
