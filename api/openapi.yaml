    HarnessProfile:
      type: object
      required: [name, structured, pty]
      description: A name appears at most twice, once per interaction mode, when one harness offers both a native terminal and a structured session.
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        structured:
          type: boolean
        adapterKind:
          type: string
          enum: [acp, pi, claude, codex, mock, generic, external]
        protocol:
          type: string
          enum: [meridian.adapter.v1]
        pty:
          type: boolean
          description: Native PTY behavior for this profile; structured profiles are always false.
    HarnessProfilePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/HarnessProfile" }
    CreateProjectThreadRequest:
      type: object
      required: [harness]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Optional name for the fresh Capsule.
        harness: { type: string, minLength: 1, maxLength: 128 }
        prompt:
          type: string
          minLength: 1
          maxLength: 131072
          description: >
            First message, delivered once the session starts. Encrypted as a
            transcript envelope before SQLite persistence. Prefer stdin in
            shells. Omit it to start the harness idle, a lead (`coordination`)
            included.
        includeProjectNotes:
          type: boolean
          description: >-
            Include Project notes in this Thread's sessions. Absent follows the
            Project's notesDelivery; a Project with notesDelivery off delivers
            to no Thread.
        coordination:
          $ref: "#/components/schemas/CoordinationPolicy"
    CoordinationPolicy:
      type: object
      description: >
        Makes the Thread a lead that may spawn subagent Threads in their own
        sub-Capsules: a new Thread, or an existing one through makeThreadLead. Omitted limits take their defaults. Subagents answer to the
        operator: the lead never approves permissions or answers input.
        maxChildren and maxDescendants count spawns in a rolling 24-hour
        window, not over the grant's lifetime. The grant has no fixed end; it
        lapses after unattendedLimitSeconds without the operator.
      properties:
        maxDepth: { type: integer, minimum: 1, maximum: 1, default: 1 }
        maxChildren: { type: integer, minimum: 1, maximum: 16, default: 4 }
        maxDescendants: { type: integer, minimum: 1, maximum: 32, default: 8 }
        maxLiveCapsules: { type: integer, minimum: 1, maximum: 16, default: 4 }
        maxMessagesPerLink: { type: integer, minimum: 1, maximum: 500, default: 50 }
        allowedHarnesses:
          type: array
          maxItems: 16
          description: Structured harnesses subagents may use; each must be on the Project allowlist. Defaults to the lead's harness.
          items: { type: string, minLength: 1, maxLength: 128 }
        unattendedLimitSeconds:
          type: integer
          minimum: 300
          maximum: 259200
          default: 86400
          description: >
            How long the grant keeps spending after the operator's last
            message to the lead, spawn approval, or grant update. Past it the
            grant lapses: mutating coordination requests are refused as
            coordination_lapsed, onDeadline applies to running subagents, and
            the operator's next message to the lead reopens it. Coordination
            requests, reports, wakes and routines never reset it. Replaces
            deadlineSeconds, which is refused.
        archiveAfterSeconds:
          type: integer
          minimum: 0
          maximum: 2592000
          default: 3600
          description: >
            How long a finished subagent stays idle before its session is ended
            and its Thread paused. Its Capsule is then deleted if its
            workspace holds nothing unsaved (the last report changed no files,
            or a Delivery of it succeeded); otherwise the Capsule is kept.
            0 disables auto-archive and this cleanup; otherwise at least 60.
            Transcripts are always kept.
        onDeadline:
          type: string
          enum: [cancel_and_pause, stop_new_work]
          default: cancel_and_pause
          description: >
            What happens to running subagents when the grant lapses.
            cancel_and_pause closes their links and pauses them;
            stop_new_work lets them finish. Spawns waiting for approval are
            refused either way.
        spawnApproval:
          type: string
          enum: [auto, operator]
          default: auto
          description: >
            auto starts each accepted spawn. operator queues it until the
            operator approves or denies it. The grant itself is still the
            bound on how many may be requested.
    CoordinationGrantState:
      type: string
      description: >
        lapsed is an active grant left unattended past its limit; the
        operator's next message to the lead reopens it. revoked is terminal.
        expired is terminal and only appears on grants that passed an
        absolute deadline before unattended limits replaced it.
      enum: [active, lapsed, revoked, expired]
    CoordinationGrant:
      type: object
      required:
        [id, projectId, rootThreadId, rootCapsuleId, state, spawnApproval, maxDepth,
         maxChildren, maxDescendants, maxLiveCapsules, maxMessagesPerLink,
         allowedHarnesses, lastOperatorAt, unattendedLimitSeconds, lapsesAt,
         onDeadline, archiveAfterSeconds, descendantsCreated, spawnsInWindow,
         createdAt, updatedAt, resourceVersion]
      properties:
        id: { type: string }
        projectId: { type: string }
        rootThreadId: { type: string }
        rootCapsuleId: { type: string }
        state: { $ref: "#/components/schemas/CoordinationGrantState" }
        spawnApproval: { type: string, enum: [auto, operator] }
        maxDepth: { type: integer, minimum: 1 }
        maxChildren: { type: integer, minimum: 1 }
        maxDescendants: { type: integer, minimum: 1 }
        maxLiveCapsules: { type: integer, minimum: 1 }
        maxMessagesPerLink: { type: integer, minimum: 1 }
        allowedHarnesses:
          type: array
          items: { type: string }
        lastOperatorAt:
          type: string
          format: date-time
          description: Last operator message to the lead, spawn approval, or grant update.
        unattendedLimitSeconds: { type: integer, minimum: 300, maximum: 259200 }
        lapsesAt:
          type: string
          format: date-time
          description: lastOperatorAt plus the unattended limit.
        lapsedAt:
          type: string
          format: date-time
          description: When the lapse was applied to running subagents; absent while open.
        onDeadline: { type: string, enum: [cancel_and_pause, stop_new_work] }
        archiveAfterSeconds: { type: integer, minimum: 0, maximum: 2592000 }
        descendantsCreated:
          type: integer
          minimum: 0
          description: Spawns over the grant's lifetime, for display only.
        spawnsInWindow:
          type: integer
          minimum: 0
          description: Spawns in the last 24 hours, which maxChildren and maxDescendants limit.
        revokedAt: { type: string, format: date-time }
        revokeReason: { type: string, enum: [operator, deadline, lead_ended] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        resourceVersion: { type: integer, format: int64, minimum: 1 }
    MakeThreadLeadRequest:
      type: object
      required: [expectedResourceVersion]
      properties:
        expectedResourceVersion:
          type: integer
          format: int64
          minimum: 1
          description: The Thread's current resource version.
        coordination:
          $ref: "#/components/schemas/CoordinationPolicy"
    MakeThreadLeadResponse:
      type: object
      required: [grant, thread, restarted]
      properties:
        grant: { $ref: "#/components/schemas/CoordinationGrant" }
        thread: { $ref: "#/components/schemas/Thread" }
        restarted:
          type: boolean
          description: >
            True when the session was stopped and resumed as a lead now. False
            when the Thread was busy, waiting on the operator, or had no
            resume state; the next prompt or resume then delivers the role.
    RevokeCoordinationGrantRequest:
      type: object
      required: [expectedResourceVersion]
      properties:
        expectedResourceVersion: { type: integer, format: int64, minimum: 1 }
        cancelDescendants:
          type: boolean
          default: true
    UpdateCoordinationGrantRequest:
      type: object
      required: [expectedResourceVersion]
      description: >
        Operator update to an active grant. Omitted fields stay unchanged.
        allowedHarnesses, when present, replaces the allowlist and must not
        be empty. Any update resets lastOperatorAt and reopens a lapsed grant.
      properties:
        expectedResourceVersion: { type: integer, format: int64, minimum: 1 }
        spawnApproval: { type: string, enum: [auto, operator] }
        maxChildren: { type: integer, minimum: 1, maximum: 16 }
        maxDescendants: { type: integer, minimum: 1, maximum: 32 }
        maxLiveCapsules: { type: integer, minimum: 1, maximum: 16 }
        maxMessagesPerLink: { type: integer, minimum: 1, maximum: 500 }
        allowedHarnesses:
          type: array
          minItems: 1
          maxItems: 16
          items: { type: string, minLength: 1, maxLength: 128 }
        unattendedLimitSeconds: { type: integer, minimum: 300, maximum: 259200 }
        onDeadline: { type: string, enum: [cancel_and_pause, stop_new_work] }
        archiveAfterSeconds: { type: integer, minimum: 0, maximum: 2592000 }
    CoordinationRequestState:
      type: string
      enum: [pending_approval, completed, rejected]
    CoordinationRequest:
      type: object
      description: >
        Durable idempotency record for one mutating coordination request, and
        the operator queue when spawnApproval is operator. Prompts are never
        included.
      required:
        [id, grantId, capsuleId, key, kind, linkId, state, createdAt, updatedAt,
         resourceVersion]
      properties:
        id: { type: string }
        grantId: { type: string }
        capsuleId: { type: string }
        key: { type: string }
        kind: { type: string, enum: [spawn, send, cancel] }
        linkId: { type: string }
        state: { $ref: "#/components/schemas/CoordinationRequestState" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        resourceVersion: { type: integer, format: int64, minimum: 1 }
    CoordinationRequestPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CoordinationRequest" }
    DecideCoordinationRequest:
      type: object
      required: [expectedResourceVersion]
      properties:
        expectedResourceVersion: { type: integer, format: int64, minimum: 1 }
    ThreadLinkState:
      type: string
      enum: [pending_approval, active, closed]
    ThreadLink:
      type: object
      description: >
        Content-free handle from a lead Thread to one subagent. Report text is
        re-derived from the subagent's encrypted transcript and is never stored
        on the link.
      required:
        [id, grantId, parentThreadId, parentCapsuleId, childThreadId, childCapsuleId,
         childIntentId, depth, name, harness, state, phase, reportSeq,
         reportDeliveredSeq, messagesForwarded, operatorMessages, createdAt, updatedAt,
         resourceVersion]
      properties:
        id: { type: string }
        grantId: { type: string }
        parentThreadId: { type: string }
        parentCapsuleId: { type: string }
        childThreadId: { type: string }
        childCapsuleId: { type: string }
        childIntentId: { type: string }
        depth: { type: integer, minimum: 1, maximum: 3 }
        name: { type: string, pattern: "^[a-z0-9-]{1,48}$" }
        harness: { type: string }
        state: { $ref: "#/components/schemas/ThreadLinkState" }
        closeReason: { type: string, enum: [cancelled, failed, ended, revoked, denied, detached] }
        phase:
          type: string
          enum: [provisioning, working, idle, awaiting_operator, ended, failed]
        model:
          type: string
          maxLength: 128
          description: >-
            The label of the model the subagent's live session last reported,
            derived in memory from its encrypted transcript and never stored.
            Absent when the session has ended or has not reported one.
        effort:
          type: string
          maxLength: 128
          description: >-
            The label of the reasoning effort the subagent's live session last
            reported, when it reports one and is not on the harness default.
        reportSeq: { type: integer, minimum: 0 }
        reportDeliveredSeq: { type: integer, minimum: 0 }
        lastReportStatus: { type: string, enum: [turn_ended, failed, done, blocked] }
        lastReportReason: { type: string, enum: [cancelled, capsule_failed, session_ended, revoked, denied] }
        lastReportAt: { type: string, format: date-time }
        messagesForwarded: { type: integer, minimum: 0 }
        operatorMessages:
          type: integer
          minimum: 0
          description: Operator messages sent straight to this subagent. They do not count against the lead's message limit.
        archivedAt:
          type: string
          format: date-time
          description: Set while the subagent is auto-archived; cleared when its Thread resumes.
        promotedAt:
          type: string
          format: date-time
          description: When the subagent was promoted to a main Capsule. Promoted subagents are never archived.
        capsuleRemoved:
          type: boolean
          description: True once the subagent's Capsule is deleted or being deleted. Its Thread history is kept.
        baseCommit:
          type: string
          description: Child workspace HEAD when the Capsule became Ready. Patch bytes are never stored.
        head:
          type: string
          description: Latest observed child HEAD. Content-free.
        filesChanged: { type: integer, minimum: 0 }
        insertions: { type: integer, minimum: 0 }
        deletions: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        resourceVersion: { type: integer, format: int64, minimum: 1 }
    ThreadLinkPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ThreadLink" }
    CoordinationCapability:
      type: object
      required: [supported, maxDepth, maxDescendants]
      properties:
        supported:
          type: boolean
          description: True when lead Threads may spawn subagent Threads through the Capsule-local coordination mailbox.
        maxDepth: { type: integer, minimum: 0 }
        maxDescendants: { type: integer, minimum: 0 }
    ThreadOrigin:
      type: object
      description: >
        Marks a user-role message Meridian wrote rather than the operator
        typing it now: from_lead on a subagent, from_subagents on a lead, and
        from_routine for the prompt a routine saved (ADR 0057).
      required: [source, kind]
      properties:
        source: { type: string, enum: [coordination, routine] }
        kind: { type: string, enum: [from_lead, from_subagents, from_routine] }
        linkIds:
          type: array
          maxItems: 16
          items: { type: string }
    ProjectThreadIntentState:
      type: string
      enum: [provisioning, ready, failed]
    ProjectThreadIntent:
      type: object
      required:
        [id, projectId, capsuleId, capsuleName, threadId, runId, messageId,
         harness, state, createdAt, updatedAt, resourceVersion]
      properties:
        id: { type: string }
        projectId: { type: string }
        capsuleId: { type: string }
        capsuleName: { type: string }
        threadId: { type: string }
        runId: { type: string }
        messageId:
          type: string
          description: The first message's ID. No message has it when the request had no prompt.
        harness: { type: string }
        state: { $ref: "#/components/schemas/ProjectThreadIntentState" }
        failureCode: { type: string, maxLength: 64 }
        failureMessage:
          type: string
          maxLength: 256
          description: Bounded content-free lifecycle failure summary.
        thread: { $ref: "#/components/schemas/Thread" }
        currentRun: { $ref: "#/components/schemas/Run" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        resourceVersion: { type: integer, format: int64, minimum: 1 }
    CreateThreadRequest:
      type: object
      required: [harness]
      properties:
        harness: { type: string, minLength: 1, maxLength: 128 }
        firstMessage:
          type: string
          minLength: 1
          maxLength: 131072
          description: Encrypted before SQLite persistence. Prefer stdin in shells to avoid command-history disclosure.
        start:
          type: boolean
          default: false
          description: Requires firstMessage and atomically creates the initial Run intent before runtime side effects.
        includeProjectNotes:
          type: boolean
          description: >-
            Include Project notes in this Thread's sessions. Absent follows the
            Project's notesDelivery; a Project with notesDelivery off delivers
            to no Thread.
    DeleteThreadRequest:
      type: object
      required: [expectedResourceVersion, confirmation]
      properties:
        expectedResourceVersion: { type: integer, format: int64, minimum: 1 }
        confirmation:
          type: string
          enum: [crypto-shred]
    SendThreadMessageRequest:
      type: object
      required: [expectedResourceVersion, content]
      properties:
        expectedResourceVersion: { type: integer, format: int64, minimum: 1 }
        content:
          type: string
          minLength: 0
          maxLength: 131072
          description: >-
            Encrypted before SQLite persistence. May be empty when attachments
            are present. The harness prompt may also name workspace paths for
            files that are not sent as image content.
        delivery:
          type: string
          enum: [steer]
          description: >
            Inject into the running turn at the next tool boundary. The daemon
            sets the documented Pi and Codex user-message metadata; other
            adapters ignore it. Omit when idle. Queued follow-ups stay in the
            web UI's memory until the turn is idle and are never written to
            browser storage.
        attachments:
          type: array
          maxItems: 8
          description: >-
            Files copied into the Capsule workspace before the message is
            sent. Image bytes are not stored in the transcript. At most 4 MiB
            each and 8 MiB together.
          items: { $ref: "#/components/schemas/ThreadAttachmentInput" }
    ThreadAttachmentInput:
      type: object
      required: [name, mediaType, data]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: The operator's file name. The Capsule path is chosen by the Station.
        mediaType:
          type: string
          minLength: 1
          maxLength: 128
        data:
          type: string
          minLength: 1
          maxLength: 5592408
          description: Standard base64 of the file bytes. Not retained outside the Capsule.
    ThreadAttachment:
      type: object
      required: [name, mediaType, size, path, kind]
      description: >-
        An attachment as kept in the encrypted transcript. Bytes are not included.
      properties:
        name: { type: string, maxLength: 120 }
        mediaType: { type: string, maxLength: 128 }
        size: { type: integer, format: int64, minimum: 1, maximum: 4194304 }
        path:
          type: string
          maxLength: 256
          description: Workspace-relative path inside the Capsule.
        kind:
          type: string
          enum: [image, file]
    ThreadResponseRequest:
      type: object
      required: [expectedResourceVersion, responseTo]
      properties:
        expectedResourceVersion: { type: integer, format: int64, minimum: 1 }
        responseTo: { type: string, minLength: 1, maxLength: 160 }
        choice: { type: string, minLength: 1, maxLength: 1024 }
        input: { type: string, maxLength: 131072 }
    ThreadModelRequest:
      type: object
      required: [expectedResourceVersion, model]
      properties:
        expectedResourceVersion: { type: integer, format: int64, minimum: 1 }
        model: { type: string, minLength: 1, maxLength: 256 }
    ThreadEffortRequest:
      type: object
      required: [expectedResourceVersion, effort]
      properties:
        expectedResourceVersion: { type: integer, format: int64, minimum: 1 }
        effort: { type: string, minLength: 1, maxLength: 256 }
    ThreadState:
      type: string
      enum: [active, paused, archived, deleted]
    Thread:
      type: object
      required:
        [id, capsuleId, state, harness, encryptedAtRest, messageCount, encryptedBytes,
         createdAt, updatedAt, resourceVersion]
      properties:
        id: { type: string }
        capsuleId: { type: string }
        state: { $ref: "#/components/schemas/ThreadState" }
        harness: { type: string }
        currentRunId: { type: string }
        currentRunState: { $ref: "#/components/schemas/RunState" }
        awaiting: { $ref: "#/components/schemas/ThreadAwaiting" }
        turn:
          type: string
          enum: [working, idle]
          description: >-
            Present while the structured session is live: whether the agent is
            working on a turn or idle between turns. Derived in memory from the
            encrypted transcript like awaiting, never persisted, and content-free.
        contextUsage: { $ref: "#/components/schemas/ThreadContextUsage" }
        protocol:
          type: string
          enum: [meridian.adapter.v1]
        structuredSupported: { type: boolean }
        coordinationGrantId:
          type: string
          description: The Coordination Grant over this Thread's tree, on the lead and on each subagent.
        parentThreadId:
          type: string
          description: Present on a subagent Thread; the lead that spawned it.
        rootThreadId:
          type: string
          description: The lead at the root of this Thread's coordination tree.
        linkId:
          type: string
          description: Present on a subagent Thread; its link from the lead.
        depth:
          type: integer
          minimum: 0
          maximum: 3
          description: Zero for leads, one for their subagents.
        encryptedAtRest:
          type: boolean
          const: true
        messageCount: { type: integer, format: int64, minimum: 0, maximum: 100000 }
        encryptedBytes: { type: integer, format: int64, minimum: 0, maximum: 268435456 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time }
        pinnedAt:
          type: string
          format: date-time
          description: >-
            Present while the operator has pinned this Thread (ADR 0059).
            Presentation only; it grants nothing.
        resourceVersion: { type: integer, format: int64, minimum: 1 }
    ThreadContextUsage:
      type: object
      description: >-
        Present while the structured session is live and its harness has
        reported how full its context window is (ADR 0059). tokens is the
        input size of the most recent model call, not the session's total
        spend, and window is the model's context window. Held in memory
        only, never persisted, and carries no model name. Absent when the
        harness reports nothing, after a daemon restart until it reports
        again, and right after a compaction whose new size is not yet known.
      required: [tokens, window]
      properties:
        tokens: { type: integer, format: int64, minimum: 1, maximum: 1099511627776 }
        window: { type: integer, format: int64, minimum: 1, maximum: 1099511627776 }
    ThreadAwaiting:
      type: object
      description: >-
        Present while the active structured session has an unanswered
        permission or input request. Derived in memory from the encrypted
        transcript and never persisted in plaintext; it carries no request
        summary, options, or prompt text.
      required: [kind, since]
      properties:
        kind:
          type: string
          enum: [permission, input]
        since: { type: string, format: date-time }
    ThreadMutationResult:
      type: object
      required: [thread]
      properties:
        thread: { $ref: "#/components/schemas/Thread" }
        currentRun: { $ref: "#/components/schemas/Run" }
        messageId: { type: string }
        responseTo: { type: string }
    ThreadPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Thread" }
        nextCursor: { type: string }
    ThreadBlockKind:
      type: string
      enum: [text, json, tool_call, tool_result, error]
    ThreadMessageRole:
      type: string
      enum: [system, user, assistant, tool]
    ThreadMessageKind:
      type: string
      enum: [prompt, response, tool_call, tool_result, status]
    ThreadPermission:
      type: object
      required: [kind]
      properties:
        kind: { type: string, maxLength: 512 }
        summary: { type: string, maxLength: 32768 }
        options:
          type: array
          maxItems: 32
          items: { type: string, maxLength: 1024 }
        choice: { type: string, maxLength: 1024 }
    ThreadInput:
      type: object
      properties:
        prompt: { type: string, maxLength: 32768 }
        value: { type: string, maxLength: 131072 }
        secret: { type: boolean }
    ThreadAdapterEvent:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [assistant_delta, assistant_message, tool_start, tool_result, status, error,
                 permission_request, permission_response, input_request, input_response, gap, end,
                 commands, models, set_model, set_effort, context_usage, notes_updated]
        runtimeSequence: { type: integer, format: int64, minimum: 1 }
        messageId: { type: string }
        responseTo:
          type: string
          description: On permission and input responses, the messageId of the answered request.
        toolCallId: { type: string }
        toolName: { type: string, maxLength: 512 }
        summary: { type: string, maxLength: 131072 }
        result: { type: string, maxLength: 65536 }
        status:
          type: string
          enum: [starting, running, idle, waiting, succeeded, failed, cancelled, restarting]
        code: { type: string }
        retryable: { type: boolean }
        reason: { type: string, maxLength: 32768 }
        permission: { $ref: "#/components/schemas/ThreadPermission" }
        input: { $ref: "#/components/schemas/ThreadInput" }
        requestedAfter: { type: integer, format: int64, minimum: 0 }
        availableFrom: { type: integer, format: int64, minimum: 1 }
        commands:
          type: array
          maxItems: 128
          description: >-
            On commands events, the commands the harness reported for this session.
            The latest commands event replaces earlier ones. Send a command as an
            ordinary message `/name arguments`.
          items: { $ref: "#/components/schemas/ThreadCommand" }
        models: { $ref: "#/components/schemas/ThreadModels" }
        model:
          type: string
          maxLength: 256
          description: On set_model events, the model ID the operator asked for.
        effort:
          type: string
          maxLength: 256
          description: On set_effort events, the effort level the operator asked for.
        compacted:
          type: boolean
          description: >-
            On context_usage events, true: the harness compacted (summarized)
            the conversation at this point. Only compactions are kept in the
            transcript, and they carry no token counts.
        notesChanged:
          type: integer
          minimum: 1
          maximum: 64
          description: >-
            On notes_updated events, how many Project notes a resumed session
            received that differ from the previous session's. It names no note
            and carries no content (ADR 0060).
    ThreadModels:
      type: object
      required: [options]
      description: >-
        On models events, the harness's current model and every model it offers.
        The latest models event replaces earlier ones. current may be empty, and
        need not be one of the options.
      properties:
        current: { type: string, maxLength: 256 }
        resolved:
          type: string
          maxLength: 128
          description: >-
            Display name of the model the current option runs, when the
            harness reports it, such as "Opus 5.5" behind a "default" alias.
        images:
          type: boolean
          description: >-
            True when the harness accepts image content. Reported from the
            agent's prompt capabilities. Absent or false means image attach
            is unavailable. The latest models event replaces earlier ones.
        options:
          type: array
          maxItems: 128
          items: { $ref: "#/components/schemas/ThreadModelOption" }
        effort: { $ref: "#/components/schemas/ThreadEffort" }
    ThreadEffort:
      type: object
      required: [options]
      description: >-
        The reasoning effort levels the current model offers. current is the
        level in effect, including the harness's own default when it reports
        one, and empty when it does not say.
      properties:
        current: { type: string, maxLength: 256 }
        options:
          type: array
          maxItems: 16
          items: { $ref: "#/components/schemas/ThreadModelOption" }
    ThreadModelOption:
      type: object
      required: [id, label]
      properties:
        id: { type: string, minLength: 1, maxLength: 256 }
        label: { type: string, minLength: 1, maxLength: 128 }
        description: { type: string, maxLength: 512 }
    ThreadCommand:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"
        description: { type: string, maxLength: 512 }
        argumentHint: { type: string, maxLength: 128 }
        kind:
          type: string
          enum: [prompt, action]
          description: >-
            prompt commands are expanded by the harness; action commands are mapped
            by the adapter to a harness protocol call.
        aliases:
          type: array
          maxItems: 4
          items:
            type: string
            maxLength: 64
            pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"
    ThreadBlock:
      type: object
      required:
        [id, messageId, messageSequence, sequence, role, messageKind, kind, createdAt]
      properties:
        id: { type: string }
        messageId: { type: string }
        messageSequence: { type: integer, format: int64, minimum: 1 }
        sequence: { type: integer, format: int64, minimum: 1, maximum: 128 }
        role: { $ref: "#/components/schemas/ThreadMessageRole" }
        messageKind: { $ref: "#/components/schemas/ThreadMessageKind" }
        kind: { $ref: "#/components/schemas/ThreadBlockKind" }
        content:
          type: string
          maxLength: 1048576
          description: Present only at explicit read/stream decryption boundaries.
        attachments:
          type: array
          maxItems: 8
          description: >-
            Present on a user message that included attachments. Names and
            workspace paths only; image bytes are not returned.
          items: { $ref: "#/components/schemas/ThreadAttachment" }
        event: { $ref: "#/components/schemas/ThreadAdapterEvent" }
        origin: { $ref: "#/components/schemas/ThreadOrigin" }
        createdAt: { type: string, format: date-time }
    ThreadBlockPage:
      type: object
      required: [items, nextCursor, more]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ThreadBlock" }
        nextCursor: { type: integer, format: int64, minimum: 0 }
        more: { type: boolean }
        gap: { $ref: "#/components/schemas/ThreadAdapterEvent" }
    ProjectPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        nextCursor:
          type: string
    CapsulePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Capsule"
        nextCursor:
          type: string
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/APIError"
    APIError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    HarnessSetupFile:
      type: object
      required: [path, content]
      properties:
        path:
          type: string
        content:
          type: string
        executable:
          type: boolean
    HarnessSetupUpload:
      type: object
      required: [harness, files]
      properties:
        harness: {type: string, enum: [agy, claude, codex, dsh, opencode, pi]}
        files:
          type: array
          maxItems: 256
          items: {$ref: "#/components/schemas/HarnessSetupFile"}
    HarnessSetupPreview:
      type: object
      required: [bundle, issues, digest]
      properties:
        bundle: {$ref: "#/components/schemas/HarnessSetupBundle"}
        digest: {type: string}
        issues:
          type: array
          items:
            type: object
            required: [path, reason]
            properties:
              path: {type: string}
              reason: {type: string}
        warnings:
          type: array
          description: Retained settings that may require Capsule-specific files, tools, or network access.
          items:
            type: object
            required: [path, reason]
            properties:
              path: {type: string}
              reason: {type: string}
    HarnessSetupBundle:
      type: object
      required: [harness, files]
      properties:
        dependencies:
          type: array
          maxItems: 16
          items:
            type: string
          description: Exact npm package versions installed inside the Capsule before harness startup.
        harness:
          type: string
          enum: [agy, claude, codex, dsh, opencode, pi]
        files:
          type: array
          maxItems: 256
          items:
            $ref: '#/components/schemas/HarnessSetupFile'
    HarnessSetup:
      type: object
      required: [id, name, harness, revision, default, deleted, createdAt, resourceVersion]
      properties:
        id:
          type: string
        name:
          type: string
        harness:
          type: string
        revision:
          type: string
        default:
          type: boolean
        deleted:
          type: boolean
        createdAt:
          type: string
          format: date-time
        resourceVersion:
          type: integer
          format: int64
    HarnessSetupPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HarnessSetup'
    HarnessSetupRevision:
      type: object
      required: [id, setupId, digest, files, createdAt]
      properties:
        id:
          type: string
        setupId:
          type: string
        digest:
          type: string
        files:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
    HarnessSetupRevisionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HarnessSetupRevision'
    PinnedHarnessSetup:
      type: object
      required: [harness, setupId, name, revision, revisedAt]
      description: One harness setup revision pinned to a Capsule at creation.
      properties:
        harness:
          type: string
        setupId:
          type: string
        name:
          type: string
          description: Current name of the setup. A rename shows here; the pinned files do not change.
        revision:
          type: string
        revisedAt:
          type: string
          format: date-time
          description: When this pinned revision was saved.
    ImportHarnessSetupRequest:
      type: object
      required: [name, bundle, default, expectedResourceVersion]
      properties:
        id:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 128
        bundle:
          $ref: '#/components/schemas/HarnessSetupBundle'
        default:
          type: boolean
        expectedResourceVersion:
          type: integer
          format: int64
    HarnessSetupIssue:
      type: object
      required: [path, reason]
      properties:
        path: {type: string, maxLength: 1024}
        reason: {type: string, maxLength: 512}
    HarnessSetupReport:
      type: object
      description: >-
        What an import left out and what it kept with a warning. It is the
        importing client's account, stored sealed and shown only as text.
      required: [issues, warnings]
      properties:
        issues:
          type: array
          maxItems: 512
          items: {$ref: "#/components/schemas/HarnessSetupIssue"}
        warnings:
          type: array
          maxItems: 512
          items: {$ref: "#/components/schemas/HarnessSetupIssue"}
    Profile:
      type: object
      required: [gitName, gitEmail, defaultConnections, setups, resourceVersion]
      properties:
        gitName: {type: string}
        gitEmail: {type: string}
        defaultConnections:
          type: object
          description: Harness name to one of the caller's provider connection ids.
          additionalProperties: {type: string}
        setups:
          type: array
          description: The caller's current default setup for each harness.
          items: {$ref: "#/components/schemas/HarnessSetup"}
        resourceVersion:
          type: integer
          format: int64
        updatedAt:
          type: string
          format: date-time
    UpdateProfileRequest:
      type: object
      required: [gitName, gitEmail, expectedResourceVersion]
      properties:
        gitName: {type: string, maxLength: 320}
        gitEmail: {type: string, maxLength: 320}
        defaultConnections:
          type: object
          additionalProperties: {type: string}
        expectedResourceVersion:
          type: integer
          format: int64
    GitIdentity:
      type: object
      required: [name, email]
      properties:
        name: {type: string, maxLength: 320}
        email: {type: string, maxLength: 320}
    ProfileImportSetup:
      type: object
      required: [bundle, report]
      properties:
        bundle: {$ref: "#/components/schemas/HarnessSetupBundle"}
        report: {$ref: "#/components/schemas/HarnessSetupReport"}
    ImportProfileRequest:
      type: object
      required: [setups, expectedResourceVersion]
      properties:
        setups:
          type: array
          maxItems: 16
          items: {$ref: "#/components/schemas/ProfileImportSetup"}
        git: {$ref: "#/components/schemas/GitIdentity"}
        expectedResourceVersion:
          type: integer
          format: int64
    ProfileImportResult:
      type: object
      required: [profile, saved, unchanged]
      properties:
        profile: {$ref: "#/components/schemas/Profile"}
        saved:
          type: array
          description: Setups that got a new revision.
          items: {$ref: "#/components/schemas/HarnessSetup"}
        unchanged:
          type: array
          description: Harnesses whose bundle matched the current default.
          items: {type: string}
    SetupRevisionRef:
      type: object
      required: [setupId, setupName, revision, savedAt]
      properties:
        setupId: {type: string}
        setupName: {type: string}
        revision: {type: string}
        savedAt:
          type: string
          format: date-time
    ConnectionDiagnostic:
      type: object
      required: [granted, revoked, needsSignIn]
      properties:
        granted:
          type: boolean
          description: Whether the Project grants a connection to this harness. Only a grant reaches the gateway.
        connectionId: {type: string}
        name: {type: string}
        provider: {type: string}
        revoked: {type: boolean}
        needsSignIn: {type: boolean}
    HarnessProfileDiagnostic:
      type: object
      required: [harness, projectOverride, filesAdded, filesRemoved, hasReport, exclusions, warnings, connection]
      properties:
        harness: {type: string}
        pinned: {$ref: "#/components/schemas/SetupRevisionRef"}
        current: {$ref: "#/components/schemas/SetupRevisionRef"}
        projectOverride:
          type: string
          description: Empty to follow the profile, "clean", or a setup id.
        filesAdded:
          type: array
          items: {type: string}
        filesRemoved:
          type: array
          items: {type: string}
        hasReport: {type: boolean}
        exclusions:
          type: array
          items: {$ref: "#/components/schemas/HarnessSetupIssue"}
        warnings:
          type: array
          items: {$ref: "#/components/schemas/HarnessSetupIssue"}
        connection: {$ref: "#/components/schemas/ConnectionDiagnostic"}
    CommitAuthorDiagnostic:
      type: object
      required: [source, name, email, profileName, profileEmail]
      properties:
        source: {type: string, enum: [project, capsule, none]}
        name: {type: string}
        email: {type: string}
        profileName: {type: string}
        profileEmail: {type: string}
    ProfileDiagnostic:
      type: object
      required: [capsuleId, nothingPinned, matchesProfile, harnesses, commitAuthor]
      properties:
        capsuleId: {type: string}
        nothingPinned:
          type: boolean
          description: The Capsule took nothing from a profile.
        matchesProfile:
          type: boolean
          description: True when every harness is pinned to what a new Capsule would pin and the commit identity matches the profile. Import exclusions and warnings do not affect it. It never claims the Capsule matches the laptop.
        harnesses:
          type: array
          items: {$ref: "#/components/schemas/HarnessProfileDiagnostic"}
        commitAuthor: {$ref: "#/components/schemas/CommitAuthorDiagnostic"}
    MutateHarnessSetupRequest:
      type: object
      required: [expectedResourceVersion]
      properties:
        name:
          type: string
        revision:
          type: string
        default:
          type: boolean
        deleted:
          type: boolean
        expectedResourceVersion:
          type: integer
          format: int64
    ClaudeLoginRequest:
      type: object
      properties:
        connectionId:
          type: string
          description: Official Anthropic connection to replace. Empty creates or replaces the existing Claude login.
    ClaudeLogin:
      type: object
      required: [loginId, authorizeUrl, expiresAt, manual]
      properties:
        loginId:
          type: string
        authorizeUrl:
          type: string
          description: Claude's authorize page. It contains the PKCE challenge and state, not the verifier or a token.
        expiresAt:
          type: string
          format: date-time
        manual:
          type: boolean
          description: When true, the browser cannot return to this daemon, so the operator submits the code Claude displays.
    ClaudeLoginCode:
      type: object
      required: [code]
      properties:
        code:
          type: string
          maxLength: 2048
          description: Authorization code from the Claude page, optionally code#state. Not an access token. Not stored.
    ClaudeLoginStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, complete, failed]
        connectionId:
          type: string
          description: Set when status is complete. Not a secret.
    ListEndpointModelsRequest:
      type: object
      properties:
        connectionId:
          type: string
          description: Use this saved connection's endpoint and key. A key in the body replaces the stored one for this request only.
        provider:
          $ref: "#/components/schemas/ProviderConnectionType"
        baseUrl:
          type: string
          maxLength: 2048
        apiKey:
          type: string
          writeOnly: true
          maxLength: 4096
        allowPrivateHttp:
          type: boolean
    EndpointModel:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
        context: {type: integer, minimum: 0}
        output: {type: integer, minimum: 0}
    EndpointModelList:
      type: object
      required: [models]
      properties:
        models:
          type: array
          maxItems: 512
          items: {$ref: "#/components/schemas/EndpointModel"}
        suggested:
          type: string
          description: Imported default, or the connection's saved model when it matches an entry.
    ProviderConnection:
      type: object
      required: [id, provider, name, createdAt, resourceVersion, revoked]
      properties:
        id:
          type: string
        provider:
          $ref: '#/components/schemas/ProviderConnectionType'
        name:
          type: string
        baseUrl:
          type: string
          description: Custom endpoint upstream, normalized without a trailing /v1. Never sent to a Capsule.
        defaultModel:
          type: string
          description: Model name configured in harnesses that use this custom endpoint.
        allowPrivateHttp:
          type: boolean
          description: Whether this custom endpoint uses plaintext HTTP to a private-network address.
        reasoningEfforts:
          type: array
          maxItems: 6
          items: { $ref: '#/components/schemas/ReasoningEffortLevel' }
          description: >-
            The reasoning effort levels the default model accepts, in order.
            Harnesses offer exactly these, plus off, for that model.
        account:
          type: string
          description: ChatGPT and Antigravity connections only. The signed-in account's email, for display.
        needsSignIn:
          type: boolean
          description: ChatGPT and Antigravity connections only. The sign-in stopped working; sign in again to resume.
        revocationUnconfirmed:
          type: boolean
          description: >-
            ChatGPT connections only. Local tokens were deleted but OpenAI did
            not confirm revocation; disconnect Meridian in ChatGPT's settings.
        credentialKind:
          $ref: '#/components/schemas/AnthropicCredentialKind'
        createdAt:
          type: string
          format: date-time
        resourceVersion:
          type: integer
          format: int64
        revoked:
          type: boolean
    ChatGPTSignInRequest:
      type: object
      properties:
        connectionId:
          type: string
          description: Existing ChatGPT connection to reauthorize; omit to create a new one.
        listen:
          type: boolean
          description: >-
            Ask the daemon to accept the browser's loopback callback itself.
            Use when the browser runs on the daemon's machine.
    ChatGPTSignInCompletion:
      type: object
      required: [callbackUrl]
      properties:
        callbackUrl:
          type: string
          maxLength: 8192
          description: The full address the browser was redirected to after approving.
    ChatGPTSignIn:
      type: object
      required: [id, authorizationUrl, redirectUri, listening, expiresAt, state]
      properties:
        id:
          type: string
        authorizationUrl:
          type: string
          description: OpenAI authorization page to open in the user's browser.
        redirectUri:
          type: string
        listening:
          type: boolean
          description: Whether the daemon is accepting the loopback callback itself.
        expiresAt:
          type: string
          format: date-time
        state:
          type: string
          enum: [pending, completed, failed]
        connectionId:
          type: string
        failure:
          type: string
    AntigravitySignInRequest:
      type: object
      properties:
        connectionId:
          type: string
          description: Existing Antigravity connection whose sign-in to replace; omit to create a new one.
    AntigravitySignInCode:
      type: object
      required: [code]
      properties:
        code:
          type: string
          maxLength: 2048
          writeOnly: true
          description: >-
            The code Google's Antigravity page shows after sign-in, or the
            full address of that page.
    AntigravitySignIn:
      type: object
      required: [id, state, expiresAt]
      properties:
        id:
          type: string
        state:
          type: string
          enum: [starting, awaiting_code, completing, completed, failed]
          description: >-
            starting while the sign-in Capsule starts; awaiting_code once
            authorizationUrl is ready; completing after a code is sent;
            completed once the profile is sealed; failed otherwise.
        authorizationUrl:
          type: string
          description: Google sign-in page agy printed, checked to be accounts.google.com. Set from awaiting_code.
        expiresAt:
          type: string
          format: date-time
        connectionId:
          type: string
        account:
          type: string
          description: The signed-in Google account's email, once completed.
        failure:
          type: string
    ProviderConnectionPage:
      type: object
      required: [items, enabled]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProviderConnection'
        enabled:
          type: boolean
        privateHttpAllowed:
          type: boolean
          description: Whether the daemon permits custom endpoints to opt in to plaintext HTTP on private networks.
        chatgptAvailable:
          type: boolean
          description: Whether Sign in with ChatGPT can create plan connections on this installation.
        antigravityAvailable:
          type: boolean
          description: Whether Sign in with Google can create Antigravity connections on this installation (ADR 0061).
    ReasoningEffortLevel:
      type: string
      enum: [minimal, low, medium, high, xhigh, max]
      description: >-
        An effort level a custom endpoint's model accepts. The name is sent
        upstream as the request's reasoning effort.
    ProviderConnectionType:
      type: string
      enum: [openai, anthropic, openai-compatible, anthropic-compatible, chatgpt, antigravity]
      description: >-
        openai and anthropic use fixed official upstreams. openai-compatible
        and anthropic-compatible use an operator-configured baseUrl. chatgpt
        uses the signed-in user's ChatGPT plan; it is created only by Sign in
        with ChatGPT and accepts only rename and revocation here.
        antigravity holds Antigravity CLI's own Google sign-in profile
        (ADR 0061); it is created only by Sign in with Google, is not a
        gateway connection, and accepts only rename and removal here.
    AnthropicCredentialKind:
      type: string
      enum: [api_key, oauth]
      description: >-
        How the provider gateway attaches an official Anthropic Claude login.
        api_key sends X-Api-Key. oauth sends Authorization: Bearer for the
        access token from in-UI sign-in, or for a setup token. Omitted means
        api_key. This value is not the secret. Only the anthropic provider
        accepts oauth.
    ProviderConnectionRequest:
      type: object
      required: [name, provider, apiKey, expectedResourceVersion]
      properties:
        name:
          type: string
        provider:
          $ref: '#/components/schemas/ProviderConnectionType'
        apiKey:
          type: string
          writeOnly: true
          maxLength: 4096
          description: >-
            Required for official providers. For anthropic this is the fallback
            Claude login: an API key, or a setup token when credentialKind is
            oauth. In-UI sign-in uses /claude-login and does not send a token
            here. Custom endpoints accept an empty key and then send no
            upstream credential. The value is write-only and is not returned.
        credentialKind:
          $ref: '#/components/schemas/AnthropicCredentialKind'
        baseUrl:
          type: string
          maxLength: 2048
          description: >-
            Required for custom endpoint types; rejected for official ones.
            An https URL, or an http URL on a loopback or private-network
            address when allowPrivateHttp is set. A trailing /v1 is removed.
        defaultModel:
          type: string
          maxLength: 256
          description: Optional model name for custom endpoints; OpenCode and Pi require one.
        allowPrivateHttp:
          type: boolean
          description: Opt in to a plaintext http baseUrl. Requires the daemon's --provider-gateway-allow-private-http flag.
        reasoningEfforts:
          type: array
          maxItems: 6
          items: { $ref: '#/components/schemas/ReasoningEffortLevel' }
          description: >-
            Optional, custom endpoints with a defaultModel only: distinct
            effort levels the model accepts. Stored in canonical order.
        expectedResourceVersion:
          type: integer
          format: int64
        revoked:
          type: boolean
    ProjectProviderConnection:
      type: object
      required: [connectionId]
      properties:
        connectionId:
          type: string
          description: Connection to authorize for this Project and harness; empty revokes access.
    ProjectHarnessSetup:
      type: object
      required: [setup]
      properties:
        setup:
          type: string
          description: Saved setup ID, clean, or empty to inherit the personal default.
tags:
  - name: probes
    description: Process health and readiness.
  - name: audit
    description: Append-only, content-free audit records.
  - name: members
    description: Team mode membership administration.
  - name: capabilities
    description: Effective provider-backed UI features.
  - name: secrets
    description: Encrypted purpose-scoped named secret metadata and mutation.
  - name: projects
    description: Project metadata.
  - name: capsules
    description: Asynchronous Capsule lifecycle.
  - name: runs
    description: Harness execution, ordered events, and reconnectable PTY attachment.
  - name: threads
    description: Provider-independent encrypted structured harness Threads.
  - name: notes
    description: Working notes and Project notes (ADR 0060). Content is encrypted and never quoted in notifications.
  - name: previews
    description: Bounded Capsule-local port discovery and loopback preview tickets.
  - name: files
    description: Bounded workspace browsing and authenticated portable export.
  - name: deliveries
    description: Explicitly approved exact-object commit, push, and GitHub pull request delivery.
  - name: routines
    description: Operator-written clocks that start a fresh Project Thread per fire.
