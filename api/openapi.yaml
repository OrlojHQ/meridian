            Meridian-Git-Branch:
              schema: { type: string }
            Meridian-Git-Head:
              schema: { type: string }
            Meridian-Git-Dirty:
              schema: { type: string }
          content:
            application/x-tar:
              schema: { type: string, format: binary }
