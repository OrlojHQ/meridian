openapi: 3.1.0
info:
  title: Meridian API
  version: 0.5.0
  description: Control-plane API for trusted-development Docker and Kubernetes Agent Sandbox Capsules.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://127.0.0.1:8080
    description: Loopback local development
security:
  - bearerAuth: []
paths:
  /provider-gateway/{provider}/v1/{operation}:
    post:
      operationId: proxyProviderInference
      summary: Forward an inference request using a scoped Capsule lease
      description: >-
        Requires a live Capsule gateway lease in Authorization (Bearer) or X-Api-Key.
        Installation API tokens and browser sessions do not authorize this operation.
        Only OpenAI responses/chat completions and Anthropic messages/token counting
        are supported; unsupported provider/operation combinations return 404.
        The origin must be enabled explicitly by the deployment operator.
        Official Anthropic requests attach the stored Claude login: an API key
        as X-Api-Key, or an OAuth access token from in-UI sign-in (or a setup
        token) as Authorization: Bearer. The Capsule lease is checked and then
        dropped; it is never forwarded upstream.
        When the upstream provider rejects a request, the gateway returns its 4xx or
        5xx status (other statuses become 502), sets error.upstreamStatus, and
        includes at most 300 characters of sanitized upstream reason in error.message.
        Upstream headers and raw bodies are never copied.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [openai, anthropic, openai-compatible, anthropic-compatible]
        - name: operation
          in: path
          required: true
          schema:
            type: string
          description: responses, chat/completions, messages, or messages/count_tokens.
        - name: Authorization
          in: header
          schema:
            type: string
          description: Bearer Capsule lease; required unless X-Api-Key supplies the lease.
        - name: X-Api-Key
          in: header
          schema:
            type: string
          description: Capsule lease for Anthropic native clients.
        - name: Anthropic-Beta
          in: header
          schema:
            type: string
            maxLength: 2048
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Native provider JSON or bounded event stream.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/event-stream:
              schema:
                type: string
        default:
          $ref: "#/components/responses/DefaultError"
  /claude-login:
    post:
      operationId: beginClaudeLogin
      summary: beginClaudeLogin
      description: >-
        Start a Claude account sign-in. The response authorizeUrl is opened in
        the browser. The PKCE verifier stays on the daemon and is not returned.
        A loopback browser is redirected back to this daemon. Any other host
        sets manual, and the operator submits the code Claude displays.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaudeLoginRequest"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaudeLogin"
        default:
          $ref: "#/components/responses/DefaultError"
  /claude-login/{loginId}:
    get:
      operationId: getClaudeLogin
      summary: getClaudeLogin
      description: Sign-in status. Never includes a token or an authorization code.
      parameters:
        - name: loginId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaudeLoginStatus"
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: completeClaudeLogin
      summary: completeClaudeLogin
      description: >-
        Exchange an authorization code from the Claude sign-in page. This is
        the fallback when the browser cannot return to the daemon. The code is
        not a token and is not stored.
      parameters:
        - name: loginId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaudeLoginCode"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaudeLoginStatus"
        default:
          $ref: "#/components/responses/DefaultError"
  /provider-connections:
    get:
      operationId: listProviderConnections
      summary: listProviderConnections
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConnectionPage"
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: createProviderConnection
      summary: createProviderConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderConnectionRequest"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConnection"
        default:
          $ref: "#/components/responses/DefaultError"
  /provider-connections/{connectionId}:
    put:
      operationId: updateProviderConnection
      summary: updateProviderConnection
      parameters:
        - name: connectionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderConnectionRequest"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConnection"
        default:
          $ref: "#/components/responses/DefaultError"
  /provider-connections/chatgpt/sign-ins:
    post:
      operationId: startChatGPTSignIn
      summary: startChatGPTSignIn
      description: >-
        Starts Sign in with ChatGPT for a new connection, or reauthorizes an
        existing one. The daemon keeps the PKCE verifier; open
        authorizationUrl in a browser, then complete the attempt with the
        redirected address. Responses never contain tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatGPTSignInRequest"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatGPTSignIn"
        default:
          $ref: "#/components/responses/DefaultError"
  /provider-connections/chatgpt/sign-ins/{signInId}:
    get:
      operationId: getChatGPTSignIn
      summary: getChatGPTSignIn
      parameters:
        - name: signInId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatGPTSignIn"
        default:
          $ref: "#/components/responses/DefaultError"
  /provider-connections/chatgpt/sign-ins/{signInId}/complete:
    post:
      operationId: completeChatGPTSignIn
      summary: completeChatGPTSignIn
      parameters:
        - name: signInId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatGPTSignInCompletion"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatGPTSignIn"
        default:
          $ref: "#/components/responses/DefaultError"
  /projects/{projectId}/harnesses/{harness}/connection:
    get:
      operationId: getProjectProviderConnection
      summary: getProjectProviderConnection
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: harness
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectProviderConnection"
        default:
          $ref: "#/components/responses/DefaultError"
    put:
      operationId: grantProjectProviderConnection
      summary: grantProjectProviderConnection
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: harness
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectProviderConnection"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectProviderConnection"
        default:
          $ref: "#/components/responses/DefaultError"
  /projects/{projectId}/harnesses/{harness}/setup:
    get:
      operationId: getProjectHarnessSetup
      summary: getProjectHarnessSetup
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: harness
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectHarnessSetup"
        default:
          $ref: "#/components/responses/DefaultError"
    put:
      operationId: setProjectHarnessSetup
      summary: setProjectHarnessSetup
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: harness
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectHarnessSetup"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectHarnessSetup"
        default:
          $ref: "#/components/responses/DefaultError"
  /harness-setups/preview:
    post:
      operationId: previewHarnessSetup
      summary: Review explicitly selected configuration files without saving
      description: Original file content is processed in memory only. Returns sanitized portable files and exclusions. Does not read server filesystem paths or execute imported code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HarnessSetupUpload"
      responses:
        "200":
          description: Reviewed import, not yet saved
          headers:
            Cache-Control:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HarnessSetupPreview"}
        default:
          $ref: "#/components/responses/DefaultError"
  /harness-setups:
    get:
      operationId: listHarnessSetups
      summary: listHarnessSetups
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarnessSetupPage"
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: importHarnessSetup
      summary: importHarnessSetup
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportHarnessSetupRequest"
      responses:
        "201":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarnessSetup"
        default:
          $ref: "#/components/responses/DefaultError"
  /harness-setups/{setupId}:
    patch:
      operationId: mutateHarnessSetup
      summary: mutateHarnessSetup
      parameters:
        - name: setupId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MutateHarnessSetupRequest"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarnessSetup"
        default:
          $ref: "#/components/responses/DefaultError"
  /harness-setups/{setupId}/contents:
    get:
      operationId: getHarnessSetupContents
      summary: Read saved configuration for editing
      parameters:
        - name: setupId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current setup content and version; never cached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportHarnessSetupRequest'
        default:
          $ref: '#/components/responses/DefaultError'
  /harness-setups/{setupId}/revisions:
    get:
      operationId: listHarnessSetupRevisions
      summary: listHarnessSetupRevisions
      parameters:
        - name: setupId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarnessSetupRevisionPage"
        default:
          $ref: "#/components/responses/DefaultError"
  /healthz:
    get:
      operationId: getHealth
      summary: Report process health
      security: []
      tags: [probes]
      responses:
        "200":
          description: Process is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
  /readyz:
    get:
      operationId: getReadiness
      summary: Report service readiness
      security: []
      tags: [probes]
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"
        "503":
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
  /capabilities:
    get:
      operationId: getCapabilities
      summary: Report provider-backed product capabilities
      description: Clients must treat false capabilities as unsupported and must not construct private provider URLs.
      tags: [capabilities]
      responses:
        "200":
          description: Effective capabilities for this daemon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
  /audit-records:
    get:
      operationId: listAuditRecords
      summary: List append-only audit records after a stable cursor
      description: >-
        Records name the acting principal, the action, the object id, and the
        result. They never hold secret values, prompts, transcript text,
        diffs, or file contents. A member reads their own records; an admin
        reads every record. Records cannot be edited or deleted through the
        API.
      tags: [audit]
      parameters:
        - $ref: "#/components/parameters/After"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        "200":
          description: Audit records, oldest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditRecordPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/DefaultError"
  /secrets:
    get:
      operationId: listSecrets
      summary: List named secret metadata
      tags: [secrets]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Secret metadata page; values are never returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
  /secrets/{secretName}:
    parameters:
      - name: secretName
        in: path
        required: true
        schema:
          type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_.-]{0,127}$"
    put:
      operationId: putSecret
      summary: Create or replace an encrypted named secret
      tags: [secrets]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutSecretRequest"
      responses:
        "200":
          description: Stored secret metadata; value is never returned
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Secret"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
    delete:
      operationId: deleteSecret
      summary: Crypto-shred a named secret by deleting its envelope
      tags: [secrets]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteSecretRequest"
      responses:
        "200":
          description: Deleted secret metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Secret"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
  /projects:
    post:
      operationId: createProject
      summary: Create a project
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
    get:
      operationId: listProjects
      summary: List projects
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Project page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
  /projects/{projectId}:
    get:
      operationId: getProject
      summary: Get a project
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
    patch:
      operationId: patchProject
      summary: Replace the Project harness-image allowlist
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchProjectRequest"
      responses:
        "200":
          description: Project updated
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
  /projects/{projectId}/delete:
    post:
      operationId: deleteProject
      summary: Delete a Project and everything it owns
      description: >
        Deletes the Project's Capsules through the same path as deleteCapsule,
        so the provider removes owned containers and volumes. Then deletes its
        threads, transcripts, artifacts, project environment, and
        project-scoped named secrets. Named-secret ciphertext, nonce, and
        envelope metadata are destroyed when no other live Project still names
        that secret. Transcripts and Moment artifacts are deleted with the
        Project and are not retained. If an owned container cannot be removed,
        the Project stays in state failed with the reason and a later delete
        resumes from that point. Repeating a delete is idempotent.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/LifecycleMutation"
      responses:
        "202":
          description: Project deletion accepted. The body is the Project in state deleting, failed, or deleted.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
  /projects/{projectId}/threads:
    post:
      operationId: createProjectThread
      summary: Provision a fresh Capsule and start its first structured Thread
      description: >
        Persists a durable encrypted session intent before asynchronously
        provisioning a new Capsule. Idempotent replay returns the same intent
        and resource IDs. A harness pack whose installation catalog entry
        lacks the `structured` interaction mode is rejected with 422
        `unsupported` before anything is provisioned. Without a prompt the
        harness starts idle and reports its models, so the first turn can use
        a model chosen in the Thread.
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectThreadRequest" }
      responses:
        "202":
          description: Project Thread session accepted
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectThreadIntent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/DefaultError" }
  /project-thread-intents/{intentId}:
    get:
      operationId: getProjectThreadIntent
      summary: Get deterministic Project Thread provisioning status
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/ProjectThreadIntentId"
      responses:
        "200":
          description: Project Thread intent
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectThreadIntent" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/DefaultError" }
  /board:
    get:
      operationId: getBoard
      summary: List every Capsule's content-free status across Projects
      description: >
        One row per Capsule, grouped by status. Subagent Capsules fold under
        their lead's child rollup; with the default expand=attention a subagent
        that needs the operator also gets its own surfaced row. Built from
        Capsule, Thread, Run, Delivery and link summaries plus the in-memory
        Thread attention; never transcript text and never Git status.
      tags: [threads]
      parameters:
        - name: projectId
          in: query
          required: false
          schema: { type: string }
        - name: expand
          in: query
          required: false
          description: >
            attention (default) lists main Capsules and subagents that need the
            operator; all lists every subagent; none lists main Capsules only. A
            subagent whose lead is not listed always gets its own row.
          schema:
            type: string
            enum: [attention, all, none]
      responses:
        "200":
          description: Board rows, needs-you first and oldest first within it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/DefaultError" }
  /threads/{threadId}/links:
    get:
      operationId: listThreadLinks
      summary: List the subagent Threads a lead Thread spawned
      description: Content-free. Report text stays in the child transcript.
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/ThreadId"
      responses:
        "200":
          description: Thread links in creation order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreadLinkPage" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/DefaultError" }
  /thread-links/{linkId}:
    get:
      operationId: getThreadLink
      summary: Get one lead-to-subagent Thread link
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/LinkId"
      responses:
        "200":
          description: Thread link
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreadLink" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/DefaultError" }
  /thread-links/{linkId}/remove:
    post:
      operationId: removeSubagent
      summary: Stop one subagent and delete its Capsule
      description: >
        Operator-only. Closes this one link as cancelled so the lead hears the
        subagent was cancelled, ends the subagent's session, and deletes its
        Capsule once no Run is active there. The lead's Coordination Grant is
        unchanged, so the lead can keep spawning, and the deleted Capsule no
        longer counts toward its live Capsules. Encrypted Thread history is
        kept, as with any Capsule delete. Promoted subagents are refused; a
        stopped Capsule with a live session must be resumed first.
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/LinkId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/LifecycleMutation"
      responses:
        "202":
          description: Link closed; the Capsule is deleted or will be once its session ends
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreadLink" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/DefaultError" }
  /coordination-grants/{grantId}:
    get:
      operationId: getCoordinationGrant
      summary: Get a lead Thread's Coordination Grant
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/GrantId"
      responses:
        "200":
          description: Coordination Grant
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoordinationGrant" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/DefaultError" }
    patch:
      operationId: updateCoordinationGrant
      summary: Update a Coordination Grant's limits
      description: >
        Changes spawn approval, limits, harnesses, deadline, deadline action,
        or archiveAfter on an active grant. The operator may loosen or tighten
        limits. Switching spawnApproval to auto does not start spawns already
        waiting for approval. Deadline is remaining time from now, between 5
        minutes and 72 hours, and cannot pass createdAt+72h.
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/GrantId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCoordinationGrantRequest" }
      responses:
        "200":
          description: Updated grant
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoordinationGrant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/DefaultError" }
  /coordination-grants/{grantId}/revoke:
    post:
      operationId: revokeCoordinationGrant
      summary: Revoke a Coordination Grant
      description: >
        Ends the lead's authority to spawn, message, or cancel subagents. With
        cancelDescendants, open links close and their subagents are cancelled
        and paused; otherwise subagents keep running for the operator.
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/GrantId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevokeCoordinationGrantRequest" }
      responses:
        "200":
          description: Revoked grant
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoordinationGrant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/DefaultError" }
  /coordination-requests:
    get:
      operationId: listCoordinationRequests
      summary: List coordination requests
      description: >
        The operator queue for spawn approvals. Prompts are not included;
        they stay in the child Thread's encrypted intent.
      tags: [threads]
      parameters:
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/CoordinationRequestState"
          description: Defaults to pending_approval.
      responses:
        "200":
          description: Coordination requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoordinationRequestPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/DefaultError" }
  /coordination-requests/{requestId}/approve:
    post:
      operationId: approveCoordinationRequest
      summary: Approve a queued spawn
      description: >
        Starts a subagent the lead spawned under spawnApproval=operator.
        The child Capsule is not provisioned until this call. Denied or
        completed requests cannot be approved.
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecideCoordinationRequest" }
      responses:
        "200":
          description: Approved request
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoordinationRequest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/DefaultError" }
  /coordination-requests/{requestId}/deny:
    post:
      operationId: denyCoordinationRequest
      summary: Deny a queued spawn
      description: >
        Refuses a subagent the lead spawned under spawnApproval=operator.
        The child Capsule is not deleted and still counts toward the grant's
        descendantsCreated.
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecideCoordinationRequest" }
      responses:
        "200":
          description: Denied request
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoordinationRequest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/DefaultError" }
  /projects/{projectId}/capsules:
    post:
      operationId: createCapsule
      summary: Request Capsule creation
      tags: [capsules]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCapsuleRequest"
      responses:
        "202":
          description: Capsule creation accepted
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capsule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
    get:
      operationId: listCapsules
      summary: List a project's Capsules
      tags: [capsules]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: role
          in: query
          required: false
          description: Only main Capsules or only subagent Capsules.
          schema: { $ref: "#/components/schemas/CapsuleRole" }
      responses:
        "200":
          description: Capsule page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsulePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
  /capsules/{capsuleId}:
    get:
      operationId: getCapsule
      summary: Get a Capsule
      tags: [capsules]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
      responses:
        "200":
          description: Capsule
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capsule"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
  /capsules/{capsuleId}/harness-profiles:
    get:
      operationId: listHarnessProfiles
      summary: Discover effective native and structured harness profiles
      description: Provider-independent discovery. A false structured value identifies PTY/native fallback; clients never inspect provider internals.
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
      responses:
        "200":
          description: Effective Capsule-local harness profiles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HarnessProfilePage" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
  /capsules/{capsuleId}/threads:
    post:
      operationId: createThread
      summary: Create an encrypted structured Thread, optionally with an atomic first message and session start
      description: The Thread, encrypted first message, Run intent, and idempotency resource references are committed before runtime side effects.
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateThreadRequest" }
      responses:
        "201":
          description: Thread created; session status is represented by currentRun when start was requested
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreadMutationResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "423": { $ref: "#/components/responses/Locked" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/DefaultError" }
    get:
      operationId: listThreads
      summary: List retained Thread histories for a Capsule
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Thread history page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreadPage" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/DefaultError" }
  /threads/{threadId}:
    get:
      operationId: getThread
      summary: Get Thread lifecycle and current session status
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/ThreadId"
      responses:
        "200":
          description: Thread metadata; transcript content is not included
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Thread" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/DefaultError" }
  /threads/{threadId}/archive:
    post:
      operationId: archiveThread
      summary: Archive a Thread history
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/ThreadId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody: { $ref: "#/components/requestBodies/LifecycleMutation" }
      responses:
        "200": { $ref: "#/components/responses/ThreadMutation" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
  /threads/{threadId}/delete:
    post:
      operationId: deleteThread
      summary: Permanently crypto-shred a Thread transcript
      description: This removes the wrapped data key but retains ciphertext and content-free lifecycle metadata. It is irreversible and requires an explicit confirmation token.
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/ThreadId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteThreadRequest" }
      responses:
        "200": { $ref: "#/components/responses/ThreadMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/DefaultError" }
  /threads/{threadId}/start:
    post:
      operationId: startThread
      summary: Start a new structured adapter session for an active Thread
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/ThreadId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody: { $ref: "#/components/requestBodies/LifecycleMutation" }
      responses:
        "202": { $ref: "#/components/responses/ThreadSessionMutation" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
  /threads/{threadId}/resume:
    post:
      operationId: resumeThread
      summary: Resume a structured adapter session from encrypted adapter state
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/ThreadId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody: { $ref: "#/components/requestBodies/LifecycleMutation" }
      responses:
        "202": { $ref: "#/components/responses/ThreadSessionMutation" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "423": { $ref: "#/components/responses/Locked" }
        default: { $ref: "#/components/responses/DefaultError" }
  /threads/{threadId}/messages:
    post:
      operationId: sendThreadMessage
      summary: Durably append and send a user message
      description: The encrypted message and idempotency resource references commit before the adapter side effect.
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/ThreadId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendThreadMessageRequest" }
      responses:
        "202": { $ref: "#/components/responses/ThreadSessionMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "423": { $ref: "#/components/responses/Locked" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/DefaultError" }
  /threads/{threadId}/responses:
    post:
      operationId: respondThread
      summary: Answer one permission or input request
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/ThreadId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ThreadResponseRequest" }
      responses:
        "202": { $ref: "#/components/responses/ThreadSessionMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
  /threads/{threadId}/model:
    post:
      operationId: setThreadModel
      summary: Switch the active session to another model its harness reported
      description: >-
        The model must be an option ID from the session's latest models event.
        The harness switches from its next turn and reports its models again;
        an ID it does not offer produces a model_unavailable error event. A
        session whose harness reports no models answers 422.
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/ThreadId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ThreadModelRequest" }
      responses:
        "202": { $ref: "#/components/responses/ThreadSessionMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
  /threads/{threadId}/effort:
    post:
      operationId: setThreadEffort
      summary: Change the active session's reasoning effort to a level its harness reported
      description: >-
        The effort must be an option ID from the effort of the session's latest
        models event. The harness applies it from its next turn and reports its
        models again; a level it does not offer produces an effort_unavailable
        error event. A session whose harness reports no effort answers 422.
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/ThreadId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ThreadEffortRequest" }
      responses:
        "202": { $ref: "#/components/responses/ThreadSessionMutation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
  /threads/{threadId}/cancel:
    post:
      operationId: cancelThread
      summary: Cancel the active structured session
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/ThreadId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody: { $ref: "#/components/requestBodies/LifecycleMutation" }
      responses:
        "202": { $ref: "#/components/responses/ThreadSessionMutation" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
  /threads/{threadId}/blocks:
    get:
      operationId: listThreadBlocks
      summary: Replay ordered decrypted Thread blocks
      description: This is an explicit decryption boundary. Deltas are persisted as delta events; a final assistant message is authoritative and clients should replace matching displayed deltas rather than append duplicate text.
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/ThreadId"
        - $ref: "#/components/parameters/After"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      responses:
        "200":
          description: Ordered decrypted block page with explicit replay-gap information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreadBlockPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Corrupt" }
        "423": { $ref: "#/components/responses/Locked" }
        default: { $ref: "#/components/responses/DefaultError" }
  /threads/{threadId}/blocks/stream:
    get:
      operationId: streamThreadBlocks
      summary: Follow decrypted Thread blocks over Server-Sent Events
      description: Reconnect with Last-Event-ID or after. Heartbeats carry no content; slow clients are disconnected.
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/ThreadId"
        - $ref: "#/components/parameters/After"
        - name: Last-Event-ID
          in: header
          schema: { type: string }
      responses:
        "200":
          description: SSE stream with durable message-sequence event IDs
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "423": { $ref: "#/components/responses/Locked" }
        default: { $ref: "#/components/responses/DefaultError" }
  /capsules/{capsuleId}/pause:
    post:
      operationId: pauseCapsule
      summary: Request Capsule pause
      tags: [capsules]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/LifecycleMutation"
      responses:
        "202":
          $ref: "#/components/responses/CapsuleAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
  /capsules/{capsuleId}/promote:
    post:
      operationId: promoteCapsule
      summary: Promote a subagent Capsule to a main Capsule
      description: >
        Promotion is permanent and grants no coordination authority. The link
        to the lead stays open unless detach is set; a promoted Capsule that
        kept its link can be detached later. Promoted subagents are never
        auto-archived or stopped by their lead.
      tags: [capsules]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoteCapsuleRequest"
      responses:
        "200":
          description: Promoted Capsule
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capsule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        default:
          $ref: "#/components/responses/DefaultError"
  /projects/{projectId}/environment:
    get:
      operationId: getProjectEnvironment
      summary: Inspect project preparation settings and recent progress
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project environment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectEnvironment" }
        default:
          $ref: "#/components/responses/DefaultError"
    put:
      operationId: updateProjectEnvironment
      summary: Configure preparation or rebuild on next launch
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnvironmentMutation" }
      responses:
        "200":
          description: Updated project environment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectEnvironment" }
        default:
          $ref: "#/components/responses/DefaultError"
  /capsules/{capsuleId}/resume:
    post:
      operationId: resumeCapsule
