openapi: 3.1.0
info:
  title: Meridian API
  version: 0.5.0
  description: Control-plane API for trusted-development Docker and Kubernetes Agent Sandbox Capsules.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://127.0.0.1:8080
    description: Loopback local development
security:
  - bearerAuth: []
paths:
  /provider-gateway/{provider}/v1/{operation}:
    post:
      operationId: proxyProviderInference
      summary: Forward an inference request using a scoped Capsule lease
      description: >-
        Requires a live Capsule gateway lease in Authorization (Bearer) or X-Api-Key.
        Installation API tokens and browser sessions do not authorize this operation.
        Only OpenAI responses/chat completions and Anthropic messages/token counting
        are supported; unsupported provider/operation combinations return 404.
        The origin must be enabled explicitly by the deployment operator.
        Official Anthropic requests attach the stored Claude login: an API key
        as X-Api-Key, or an OAuth access token from in-UI sign-in (or a setup
        token) as Authorization: Bearer. The Capsule lease is checked and then
        dropped; it is never forwarded upstream.
        When the upstream provider rejects a request, the gateway returns its 4xx or
        5xx status (other statuses become 502), sets error.upstreamStatus, and
        includes at most 300 characters of sanitized upstream reason in error.message.
        Upstream headers and raw bodies are never copied.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [openai, anthropic, openai-compatible, anthropic-compatible]
        - name: operation
          in: path
          required: true
          schema:
            type: string
          description: responses, chat/completions, messages, or messages/count_tokens.
        - name: Authorization
          in: header
          schema:
            type: string
          description: Bearer Capsule lease; required unless X-Api-Key supplies the lease.
        - name: X-Api-Key
          in: header
          schema:
            type: string
          description: Capsule lease for Anthropic native clients.
        - name: Anthropic-Beta
          in: header
          schema:
            type: string
            maxLength: 2048
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Native provider JSON or bounded event stream.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/event-stream:
              schema:
                type: string
        default:
          $ref: "#/components/responses/DefaultError"
  /claude-login:
    post:
      operationId: beginClaudeLogin
      summary: beginClaudeLogin
      description: >-
        Start a Claude account sign-in. The response authorizeUrl is opened in
        the browser. The PKCE verifier stays on the daemon and is not returned.
        A loopback browser is redirected back to this daemon. Any other host
        sets manual, and the operator submits the code Claude displays.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaudeLoginRequest"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaudeLogin"
        default:
          $ref: "#/components/responses/DefaultError"
  /claude-login/{loginId}:
    get:
      operationId: getClaudeLogin
      summary: getClaudeLogin
      description: Sign-in status. Never includes a token or an authorization code.
      parameters:
        - name: loginId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaudeLoginStatus"
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: completeClaudeLogin
      summary: completeClaudeLogin
      description: >-
        Exchange an authorization code from the Claude sign-in page. This is
        the fallback when the browser cannot return to the daemon. The code is
        not a token and is not stored.
      parameters:
        - name: loginId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaudeLoginCode"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaudeLoginStatus"
        default:
          $ref: "#/components/responses/DefaultError"
  /provider-connections/models:
    post:
      operationId: listEndpointModels
      summary: List models served by a custom endpoint
      description: Fetches the endpoint's model list and overlays names from an imported OpenCode setup when the endpoint matches. The key is not returned.
      tags: [provider-connections]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListEndpointModelsRequest"
      responses:
        "200":
          description: Models
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndpointModelList"
        default:
          $ref: "#/components/responses/DefaultError"
  /provider-connections:
    get:
      operationId: listProviderConnections
      summary: listProviderConnections
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConnectionPage"
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: createProviderConnection
      summary: createProviderConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderConnectionRequest"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConnection"
        default:
          $ref: "#/components/responses/DefaultError"
  /provider-connections/{connectionId}:
    put:
      operationId: updateProviderConnection
      summary: updateProviderConnection
      parameters:
        - name: connectionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderConnectionRequest"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConnection"
        default:
          $ref: "#/components/responses/DefaultError"
    delete:
      operationId: deleteProviderConnection
      summary: Remove a revoked provider connection
      description: >-
        Removes a connection that has already been revoked, including its
        Project grants and a workstation-profile default that names it.
        A connection that is still signed in stays. A Capsule that is
        starting, ready, or paused, and whose Project still grants it, must
        be stopped first.
        Another member's connection is not found.
      parameters:
        - name: connectionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The connection was removed
        default:
          $ref: "#/components/responses/DefaultError"
  /provider-connections/chatgpt/sign-ins:
    post:
      operationId: startChatGPTSignIn
      summary: startChatGPTSignIn
      description: >-
        Starts Sign in with ChatGPT for a new connection, or reauthorizes an
        existing one. The daemon keeps the PKCE verifier; open
        authorizationUrl in a browser, then complete the attempt with the
        redirected address. Responses never contain tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatGPTSignInRequest"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatGPTSignIn"
        default:
          $ref: "#/components/responses/DefaultError"
  /provider-connections/chatgpt/sign-ins/{signInId}:
    get:
      operationId: getChatGPTSignIn
      summary: getChatGPTSignIn
      parameters:
        - name: signInId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatGPTSignIn"
        default:
          $ref: "#/components/responses/DefaultError"
  /provider-connections/chatgpt/sign-ins/{signInId}/complete:
    post:
      operationId: completeChatGPTSignIn
      summary: completeChatGPTSignIn
      parameters:
        - name: signInId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatGPTSignInCompletion"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatGPTSignIn"
        default:
          $ref: "#/components/responses/DefaultError"
  /provider-connections/antigravity/sign-ins:
    post:
      operationId: startAntigravitySignIn
      summary: startAntigravitySignIn
      description: >-
        Starts Sign in with Google for Antigravity CLI (ADR 0061), for a new
        connection or to replace an existing one's sign-in. The daemon starts
        a sign-in Capsule that runs only the pinned agy binary's own login.
        Poll the attempt until it is awaiting_code, open authorizationUrl,
        then send the code Google's page shows. Responses never contain a
        token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AntigravitySignInRequest"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AntigravitySignIn"
        default:
          $ref: "#/components/responses/DefaultError"
  /provider-connections/antigravity/sign-ins/{signInId}:
    get:
      operationId: getAntigravitySignIn
      summary: getAntigravitySignIn
      parameters:
        - name: signInId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AntigravitySignIn"
        default:
          $ref: "#/components/responses/DefaultError"
    delete:
      operationId: cancelAntigravitySignIn
      summary: cancelAntigravitySignIn
      description: Ends an unfinished attempt and deletes its sign-in Capsule.
      parameters:
        - name: signInId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The attempt ended
        default:
          $ref: "#/components/responses/DefaultError"
  /provider-connections/antigravity/sign-ins/{signInId}/code:
    post:
      operationId: sendAntigravitySignInCode
      summary: sendAntigravitySignInCode
      description: >-
        Passes the code from Google's Antigravity page to agy in the sign-in
        Capsule. The daemon does not store the code.
      parameters:
        - name: signInId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AntigravitySignInCode"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AntigravitySignIn"
        default:
          $ref: "#/components/responses/DefaultError"
  /projects/{projectId}/harnesses/{harness}/connection:
    get:
      operationId: getProjectProviderConnection
      summary: getProjectProviderConnection
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: harness
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectProviderConnection"
        default:
          $ref: "#/components/responses/DefaultError"
    put:
      operationId: grantProjectProviderConnection
      summary: grantProjectProviderConnection
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: harness
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectProviderConnection"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectProviderConnection"
        default:
          $ref: "#/components/responses/DefaultError"
  /projects/{projectId}/harnesses/{harness}/setup:
    get:
      operationId: getProjectHarnessSetup
      summary: getProjectHarnessSetup
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: harness
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectHarnessSetup"
        default:
          $ref: "#/components/responses/DefaultError"
    put:
      operationId: setProjectHarnessSetup
      summary: setProjectHarnessSetup
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: harness
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectHarnessSetup"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectHarnessSetup"
        default:
          $ref: "#/components/responses/DefaultError"
  /harness-setups/preview:
    post:
      operationId: previewHarnessSetup
      summary: Review explicitly selected configuration files without saving
      description: Original file content is processed in memory only. Returns sanitized portable files and exclusions. Does not read server filesystem paths or execute imported code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HarnessSetupUpload"
      responses:
        "200":
          description: Reviewed import, not yet saved
          headers:
            Cache-Control:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HarnessSetupPreview"}
        default:
          $ref: "#/components/responses/DefaultError"
  /harness-setups:
    get:
      operationId: listHarnessSetups
      summary: listHarnessSetups
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarnessSetupPage"
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: importHarnessSetup
      summary: importHarnessSetup
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportHarnessSetupRequest"
      responses:
        "201":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarnessSetup"
        default:
          $ref: "#/components/responses/DefaultError"
  /harness-setups/{setupId}:
    patch:
      operationId: mutateHarnessSetup
      summary: mutateHarnessSetup
      parameters:
        - name: setupId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MutateHarnessSetupRequest"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarnessSetup"
        default:
          $ref: "#/components/responses/DefaultError"
  /harness-setups/{setupId}/contents:
    get:
      operationId: getHarnessSetupContents
      summary: Read saved configuration for editing
      parameters:
        - name: setupId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current setup content and version; never cached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportHarnessSetupRequest'
        default:
          $ref: '#/components/responses/DefaultError'
  /profile:
    get:
      operationId: getProfile
      summary: Read your workstation profile
      description: >-
        The caller's own workstation profile (ADR 0049): the git commit identity,
        a default provider connection per harness, and the current default setup
        for each harness. A user who never saved one gets resource version 0.
        No route reads another user's profile.
      responses:
        "200":
          description: The caller's profile
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Profile"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        default:
          $ref: "#/components/responses/DefaultError"
    put:
      operationId: updateProfile
      summary: Replace your git identity and default connections
      description: >-
        A default connection is a suggestion, never a grant. The gateway checks
        only Project grants, and this call changes none.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateProfileRequest"}
      responses:
        "200":
          description: The updated profile
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Profile"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default:
          $ref: "#/components/responses/DefaultError"
  /profile/imports:
    post:
      operationId: importProfile
      summary: Save one reviewed workstation import
      description: >-
        Saves, in one transaction, a new default revision for every harness whose
        bundle changed, each with its sealed import report, and the git identity
        when given. A failure saves nothing. Bundles are validated as for a
        single harness import.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ImportProfileRequest"}
      responses:
        "201":
          description: The import was saved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProfileImportResult"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default:
          $ref: "#/components/responses/DefaultError"
  /harness-setups/{setupId}/revisions:
    get:
      operationId: listHarnessSetupRevisions
      summary: listHarnessSetupRevisions
      parameters:
        - name: setupId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarnessSetupRevisionPage"
        default:
          $ref: "#/components/responses/DefaultError"
  /healthz:
    get:
      operationId: getHealth
      summary: Report process health
      security: []
      tags: [probes]
      responses:
        "200":
          description: Process is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
  /readyz:
    get:
      operationId: getReadiness
      summary: Report service readiness
      security: []
      tags: [probes]
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"
        "503":
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
  /capabilities:
    get:
      operationId: getCapabilities
      summary: Report provider-backed product capabilities
      description: Clients must treat false capabilities as unsupported and must not construct private provider URLs.
      tags: [capabilities]
      responses:
        "200":
          description: Effective capabilities for this daemon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
  /audit-records:
    get:
      operationId: listAuditRecords
      summary: List append-only audit records after a stable cursor
      description: >-
        Records name the acting principal, the action, the object id, and the
        result. They never hold secret values, prompts, transcript text,
        diffs, or file contents. A member reads their own records; an admin
        reads every record. Records cannot be edited or deleted through the
        API.
      tags: [audit]
      parameters:
        - $ref: "#/components/parameters/After"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        "200":
          description: Audit records, oldest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditRecordPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/DefaultError"
  /secrets:
    get:
      operationId: listSecrets
      summary: List named secret metadata
      tags: [secrets]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Secret metadata page; values are never returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
  /secrets/{secretName}:
    parameters:
      - name: secretName
        in: path
        required: true
        schema:
          type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_.-]{0,127}$"
    put:
      operationId: putSecret
      summary: Create or replace an encrypted named secret
      tags: [secrets]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutSecretRequest"
      responses:
        "200":
          description: Stored secret metadata; value is never returned
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Secret"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
    delete:
      operationId: deleteSecret
      summary: Crypto-shred a named secret by deleting its envelope
      tags: [secrets]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteSecretRequest"
      responses:
        "200":
          description: Deleted secret metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Secret"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
  /github/connection:
    get:
      operationId: getGitHubConnection
      summary: Read the signed-in user's GitHub connection
      description: >-
        Returns whether this user has connected GitHub, and whether the
        device flow can start. The token is never returned. Responses are
        not cached.
      tags: [github]
      responses:
        "200":
          description: Connection metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubConnection"
        default:
          $ref: "#/components/responses/DefaultError"
    delete:
      operationId: disconnectGitHub
      summary: Delete the signed-in user's GitHub connection
      tags: [github]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisconnectGitHubRequest"
      responses:
        "200":
          description: The connection is gone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubConnection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"
  /github/connection/check:
    post:
      operationId: checkGitHubConnection
      summary: Check whether the stored GitHub login still works
      description: >-
        Calls GitHub as the station. A rejected login is marked
        needs_reconnect. The token is never returned.
      tags: [github]
      responses:
        "200":
          description: Connection metadata after the check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubConnection"
        default:
          $ref: "#/components/responses/DefaultError"
  /github/connection/host:
    get:
      operationId: getHostGitHubLogin
      summary: See whether this computer's gh login can be reused
      description: >-
        Available only for a loopback request on a single-user Station.
        Does not read or return the token. Team mode and remote requests
        report state unavailable. Other states say whether gh was found,
        is signed in, or could not read its token, and which paths were
        searched. Command output is not included.
      tags: [github]
      responses:
        "200":
          description: Whether a host login was found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostGitHubLogin"
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: useHostGitHubLogin
      summary: Store this computer's gh login after confirmation
      description: >-
        Reads gh auth token only for this request, and only on a loopback
        single-user Station. The token is stored encrypted and is not
        returned.
      tags: [github]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UseHostGitHubRequest"
      responses:
        "200":
          description: Stored connection metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubConnection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        default:
          $ref: "#/components/responses/DefaultError"
  /github/connection/token:
    post:
      operationId: connectGitHubToken
      summary: Store a GitHub token the caller already holds
      description: >-
        The CLI uses this after the person confirms, including when it read
        gh on their own computer. The token is verified, stored encrypted,
        and not returned.
      tags: [github]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectGitHubTokenRequest"
      responses:
        "200":
          description: Stored connection metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubConnection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"
  /github/connection/device:
    post:
      operationId: beginGitHubDevice
      summary: Start the GitHub device authorization flow
      tags: [github]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeginGitHubDeviceRequest"
      responses:
        "200":
          description: The code to enter on GitHub. The device code is not included.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubDevice"
        "422":
          $ref: "#/components/responses/Unprocessable"
        default:
          $ref: "#/components/responses/DefaultError"
    get:
      operationId: pollGitHubDevice
      summary: Pick up a GitHub device authorization
      tags: [github]
      responses:
        "200":
          description: pending, connected, denied, or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubDeviceStatus"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
    delete:
      operationId: cancelGitHubDevice
      summary: Cancel the signed-in user's GitHub device authorization
      tags: [github]
      responses:
        "204":
          description: The in-memory device authorization is gone
        default:
          $ref: "#/components/responses/DefaultError"
  /github/repos:
    get:
      operationId: searchGitHubRepos
      summary: Search repositories the GitHub connection can access
      description: Includes private repositories the login can access. No token is returned.
      tags: [github]
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
      responses:
        "200":
          description: Matching repositories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubRepoPage"
        "422":
          $ref: "#/components/responses/Unprocessable"
        default:
          $ref: "#/components/responses/DefaultError"
  /projects:
    post:
      operationId: createProject
      summary: Create a project
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: >
            The Project's requiredIsolation exceeds the isolation class the
            daemon's provider verified (ADR 0050). The Project is refused
            before anything is created; no weaker Project can exist to accept
            Capsules the installation cannot isolate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
    get:
      operationId: listProjects
      summary: List projects
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Project page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
  /projects/{projectId}:
    get:
      operationId: getProject
      summary: Get a project
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
    patch:
      operationId: patchProject
      summary: Replace the Project harness-image allowlist
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchProjectRequest"
      responses:
        "200":
          description: Project updated
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
  /projects/{projectId}/delete:
    post:
      operationId: deleteProject
      summary: Delete a Project and everything it owns
      description: >
        Deletes the Project's Capsules through the same path as deleteCapsule,
        so the provider removes owned containers and volumes. Then deletes its
        threads, transcripts, artifacts, project environment, and
        project-scoped named secrets. Named-secret ciphertext, nonce, and
        envelope metadata are destroyed when no other live Project still names
        that secret. Transcripts and Moment artifacts are deleted with the
        Project and are not retained. If an owned container cannot be removed,
        the Project stays in state failed with the reason and a later delete
        resumes from that point. Repeating a delete is idempotent.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/LifecycleMutation"
      responses:
        "202":
          description: Project deletion accepted. The body is the Project in state deleting, failed, or deleted.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
  /projects/{projectId}/threads:
    post:
      operationId: createProjectThread
      summary: Provision a fresh Capsule and start its first structured Thread
      description: >
        Persists a durable encrypted session intent before asynchronously
        provisioning a new Capsule. Idempotent replay returns the same intent
        and resource IDs. A harness pack whose installation catalog entry
        lacks the `structured` interaction mode is rejected with 422
        `unsupported` before anything is provisioned. Without a prompt the
        harness starts idle and reports its models, so the first turn can use
        a model chosen in the Thread.
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectThreadRequest" }
      responses:
        "202":
          description: Project Thread session accepted
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectThreadIntent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/DefaultError" }
  /project-thread-intents/{intentId}:
    get:
      operationId: getProjectThreadIntent
      summary: Get deterministic Project Thread provisioning status
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/ProjectThreadIntentId"
      responses:
        "200":
          description: Project Thread intent
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectThreadIntent" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/DefaultError" }
  /board:
    get:
      operationId: getBoard
      summary: List every Capsule's content-free status across Projects
      description: >
        One row per Capsule, grouped by status. Subagent Capsules fold under
        their lead's child rollup; with the default expand=attention a subagent
        that needs the operator also gets its own surfaced row. Built from
        Capsule, Thread, Run, Delivery and link summaries plus the in-memory
        Thread attention; never transcript text and never Git status.
      tags: [threads]
      parameters:
        - name: projectId
          in: query
          required: false
          schema: { type: string }
        - name: expand
          in: query
          required: false
          description: >
            attention (default) lists main Capsules and subagents that need the
            operator; all lists every subagent; none lists main Capsules only. A
            subagent whose lead is not listed always gets its own row.
          schema:
            type: string
            enum: [attention, all, none]
      responses:
        "200":
          description: Board rows, needs-you first and oldest first within it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/DefaultError" }
  /threads/{threadId}/links:
    get:
      operationId: listThreadLinks
      summary: List the subagent Threads a lead Thread spawned
      description: Content-free. Report text stays in the child transcript.
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/ThreadId"
      responses:
        "200":
          description: Thread links in creation order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreadLinkPage" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/DefaultError" }
  /thread-links/{linkId}:
    get:
      operationId: getThreadLink
      summary: Get one lead-to-subagent Thread link
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/LinkId"
      responses:
        "200":
          description: Thread link
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreadLink" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/DefaultError" }
  /thread-links/{linkId}/remove:
    post:
      operationId: removeSubagent
      summary: Stop one subagent and delete its Capsule
      description: >
        Operator-only. Closes this one link as cancelled so the lead hears the
        subagent was cancelled, ends the subagent's session, and deletes its
        Capsule once no Run is active there. The lead's Coordination Grant is
        unchanged, so the lead can keep spawning, and the deleted Capsule no
        longer counts toward its live Capsules. Encrypted Thread history is
        kept, as with any Capsule delete. Promoted subagents are refused; a
        stopped Capsule with a live session must be resumed first.
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/LinkId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/LifecycleMutation"
      responses:
        "202":
          description: Link closed; the Capsule is deleted or will be once its session ends
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreadLink" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/DefaultError" }
  /coordination-grants/{grantId}:
    get:
      operationId: getCoordinationGrant
      summary: Get a lead Thread's Coordination Grant
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/GrantId"
      responses:
        "200":
          description: Coordination Grant
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoordinationGrant" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/DefaultError" }
    patch:
      operationId: updateCoordinationGrant
      summary: Update a Coordination Grant's limits
      description: >
        Changes spawn approval, limits, harnesses, unattended limit, lapse
        action, or archiveAfter on an active grant, including a lapsed one.
        The operator may loosen or tighten limits. Switching spawnApproval to
        auto does not start spawns already waiting for approval. Every update
        counts as the operator being present: it resets lastOperatorAt and
        reopens a lapsed grant.
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/GrantId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCoordinationGrantRequest" }
      responses:
        "200":
          description: Updated grant
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoordinationGrant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/DefaultError" }
  /coordination-grants/{grantId}/revoke:
    post:
      operationId: revokeCoordinationGrant
      summary: Revoke a Coordination Grant
      description: >
        Ends the lead's authority to spawn, message, or cancel subagents. With
        cancelDescendants, open links close and their subagents are cancelled
        and paused; otherwise subagents keep running for the operator.
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/GrantId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevokeCoordinationGrantRequest" }
      responses:
        "200":
          description: Revoked grant
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoordinationGrant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/DefaultError" }
  /coordination-requests:
    get:
      operationId: listCoordinationRequests
      summary: List coordination requests
      description: >
        The operator queue for spawn approvals. Prompts are not included;
        they stay in the child Thread's encrypted intent.
      tags: [threads]
      parameters:
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/CoordinationRequestState"
          description: Defaults to pending_approval.
      responses:
        "200":
          description: Coordination requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoordinationRequestPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/DefaultError" }
  /coordination-requests/{requestId}/approve:
    post:
      operationId: approveCoordinationRequest
      summary: Approve a queued spawn
      description: >
        Starts a subagent the lead spawned under spawnApproval=operator.
        The child Capsule is not provisioned until this call. Denied or
        completed requests cannot be approved.
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecideCoordinationRequest" }
      responses:
        "200":
          description: Approved request
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoordinationRequest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/DefaultError" }
  /coordination-requests/{requestId}/deny:
    post:
      operationId: denyCoordinationRequest
      summary: Deny a queued spawn
      description: >
        Refuses a subagent the lead spawned under spawnApproval=operator.
        The child Capsule is not deleted and the spawn still counts toward the
        grant's rolling 24-hour spawn window.
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecideCoordinationRequest" }
      responses:
        "200":
          description: Denied request
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoordinationRequest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/DefaultError" }
  /projects/{projectId}/capsules:
    post:
      operationId: createCapsule
      summary: Request Capsule creation
      tags: [capsules]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCapsuleRequest"
      responses:
        "202":
          description: Capsule creation accepted
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capsule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
    get:
      operationId: listCapsules
      summary: List a project's Capsules
      tags: [capsules]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: role
          in: query
          required: false
          description: Only main Capsules or only subagent Capsules.
          schema: { $ref: "#/components/schemas/CapsuleRole" }
      responses:
        "200":
          description: Capsule page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsulePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
  /capsules/{capsuleId}:
    get:
      operationId: getCapsule
      summary: Get a Capsule
      tags: [capsules]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
      responses:
        "200":
          description: Capsule
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capsule"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
  /capsules/{capsuleId}/name:
    post:
      operationId: renameCapsule
      summary: Rename a Capsule
      description: >
        Saves the name shown for this Capsule. The name is plaintext metadata.
        It does not change the Thread transcript.
      tags: [capsules]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameCapsuleRequest"
      responses:
        "200":
          description: Renamed Capsule
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capsule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        default:
          $ref: "#/components/responses/DefaultError"
  /capsules/{capsuleId}/harness-profiles:
    get:
      operationId: listHarnessProfiles
      summary: Discover effective native and structured harness profiles
      description: Provider-independent discovery. A false structured value identifies PTY/native fallback; clients never inspect provider internals.
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
      responses:
        "200":
          description: Effective Capsule-local harness profiles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HarnessProfilePage" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
  /capsules/{capsuleId}/profile-diagnostic:
    get:
      operationId: getCapsuleProfileDiagnostic
      summary: Explain how this Capsule differs from your profile
      description: >-
        Computed from control-plane records only: the Capsule's pins, the saved
        revisions and their import reports, the Project's connection grants, and
        the profile. It never asks the Capsule and carries no file contents or
        credential values. It never claims the Capsule matches the laptop.
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
      responses:
        "200":
          description: The diagnostic; never cached
          headers:
            Cache-Control:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProfileDiagnostic"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/DefaultError"}
  /capsules/{capsuleId}/profile-update:
    post:
      operationId: updateCapsuleProfile
      summary: Update this Capsule to your current profile
      description: >-
        Re-pins the Capsule's harness setups and git identity to what a new
        Capsule in its Project would pin. Refused with 409 while a Run or Thread
        session is active. The next session start applies the new pin.
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The diagnostic after the update; never cached
          headers:
            Cache-Control:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProfileDiagnostic"}
        "409": {$ref: "#/components/responses/Conflict"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/DefaultError"}
  /capsules/{capsuleId}/threads:
    post:
      operationId: createThread
      summary: Create an encrypted structured Thread, optionally with an atomic first message and session start
      description: The Thread, encrypted first message, Run intent, and idempotency resource references are committed before runtime side effects.
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateThreadRequest" }
      responses:
        "201":
          description: Thread created; session status is represented by currentRun when start was requested
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreadMutationResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "423": { $ref: "#/components/responses/Locked" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/DefaultError" }
    get:
      operationId: listThreads
      summary: List retained Thread histories for a Capsule
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Thread history page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreadPage" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/DefaultError" }
  /threads/{threadId}:
    get:
      operationId: getThread
      summary: Get Thread lifecycle and current session status
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/ThreadId"
      responses:
        "200":
          description: Thread metadata; transcript content is not included
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Thread" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/DefaultError" }
  /threads/{threadId}/archive:
    post:
      operationId: archiveThread
      summary: Archive a Thread history
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/ThreadId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody: { $ref: "#/components/requestBodies/LifecycleMutation" }
      responses:
        "200": { $ref: "#/components/responses/ThreadMutation" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
  /threads/{threadId}/pin:
    post:
      operationId: pinThread
      summary: Pin a Thread above its Project's other Threads
      description: >-
        Pins a live (active or paused) Thread of a main Capsule, lead or plain,
        so the sidebar lists it above the Project's other Threads, by name
        (ADR 0059). Any number of Threads may be pinned. A pin is presentation
        only: it grants nothing, no authorization check reads it, and only the
        Thread's owner can set it. Archiving or crypto-shredding the Thread
        clears it. Pinning a pinned Thread changes nothing. A subagent Thread
        cannot be pinned until it is promoted.
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/ThreadId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody: { $ref: "#/components/requestBodies/LifecycleMutation" }
      responses:
        "200": { $ref: "#/components/responses/ThreadMutation" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
  /threads/{threadId}/unpin:
    post:
      operationId: unpinThread
      summary: Unpin a Thread
      description: Clears a Thread's pin. Unpinning a Thread that is not pinned changes nothing.
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/ThreadId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody: { $ref: "#/components/requestBodies/LifecycleMutation" }
      responses:
        "200": { $ref: "#/components/responses/ThreadMutation" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/DefaultError" }
  /threads/{threadId}/coordination-grant:
    post:
      operationId: makeThreadLead
      summary: Make an existing plain Thread a lead
      description: >-
        Creates a Coordination Grant for an active Thread of a main Capsule
        that has no grant, so a conversation that built up useful context can
        start subagents (ADR 0059). It takes the same policy as creating a
        lead Thread and gives the same authority. Only the operator can call
        it: the break-glass admin, a Capsule, and the system see the Thread as
        not found, and no coordination request reaches it. It refuses
        subagents, promoted subagents still linked to their lead, harnesses
        the Project does not allow as structured, and Threads or Capsules that
        already hold a grant, including a revoked or lapsed one; a revoked
        grant is not replaced. Creating the grant counts as the operator being
        present. A harness learns its role when its session starts, so when
        the Thread is idle, waiting on nothing, and its harness reported
        resume state, the daemon stops and resumes the session as a lead now
        (restarted is true). Otherwise the next prompt, or the next resume,
        restarts it first. A running turn is never interrupted.
      tags: [threads]
      parameters:
        - $ref: "#/components/parameters/ThreadId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MakeThreadLeadRequest" }
      responses:
        "201":
          description: Grant created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MakeThreadLeadResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/DefaultError" }
  /projects/{projectId}/notes:
    get:
      operationId: listProjectNotes
      summary: List project notes
      description: >-
        Lists notes by name with size, revision, who wrote the head revision
        and whether it came from agent text (ADR 0060). Content-free. Deleted
        notes stay listed with live false until purged.
      tags: [notes]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Notes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteList" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/DefaultError" }
  /projects/{projectId}/notes/shred:
    post:
      operationId: shredProjectNotes
      summary: Crypto-shred project notes
      description: >-
        Clears the notes data key. Every revision and proposal becomes unreadable,
        the live set is empty, and a new key is made with the next note.
        Content-free provenance rows stay. Irreversible.
      tags: [notes]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": { description: Shredded }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/DefaultError" }
  /projects/{projectId}/notes/{noteName}:
    get:
      operationId: getProjectNote
      summary: Read a project note
      description: >-
        Returns the head revision, or the named retained revision, with its
        content. Responses carry Cache-Control no-store. A deleted note's head
        is not found; read a revision from its history instead.
      tags: [notes]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/NoteName"
        - name: revision
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: Note
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteContent" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/DefaultError" }
    put:
      operationId: putProjectNote
      summary: Write a project note
      description: >-
        Replaces the whole note as an operator revision. expectedRevision is
        the head the editor opened, 0 to create; a different head is 409.
        Writes past a size or count limit are refused, never cut.
      tags: [notes]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/NoteName"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WriteNoteRequest" }
      responses:
        "200":
          description: Written
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/DefaultError" }
  /projects/{projectId}/notes/{noteName}/delete:
    post:
      operationId: deleteProjectNote
      summary: Delete a project note
      description: >-
        Creates a delete revision; the note stops being delivered at the next
        session start. withHistory also drops every revision's
        content and closes its pending proposals. That is a row update, not media erasure.
      tags: [notes]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/NoteName"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteNoteRequest" }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteSummary" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
  /projects/{projectId}/notes/{noteName}/restore:
    post:
      operationId: restoreProjectNote
      summary: Restore a retained revision
      description: Creates a new revision with the content of a retained older one.
      tags: [notes]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/NoteName"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestoreNoteRequest" }
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
  /projects/{projectId}/notes/{noteName}/revisions:
    get:
      operationId: listProjectNoteRevisions
      summary: List a note's revisions
      description: Content-free provenance of every revision, newest first. retained says the content is still kept.
      tags: [notes]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/NoteName"
      responses:
        "200":
          description: History
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteHistory" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/DefaultError" }
  /coordination-grants/{grantId}/notes:
    get:
      operationId: listWorkingNotes
      summary: List working notes
      description: >-
        Lists notes by name with size, revision, who wrote the head revision
