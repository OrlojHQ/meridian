          application/json:
            schema:
              $ref: "#/components/schemas/StartRunRequest"
      responses:
        "202":
          description: Run accepted
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        default:
          $ref: "#/components/responses/DefaultError"
    get:
      operationId: listRuns
      summary: List a Capsule's Runs
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Run page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
  /runs/{runId}:
    get:
      operationId: getRun
      summary: Get a Run
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
  /runs/{runId}/cancel:
    post:
      operationId: cancelRun
      summary: Request Run cancellation
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/LifecycleMutation"
      responses:
        "202":
          description: Cancellation accepted
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        default:
          $ref: "#/components/responses/DefaultError"
  /runs/{runId}/events:
    get:
      operationId: listRunEvents
      summary: Replay ordered, content-free Run events after a stable cursor
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/After"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: Ordered Run event page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunEventPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
  /runs/{runId}/attach-ticket:
    post:
      operationId: createRunAttachTicket
      summary: Mint a short-lived, scoped, in-memory PTY attach ticket
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: after
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
      responses:
        "201":
          description: Attach ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachTicket"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
  /runs/{runId}/events/stream:
    get:
      operationId: streamRunEvents
      summary: Follow ordered Run events using Server-Sent Events
      description: Reconnect with Last-Event-ID or the after cursor. Event IDs are stable durable Run event sequences.
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/After"
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Server-Sent Event stream
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
  /runs/{runId}/attach:
    get:
      operationId: attachRunWebSocket
      summary: Upgrade to the reconnectable PTY WebSocket
      description: Binary client frames are PTY input. JSON text frames carry resize controls. Server text frames carry ordered output events with cursors.
      security: []
      tags: [runs]
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: ticket
          in: query
          required: true
          schema:
            type: string
            minLength: 32
      responses:
        "101":
          description: WebSocket protocol switch
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/DefaultError"
  /capsules/{capsuleId}/previews:
    get:
      operationId: listCapsulePreviewPorts
      summary: Discover bounded listening HTTP ports owned by a Capsule
      description: Available only when the effective preview capability is true.
      tags: [previews]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
      responses:
        "200":
          description: Discovered Capsule-local preview ports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewPortPage"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        default:
          $ref: "#/components/responses/DefaultError"
  /capsules/{capsuleId}/previews/{port}/tickets:
    post:
      operationId: createCapsulePreviewTicket
      summary: Mint a short-lived Capsule and port-scoped preview URL
      description: URLs are reusable until expiry and are revoked when the Capsule is deleted or sealed.
      tags: [previews]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
        - $ref: "#/components/parameters/PreviewPort"
      responses:
        "201":
          description: Short-lived loopback preview URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewTicket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/DefaultError"
  /capsules/{capsuleId}/git/status:
    get:
      operationId: getCapsuleGitStatus
      summary: Get bounded porcelain Git status
      tags: [capsules]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
      responses:
        "200":
          description: Git status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        default:
          $ref: "#/components/responses/DefaultError"
  /capsules/{capsuleId}/git/diff:
    get:
      operationId: getCapsuleGitDiff
      summary: Get a bounded unified working-tree diff
      tags: [capsules]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
      responses:
        "200":
          description: Git diff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        default:
          $ref: "#/components/responses/DefaultError"
  /capsules/{capsuleId}/files:
    get:
      operationId: listCapsuleFiles
      summary: List a bounded Capsule workspace directory
      description: Available only for a Ready Capsule. Private Git metadata and the supervisor marker are never exposed.
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
        - name: path
          in: query
          schema: { type: string, maxLength: 4096 }
        - name: after
          in: query
          schema: { type: string, maxLength: 255 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 512, default: 128 }
      responses:
        "200":
          description: Bounded lexicographically ordered directory page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceFilePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
  /capsules/{capsuleId}/files/content:
    get:
      operationId: readCapsuleFile
      summary: Read one bounded regular workspace file
      description: Content is base64 encoded in JSON and is binary-safe. Symlinks and files over the supervisor bound are rejected.
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
        - name: path
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 4096 }
      responses:
        "200":
          description: Bounded file content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceFile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          description: File exceeds the browser read bound
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
  /capsules/{capsuleId}/workspace:
    get:
      operationId: exportCapsuleWorkspace
      summary: Stream a bounded portable Capsule workspace archive
      description: Uses installation authentication in the Authorization header. The archive is never addressed by a token in the URL and is serialized against Moment and Delivery maintenance.
      tags: [files]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
      responses:
        "200":
          description: Portable Moment-contract tar stream
          headers:
            Meridian-Repository-URL:
              description: Base64url-encoded Project repository URL used for fail-closed local worktree verification.
              schema: { type: string }
            Meridian-Git-Branch:
              schema: { type: string }
            Meridian-Git-Head:
              schema: { type: string }
            Meridian-Git-Dirty:
              schema: { type: string }
          content:
            application/x-tar:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
  /capsules/{capsuleId}/deliveries/inspection:
    get:
      operationId: inspectCapsuleDelivery
      summary: Inspect exact Git objects for Delivery approval
      tags: [deliveries]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
      responses:
        "200":
          description: Exact current Git state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryInspection" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
  /capsules/{capsuleId}/deliveries:
    post:
      operationId: createCapsuleDelivery
      summary: Commit and push an explicitly approved reviewed Git state
      description: Approval binds the exact Capsule resource version, HEAD, and worktree tree. Only one exact non-protected refs/heads destination is pushed.
      tags: [deliveries]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDeliveryRequest" }
      responses:
        "201":
          description: Durable Delivery result
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delivery" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
    get:
      operationId: listCapsuleDeliveries
      summary: List durable Delivery resources
      tags: [deliveries]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Delivery page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryPage" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/DefaultError" }
  /deliveries/{deliveryId}:
    get:
      operationId: getDelivery
      summary: Get a durable Delivery
      tags: [deliveries]
      parameters:
        - $ref: "#/components/parameters/DeliveryId"
      responses:
        "200":
          description: Delivery resource
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delivery" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/DefaultError" }
  /deliveries/{deliveryId}/approve:
    post:
      operationId: approveDelivery
      summary: Approve a proposed Delivery and bind the reviewed Git objects
      description: >-
        Operator-only. Turns a proposed Delivery into the existing queued
        execute path. Approval binds the exact Capsule resource version, HEAD,
        and worktree tree. Capsules cannot call this.
      tags: [deliveries]
      parameters:
        - $ref: "#/components/parameters/DeliveryId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApproveDeliveryRequest" }
      responses:
        "200":
          description: Approved Delivery, possibly still executing
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delivery" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
  /deliveries/{deliveryId}/reject:
    post:
      operationId: rejectDelivery
      summary: Reject a proposed Delivery
      description: Operator-only. Capsules cannot call this. A rejected Delivery is terminal and is never executed.
      tags: [deliveries]
      parameters:
        - $ref: "#/components/parameters/DeliveryId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RejectDeliveryRequest" }
      responses:
        "200":
          description: Rejected Delivery
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delivery" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
  /capsules/{capsuleId}/moments:
    post:
      operationId: captureMoment
      summary: Capture an immutable filesystem Moment
      tags: [moments]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureMomentRequest"
      responses:
        "201":
          description: Moment captured and published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Moment"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
    get:
      operationId: listMoments
      summary: List a Capsule Timeline's Moments
      tags: [moments]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Moment page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MomentPage"
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/DefaultError" }
  /moments/{momentId}:
    get:
      operationId: getMoment
      summary: Get an immutable Moment
      tags: [moments]
      parameters:
        - $ref: "#/components/parameters/MomentId"
      responses:
        "200":
          description: Moment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Moment"
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/DefaultError" }
  /timelines/{timelineId}:
    get:
      operationId: getTimeline
      summary: Get a Timeline and its ancestry
      tags: [timelines]
      parameters:
        - $ref: "#/components/parameters/TimelineId"
      responses:
        "200":
          description: Timeline and ancestry from current to root
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineView"
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/DefaultError" }
  /moments/{momentId}/shards:
    post:
      operationId: createShard
      summary: Create a new Capsule and Timeline from a Moment
      tags: [timelines]
      parameters:
        - $ref: "#/components/parameters/MomentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDescendantRequest"
      responses:
        "202":
          description: Descendant restore accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DescendantResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
  /capsules/{capsuleId}/rewind:
    post:
      operationId: rewindCapsule
      summary: Create a non-destructive descendant from an earlier Moment
      tags: [timelines]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RewindRequest"
      responses:
        "202":
          description: Rewind descendant restore accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DescendantResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
  /capsules/{capsuleId}/seal:
    post:
      operationId: sealCapsule
      summary: Capture a final Moment and permanently seal a Capsule
      description: Active Runs and Thread sessions block capture/seal. Sealing retains encrypted Thread history and does not crypto-shred transcript keys.
      tags: [moments]
      parameters:
        - $ref: "#/components/parameters/CapsuleId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/LifecycleMutation"
      responses:
        "201":
          description: Capsule sealed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SealResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/DefaultError" }
  /auth/mode:
    get:
      operationId: getAuthenticationMode
      summary: Report how this installation signs people in
      description: >-
        Single-user mode accepts the installation token and the loopback
        browser session. Team mode (ADR 0046) signs members in through the
        configured OIDC issuer; the installation token is then break-glass
        administration only.
      security: []
      tags: [authentication]
      responses:
        "200":
          description: Authentication mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationMode"
        default:
          $ref: "#/components/responses/DefaultError"
  /auth/oidc/start:
    get:
      operationId: startOidcSignIn
      summary: Redirect the browser to the OIDC issuer to sign in
      description: >-
        Starts an authorization code sign-in with PKCE. State, nonce, and the
        PKCE verifier stay in daemon memory and are single-use. Before the
        installation is claimed, this sign-in can only claim it.
      security: []
      tags: [authentication]
      responses:
        "302":
          description: Redirect to the OIDC issuer
          headers:
            Location:
              schema:
                type: string
        default:
          $ref: "#/components/responses/DefaultError"
  /auth/oidc/callback:
    get:
      operationId: completeOidcSignIn
      summary: OIDC redirect target; completes a sign-in
      description: >-
        Authorized by the single-use state. In team mode it sets an HttpOnly
        SameSite=Strict session cookie. Before the claim it sets a short-lived
        claim cookie instead. It answers with a redirect to the web UI, or an
        HTML page that names no account.
      security: []
      tags: [authentication]
      parameters:
        - name: state
          in: query
          schema:
            type: string
        - name: code
          in: query
          schema:
            type: string
      responses:
        "303":
          description: Signed in; redirect to the web UI
        "400":
          description: The sign-in failed or is not allowed
          content:
            text/html:
              schema:
                type: string
        default:
          $ref: "#/components/responses/DefaultError"
  /auth/claim:
    post:
      operationId: claimInstallation
      summary: Claim the installation for the signed-in OIDC identity and turn on team mode
      description: >-
        Needs both the installation token in the Authorization header and the
        claim cookie from an OIDC sign-in in the same browser. Binds that
        identity to the bootstrap owner, turns on team mode, and signs the
        browser in. It can happen once.
      tags: [authentication]
      responses:
        "204":
          description: Installation claimed; the browser is signed in
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
  /auth/me:
    get:
      operationId: getCurrentMember
      summary: Describe the signed-in member
      tags: [authentication]
      responses:
        "200":
          description: The signed-in member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/DefaultError"
  /auth/sign-out:
    post:
      operationId: signOut
      summary: End the current browser session
      tags: [authentication]
      responses:
        "204":
          description: Signed out
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/DefaultError"
  /auth/sessions:
    get:
      operationId: listSessions
      summary: List the signed-in member's browser sessions
      tags: [authentication]
      responses:
        "200":
          description: Sessions, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/DefaultError"
  /auth/sessions/{sessionId}/revoke:
    post:
      operationId: revokeSession
      summary: Revoke one of the signed-in member's sessions
      tags: [authentication]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        "204":
          description: Session revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
  /auth/tokens:
    get:
      operationId: listPersonalAccessTokens
      summary: List the signed-in member's personal access tokens
      description: Token values are never returned after minting.
      tags: [authentication]
      responses:
        "200":
          description: Tokens, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalAccessTokenPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/DefaultError"
    post:
      operationId: mintPersonalAccessToken
      summary: Mint a personal access token for the CLI or TUI
      description: >-
        Team mode only, and only from a signed-in browser session; a token
        cannot mint another. The value carries the mrd_pat_ prefix, is shown
        once in this response, and is stored only as a digest. Tokens expire
        (90 days by default, at most 365) and can be read-only.
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MintPersonalAccessTokenRequest"
      responses:
        "201":
          description: Minted token; the value is shown only here
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MintedPersonalAccessToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/DefaultError"
  /auth/tokens/{tokenId}/revoke:
    post:
      operationId: revokePersonalAccessToken
      summary: Revoke one of the signed-in member's personal access tokens
      tags: [authentication]
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        "204":
          description: Token revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
  /users:
    get:
      operationId: listMembers
      summary: List the installation's members
      description: >-
        Team mode, for an admin or the break-glass installation token. Admins
        manage membership; they cannot read or change another member's
        objects.
      tags: [members]
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
  /users/{userId}/disable:
    post:
      operationId: disableMember
      summary: Disable a member, revoking their sessions, tokens, tickets, and gateway leases
      tags: [members]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        "204":
          description: Done
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"
  /users/{userId}/enable:
    post:
      operationId: enableMember
      summary: Re-enable a member; their old sessions and tokens stay revoked
      tags: [members]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        "204":
          description: Done
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"
  /users/{userId}/revoke-credentials:
    post:
      operationId: revokeMemberCredentials
      summary: Revoke every session and token of a member
      tags: [members]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        "204":
          description: Done
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"
  /users/{userId}/transfer:
    post:
      operationId: transferMemberObjects
      summary: Move a departed member's work to another member (break-glass only)
      description: >-
        The member must be disabled. Their Projects with everything under
        them, their secrets (re-wrapped for the new owner), and their harness
        setups move to the receiving member in one transaction. Provider
        connections do not move, since a personal login stays with its
        account holder; Project grants of them are dropped. Refused when the
        receiving member already has a secret of the same name.
      tags: [members]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [toUserId]
              properties:
                toUserId:
                  type: string
                  maxLength: 128
      responses:
        "204":
          description: Moved
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"
  /users/{userId}/delete-objects:
    post:
      operationId: deleteMemberObjects
      summary: Delete a departed member's work (break-glass only)
      description: >-
        The member must be disabled. Starts deletion of each of their
        Projects, crypto-shreds their secrets, revokes their provider
        connections, and deletes their harness setups. The member's row and
        audit records stay. Older backups still hold their ciphertext.
      tags: [members]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        "200":
          description: What was deleted or started
          content:
            application/json:
              schema:
                type: object
                required: [projects, secrets, connections, setups]
                properties:
                  projects:
                    type: integer
                  secrets:
                    type: integer
                  connections:
                    type: integer
                  setups:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"
  /users/{userId}/role:
    put:
      operationId: setMemberRole
      summary: Grant or remove the admin role
      tags: [members]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role:
                  type: string
                  enum: [member, admin]
      responses:
        "204":
          description: Role set
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/DefaultError"
  /auth/device:
    post:
      operationId: beginDeviceLogin
      summary: Start meridian login with the OAuth device authorization grant
      description: >-
        Team mode, when the OIDC issuer offers device sign-in. Returns a code
        for the member to enter at the issuer and a handle only this client
        knows. Without device sign-in, mint a personal access token in the
        web UI instead.
      security: []
      tags: [authentication]
      responses:
        "201":
          description: Device login started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceLogin"
        "422":
          $ref: "#/components/responses/Unprocessable"
        default:
          $ref: "#/components/responses/DefaultError"
  /auth/device/token:
    post:
      operationId: pollDeviceLogin
      summary: Collect the personal access token once the member approves
      description: >-
        Authorized by the handle from beginDeviceLogin, in the body so it
        never appears in a URL. Answers 202 until the member approves at the
        issuer, then returns a new personal access token, once.
      security: []
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [handle]
              properties:
                handle:
                  type: string
                  maxLength: 128
      responses:
        "200":
          description: Approved; the token is shown only here
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token:
                    type: string
        "202":
          description: Waiting for approval
          content:
            application/json:
              schema:
                type: object
                required: [status, intervalSeconds]
                properties:
                  status:
                    type: string
                    enum: [pending]
                  intervalSeconds:
                    type: integer
        "403":
          description: The member refused, or the code expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/DefaultError"
  /auth/browser-session:
    post:
      operationId: createBrowserSession
      summary: Exchange installation bearer authentication for an HttpOnly same-origin browser session
      description: The installation token is accepted only in the Authorization header and is never returned. The session cookie is scoped to this origin and daemon lifetime. Remote bootstrap requires HTTPS; plain HTTP is accepted only for verified loopback source and Host addresses.
      tags: [authentication]
      responses:
        "204":
          description: Browser session established
          headers:
            Set-Cookie:
              description: HttpOnly SameSite=Strict browser session cookie
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/DefaultError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Meridian installation token
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    CapsuleId:
      name: capsuleId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ThreadId:
      name: threadId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ProjectThreadIntentId:
      name: intentId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    LinkId:
      name: linkId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    GrantId:
      name: grantId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    MomentId:
      name: momentId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    TimelineId:
      name: timelineId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    DeliveryId:
      name: deliveryId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    PreviewPort:
      name: port
      in: path
      required: true
      schema:
        type: integer
        minimum: 1024
        maximum: 65535
    After:
      name: after
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  headers:
    ETag:
      description: Resource version as a quoted decimal value
      schema:
        type: string
  requestBodies:
    LifecycleMutation:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LifecycleMutationRequest"
  responses:
    Unauthorized:
      description: Missing or invalid installation authentication
      headers:
        WWW-Authenticate:
          description: Bearer authentication challenge
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ThreadMutation:
      description: Thread lifecycle mutation completed
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Thread" }
    ThreadSessionMutation:
      description: Structured session mutation accepted
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ThreadMutationResult" }
    CapsuleAccepted:
      description: Lifecycle intent accepted
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Capsule"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Resource version or idempotency conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Locked:
      description: Transcript installation key is missing or does not match the encrypted Thread
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Corrupt:
      description: Encrypted transcript or ordered event stream is corrupt
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unprocessable:
      description: Unsupported capability or illegal lifecycle transition
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TooManyRequests:
      description: Request rate limit exceeded
      headers:
        Retry-After:
          description: Seconds until retry
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    DefaultError:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    ProbeResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, not_ready]
    Capabilities:
      type: object
      required: [providerVersion, attach, run, git, pause, snapshot, clone, preview, browse, delivery, resourceMetrics]
      properties:
        providerVersion:
          type: string
        attach:
          type: boolean
        run:
          type: boolean
        structured:
          type: boolean
          description: True only when the provider and runtime expose meridian.adapter.v1 structured sessions.
        structuredProtocol:
          type: string
          enum: [meridian.adapter.v1]
        ptyFallback:
          type: boolean
          description: True when native Run and PTY attachment remain available independently of structured profiles.
        git:
          type: boolean
        pause:
          type: boolean
        snapshot:
          type: boolean
          description: False unless the provider and application share a safe Moment storage contract; CSI discovery alone is insufficient.
        clone:
          type: boolean
          description: False unless provider-native restore preserves Meridian lineage and failure semantics.
        preview:
          type: boolean
          description: False unless a provider exposes bounded port discovery and Capsule-scoped proxying.
        browse:
          type: boolean
          description: False unless a provider exposes the authenticated bounded workspace browser.
        delivery:
          type: boolean
          description: False unless a provider exposes authenticated exact-object commit and exact-ref push operations.
        resourceMetrics:
          type: boolean
          description: False when provider resource metrics are not exposed by the public API.
        coordination:
          $ref: "#/components/schemas/CoordinationCapability"
        harnessImages:
          type: array
          description: >
            Installation-known harness packs the operator may apply on a
            Project. Not a boolean capability. Spawn still uses only names
            stored on that Project.
          items:
            $ref: "#/components/schemas/HarnessImage"
    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        repositoryUrl:
          type: string
          maxLength: 4096
          description: >
            Clone URL, GitHub owner/repo, or GitHub SSH URL. Owner/repo and
            GitHub SSH are stored as HTTPS. An absolute local path is also
            accepted.
        setup:
          type: array
          maxItems: 128
          description: Setup executable followed by its arguments; never interpreted by a shell.
          items:
            type: string
            minLength: 1
            maxLength: 4096
        imageReference:
          type: string
          maxLength: 1024
          description: Default Capsule image reference; Docker resolves it to an immutable image identity.
        harnessImages:
          type: array
          maxItems: 16
          description: >
            Named harness-pack images allowlisted on this Project. Capsule
            creation and Project Thread spawn resolve a selected name to one
            of these images; clients never supply a free image reference at
            spawn time.
          items:
            $ref: "#/components/schemas/HarnessImage"
        gitSecretName:
          type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_.-]{0,127}$"
          description: Name of a git_https secret authorized only for HTTPS clone.
        harnessSecretNames:
          type: array
          maxItems: 64
          uniqueItems: true
          description: Explicit allowlist of harness_env secret names.
          items:
            type: string
            pattern: "^[A-Za-z_][A-Za-z0-9_.-]{0,127}$"
        gitPushSecretName:
          type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_.-]{0,127}$"
          description: Name of a git_push secret authorized only for one exact Delivery push.
        githubAPISecretName:
          type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_.-]{0,127}$"
          description: Name of a github_api secret used only by meridiand to open a pull request.
        commitAuthorName:
          type: string
          maxLength: 320
        commitAuthorEmail:
          type: string
          maxLength: 320
        defaultBaseBranch:
          type: string
          maxLength: 255
    PatchProjectRequest:
      type: object
      required: [expectedResourceVersion, harnessImages]
      properties:
        expectedResourceVersion:
          type: integer
          format: int64
          minimum: 1
        harnessImages:
          type: array
          maxItems: 16
          description: Replacement allowlist. Empty clears it and spawn uses the default image.
          items:
            $ref: "#/components/schemas/HarnessImage"
    HarnessImage:
      type: object
      required: [name, imageReference]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Harness pack/profile name selected by Capsule creation or Thread spawn.
        imageReference:
          type: string
          minLength: 1
          maxLength: 1024
          description: Capsule image that contains that harness; Docker resolves it to an immutable identity.
        interactionModes:
          type: array
          readOnly: true
          maxItems: 2
          uniqueItems: true
          description: >
            Session kinds the pack's trusted profile supports. Present only on
            installation catalog entries in capabilities, and only when the
            pack ships a trusted profile under its name. Absent means the
            repository's harness configuration decides, so nothing is known
            before a Capsule exists. A catalog pack without `structured`
            cannot start a Project Thread. Ignored in requests and never
            stored on a Project.
          items:
            type: string
            enum: [native, structured]
    PutSecretRequest:
      type: object
      required: [purpose]
      properties:
        purpose:
          type: string
          enum: [git_https, git_push, github_api, harness_env]
        value:
          type: string
          maxLength: 262144
          description: Token or harness environment value. Never returned.
        username:
          type: string
          maxLength: 4096
          description: Git username, encrypted with the password/token.
        password:
          type: string
          maxLength: 262144
          description: Git password or token. Never returned.
        expectedResourceVersion:
          type: integer
          format: int64
          minimum: 1
          description: Required when replacing an existing name; omit when creating.
    DeleteSecretRequest:
      type: object
      required: [expectedResourceVersion]
      properties:
        expectedResourceVersion:
          type: integer
          format: int64
          minimum: 1
    CreateCapsuleRequest:
      type: object
      required: [name]
      properties:
        setup:
          type: string
          description: Saved setup ID, clean to omit personal setups, or omitted to pin current defaults.
        name:
          type: string
          minLength: 1
          maxLength: 128
        harness:
          type: string
          minLength: 1
          maxLength: 128
          description: Optional Project-allowlisted native harness pack to freeze on the Capsule and launch when Ready.
    LifecycleMutationRequest:
      type: object
      required: [expectedResourceVersion]
      properties:
        expectedResourceVersion:
          type: integer
          format: int64
          minimum: 1
    PromoteCapsuleRequest:
      type: object
      required: [expectedResourceVersion]
      properties:
        expectedResourceVersion:
          type: integer
          format: int64
          minimum: 1
        detach:
          type: boolean
          default: false
          description: Close the link to the lead. The lead can no longer message or hear from this Capsule.
    CaptureMomentRequest:
      type: object
      required: [name, expectedResourceVersion]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        expectedResourceVersion:
          type: integer
          format: int64
          minimum: 1
    CreateDescendantRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
    RewindRequest:
      type: object
      required: [momentId, name]
      properties:
        momentId:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          maxLength: 128
    Project:
      type: object
      required: [id, name, createdAt, updatedAt, resourceVersion]
      properties:
        id:
          type: string
        name:
          type: string
        repositoryUrl:
          type: string
        setup:
          type: array
          items:
            type: string
        imageReference:
          type: string
        harnessImages:
          type: array
          items:
            $ref: "#/components/schemas/HarnessImage"
        gitSecretName:
          type: string
        harnessSecretNames:
          type: array
          items:
            type: string
        gitPushSecretName: { type: string }
        githubAPISecretName: { type: string }
        commitAuthorName: { type: string }
        commitAuthorEmail: { type: string }
        defaultBaseBranch: { type: string }
        state:
          $ref: "#/components/schemas/ProjectState"
        failure:
          type: string
          description: Why deletion stopped. Set when state is failed.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        resourceVersion:
          type: integer
          format: int64
          minimum: 1
    ProjectState:
      type: string
      description: >
        active is a live Project. deleting means cascade cleanup is in
        progress. failed means an owned container could not be removed.
        deleted means the Project and its transcripts, artifacts, environment,
        and exclusive named secrets are gone.
      enum: [active, deleting, failed, deleted]
    Secret:
      type: object
      required: [id, name, purpose, createdAt, updatedAt, resourceVersion]
      description: Secret metadata only; plaintext and ciphertext are never returned.
      properties:
        id: { type: string }
        name: { type: string }
        purpose:
          type: string
          enum: [git_https, git_push, github_api, harness_env]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        resourceVersion: { type: integer, format: int64, minimum: 1 }
    SecretPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Secret"
        nextCursor:
          type: string
    ProjectEnvironment:
      type: object
      required: [enabled, generation, setup, imageReference, resourceVersion]
      properties:
        enabled: {type: boolean}
        generation: {type: integer, format: int64}
        setup: {type: array, items: {type: string}}
        imageReference: {type: string}
        resourceVersion: {type: integer, format: int64}
        latest: {$ref: "#/components/schemas/PreparationProgress"}
    EnvironmentMutation:
      type: object
      required: [expectedResourceVersion]
      properties:
        enabled: {type: boolean}
        setup: {type: array, maxItems: 128, items: {type: string, maxLength: 4096}}
        rebuild: {type: boolean}
        expectedResourceVersion: {type: integer, format: int64, minimum: 1}
    PreparationProgress:
      type: object
      required: [stage, reused, updatedAt]
      properties:
        stage: {type: string, enum: [checkout, preparing, restoring, reclone, saving, ready]}
        reused: {type: boolean}
        detail: {type: string}
        sourceRevision: {type: string}
        updatedAt: {type: string, format: date-time}
    Capsule:
      type: object
      required:
        [id, projectId, timelineId, name, state, desiredState, restoreComplete, createdAt, updatedAt, resourceVersion]
      properties:
        preparation:
          $ref: "#/components/schemas/PreparationProgress"
        startup:
          $ref: "#/components/schemas/CapsuleStartup"
        failureCode:
          $ref: "#/components/schemas/CapsuleFailureCode"
        id:
          type: string
        projectId:
          type: string
        timelineId:
          type: string
        originMomentId:
          type: string
        name:
          type: string
        harness:
          type: string
          description: Immutable native launcher harness selected when the Capsule was created.
        imageReference:
          type: string
          description: >-
            Image this Capsule was created from. An official harness pack uses
            the release of the daemon that created it (ADR 0041), and the Capsule
            keeps the resolved image digest until it is deleted. Absent for
            Capsules created before Capsules recorded their image.
        pinnedHarnessSetups:
          description: >-
            Harness setup revisions pinned when this Capsule was created.
            Absent when the Capsule started without a saved setup.
            A later edit in Settings does not change this Capsule.
          type: array
          items:
            $ref: "#/components/schemas/PinnedHarnessSetup"
        state:
          $ref: "#/components/schemas/CapsuleState"
        desiredState:
          $ref: "#/components/schemas/CapsuleIntent"
        failure:
          type: string
          description: >-
            Public failure summary. Image-pull failures use a fixed sentence
            and failureCode; registry text is never copied here.
        restoreComplete:
          type: boolean
        maintenance:
          type: string
        role:
          $ref: "#/components/schemas/CapsuleRole"
        leadThreadId:
          type: string
          description: On sub-Capsules, the lead Thread that spawned this subagent.
        linkId:
          type: string
          description: On sub-Capsules and promoted Capsules that kept their link, the Thread link to the lead.
        promotedAt:
          type: string
          format: date-time
          description: When a subagent Capsule was promoted to a main Capsule.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        resourceVersion:
          type: integer
          format: int64
          minimum: 1
    CapsuleRole:
      type: string
      enum: [main, sub]
      description: main Capsules are operator-created; sub Capsules were spawned by a lead Thread.
    CapsuleStartup:
      type: object
      required: [phase, phases, updatedAt]
      description: >-
        Bounded startup progress. phases is the ordered set this provider
        reports for the current start. pull is present only while an image is
        pulling and contains byte counts, never registry text.
      properties:
        phase:
          $ref: "#/components/schemas/CapsuleStartupPhase"
        phases:
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: "#/components/schemas/CapsuleStartupPhase"
        pull:
          $ref: "#/components/schemas/ImagePullProgress"
        updatedAt:
          type: string
          format: date-time
    CapsuleStartupPhase:
      type: string
      enum: [pulling_image, creating_capsule, starting_harness, connecting]
    ImagePullProgress:
      type: object
      required: [currentBytes]
      properties:
        currentBytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 1099511627776
        totalBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 1099511627776
          description: Omitted when the registry did not report a total.
    CapsuleFailureCode:
      type: string
      description: Specific image-pull failure. Unset for failures that are not image pulls.
      enum: [registry_unreachable, auth_required, image_not_found]
    CapsuleState:
      type: string
      enum: [Creating, Preparing, Ready, Paused, Failed, Sealed, Deleting, Deleted]
    CapsuleIntent:
      type: string
      enum: [Ready, Paused, Deleted, Sealed]
    Moment:
      type: object
      required:
        [id, projectId, capsuleId, timelineId, name, archiveSha256, archiveSize,
         manifestSha256, imageDigest, projectSetupHash, createdAt, final]
      properties:
        id: { type: string }
        projectId: { type: string }
        capsuleId: { type: string }
        timelineId: { type: string }
        parentMomentId: { type: string }
        name: { type: string }
        archiveSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        archiveSize: { type: integer, format: int64, minimum: 0 }
        manifestSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        imageDigest: { type: string }
        projectSetupHash: { type: string }
        gitBranch: { type: string }
        gitHead: { type: string }
        gitDirtySummary: { type: string }
        createdAt: { type: string, format: date-time }
        final: { type: boolean }
    MomentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Moment" }
        nextCursor: { type: string }
    Timeline:
      type: object
      required: [id, projectId, capsuleId, reason, createdAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        capsuleId: { type: string }
        forkedFromMomentId: { type: string }
        reason:
          type: string
          enum: [root, shard, rewind]
        createdAt: { type: string, format: date-time }
    TimelineView:
      type: object
      required: [timeline, ancestry]
      properties:
        timeline: { $ref: "#/components/schemas/Timeline" }
        ancestry:
          type: array
          items: { $ref: "#/components/schemas/Timeline" }
    DescendantResult:
      type: object
      required: [capsule, timeline, reason]
      properties:
        capsule: { $ref: "#/components/schemas/Capsule" }
        timeline: { $ref: "#/components/schemas/Timeline" }
        reason:
          type: string
          enum: [shard, rewind]
    SealResult:
      type: object
      required: [capsule, moment]
      properties:
        capsule: { $ref: "#/components/schemas/Capsule" }
        moment: { $ref: "#/components/schemas/Moment" }
    StartRunRequest:
      type: object
      required: [harness, prompt]
      properties:
        harness:
          type: string
          minLength: 1
          maxLength: 128
        prompt:
          type: string
          maxLength: 262144
          description: Transient input; never persisted in Run records or normal events.
        columns:
          type: integer
          minimum: 1
          maximum: 65535
        rows:
          type: integer
          minimum: 1
          maximum: 65535
    Run:
      type: object
      required: [id, capsuleId, harness, state, createdAt, updatedAt, resourceVersion]
      properties:
        id:
          type: string
        capsuleId:
          type: string
        harness:
          type: string
        state:
          $ref: "#/components/schemas/RunState"
        exitStatus:
          type: integer
        failure:
          type: string
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        resourceVersion:
          type: integer
          format: int64
          minimum: 1
    RunState:
      type: string
      enum: [Queued, Starting, Running, Succeeded, Failed, Cancelling, Cancelled]
    RunPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Run"
        nextCursor:
          type: string
    RunEvent:
      type: object
      required: [sequence, type, timestamp]
      properties:
        sequence:
          type: integer
          format: int64
          minimum: 1
        type:
          type: string
        timestamp:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true
          description: Bounded structured metadata; never prompt text, PTY bytes, full diffs, setup output, or secrets.
    AuthenticationMode:
      type: object
      required: [mode, signIn, claimable]
      properties:
        mode:
          type: string
          enum: [single_user, team]
        signIn:
          type: boolean
          description: An OIDC issuer is configured.
        claimable:
          type: boolean
          description: The installation can still be claimed for team mode.
    Member:
      type: object
      required: [mode, id, role]
      properties:
        mode:
          type: string
          enum: [single_user, team]
        id:
          type: string
        role:
          type: string
          enum: [member, admin]
        displayName:
          type: string
          description: Display only; refreshed at sign-in.
        email:
          type: string
          description: Display only; refreshed at sign-in.
    Session:
      type: object
      required: [id, createdAt, lastUsedAt, expiresAt, revoked, current]
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revoked:
          type: boolean
        current:
          type: boolean
    SessionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Session"
    PersonalAccessToken:
      type: object
      required: [id, name, readOnly, createdAt, lastUsedAt, expiresAt, revoked]
      properties:
        id:
          type: string
        name:
          type: string
          maxLength: 64
        readOnly:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revoked:
          type: boolean
    PersonalAccessTokenPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PersonalAccessToken"
    MintPersonalAccessTokenRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        readOnly:
          type: boolean
          default: false
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 365
          default: 90
    MintedPersonalAccessToken:
      allOf:
        - $ref: "#/components/schemas/PersonalAccessToken"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: The token value, shown once. Pass it to the CLI with --token-file.
    MemberAdmin:
      type: object
      required: [id, role, disabled, createdAt]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [member, admin]
        displayName:
          type: string
        email:
          type: string
        disabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
    MemberPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MemberAdmin"
    DeviceLogin:
      type: object
      required: [handle, userCode, verificationUri, intervalSeconds, expiresAt]
      properties:
        handle:
          type: string
          description: Secret to this client; pass it to pollDeviceLogin.
        userCode:
          type: string
        verificationUri:
          type: string
        verificationUriComplete:
          type: string
        intervalSeconds:
          type: integer
        expiresAt:
          type: string
          format: date-time
    AuditRecord:
      type: object
      required: [sequence, recordedAt, principal, action, objectType, objectId, result]
      properties:
        sequence:
          type: integer
          format: int64
          minimum: 1
        recordedAt:
          type: string
          format: date-time
        principal:
          type: string
          enum: [user, break_glass, system, capsule]
        userId:
          type: string
          description: The acting user, or the owner a Capsule acted for. Absent for the system and break-glass principals.
        capsuleId:
          type: string
          description: The acting Capsule, for a Capsule principal.
        action:
          type: string
          maxLength: 64
          description: >-
            A fixed action name, such as secret.put, provider_connection.sign_in,
            delivery.approve, coordination_request.approve, coordination_grant.revoke,
            or access.cross_owner.
        objectType:
          type: string
          maxLength: 64
        objectId:
          type: string
          maxLength: 256
        result:
          type: string
          enum: [allowed, denied, failed]
    AuditRecordPage:
      type: object
      required: [items, nextCursor, more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditRecord"
        nextCursor:
          type: integer
          format: int64
          minimum: 0
        more:
          type: boolean
    RunEventPage:
      type: object
      required: [items, nextCursor, more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RunEvent"
        nextCursor:
          type: integer
          format: int64
          minimum: 0
        more:
          type: boolean
    GitResult:
      type: object
      required: [content, truncated]
      properties:
        content:
          type: string
          maxLength: 1048576
        truncated:
          type: boolean
    WorkspaceFileEntry:
      type: object
      required: [name, type, size, executable]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        type:
          type: string
          enum: [file, directory, symlink, other]
        size: { type: integer, format: int64, minimum: 0 }
        executable: { type: boolean }
    WorkspaceFilePage:
      type: object
      required: [items]
      properties:
        path: { type: string, maxLength: 4096 }
        items:
          type: array
          maxItems: 512
          items: { $ref: "#/components/schemas/WorkspaceFileEntry" }
        nextAfter: { type: string, maxLength: 255 }
    WorkspaceFile:
      type: object
      required: [path, content, size, executable]
      properties:
        path: { type: string, minLength: 1, maxLength: 4096 }
        content:
          type: string
          format: byte
          maxLength: 1398104
          description: Base64-encoded binary-safe content. Clients must not interpret it as HTML.
        size: { type: integer, format: int64, minimum: 0, maximum: 1048576 }
        executable: { type: boolean }
    DeliveryInspection:
      type: object
      required: [capsuleResourceVersion, head, dirty, tree]
      properties:
        capsuleResourceVersion: { type: integer, format: int64, minimum: 1 }
        head: { type: string, pattern: "^[0-9a-f]{40}([0-9a-f]{24})?$" }
        branch: { type: string, maxLength: 255 }
        dirty: { type: boolean }
        originUrl: { type: string, maxLength: 4096 }
        defaultBranch: { type: string, maxLength: 255 }
        tree: { type: string, pattern: "^[0-9a-f]{40}([0-9a-f]{24})?$" }
    CreateDeliveryRequest:
      type: object
      required:
        [action, approved, expectedResourceVersion, expectedHead, expectedTree, remoteBranch]
      properties:
        action:
          type: string
          enum: [push, open_pull_request]
        approved:
          type: boolean
          const: true
        expectedResourceVersion: { type: integer, format: int64, minimum: 1 }
        expectedHead: { type: string, pattern: "^[0-9a-f]{40}([0-9a-f]{24})?$" }
        expectedTree: { type: string, pattern: "^[0-9a-f]{40}([0-9a-f]{24})?$" }
        remoteBranch: { type: string, minLength: 1, maxLength: 255 }
        commitMessage: { type: string, maxLength: 16384 }
        pullRequestTitle: { type: string, maxLength: 512 }
        pullRequestBody: { type: string, maxLength: 65536 }
        baseBranch: { type: string, maxLength: 255 }
    BoardPage:
      type: object
      required: [items, truncated]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BoardItem" }
        truncated:
          type: boolean
          description: True when the installation has more Capsules than one board read covers (500).
    BoardItem:
      type: object
      description: Content-free status of one Capsule and its primary Thread.
      required: [capsule, status, since, surfaced]
      properties:
        capsule: { $ref: "#/components/schemas/Capsule" }
        thread: { $ref: "#/components/schemas/Thread" }
        currentRun: { $ref: "#/components/schemas/Run" }
        status:
          type: string
          enum: [needs_you, working, pr_open, ready_for_review, idle, paused, sealed]
        since: { type: string, format: date-time }
        needsYou:
          type: string
          enum: [permission, input, failed, spawn_approval, proposed_delivery]
          description: Why the row needs the operator; set only with status needs_you.
        latestDelivery: { $ref: "#/components/schemas/DeliverySummary" }
        link:
          $ref: "#/components/schemas/ThreadLink"
          description: The subagent's link to its lead, on sub-Capsules.
        childRollup: { $ref: "#/components/schemas/ChildRollup" }
        surfaced:
          type: boolean
          description: A subagent listed on its own because it needs the operator.
    ChildRollup:
      type: object
      description: >-
        A lead's subagents by state. Subagents whose Capsule the operator
        removed are not counted.
      required: [total, working, idle, done, needsYou, failed, archived]
      properties:
        total: { type: integer, minimum: 0 }
        working: { type: integer, minimum: 0 }
        idle: { type: integer, minimum: 0 }
        done: { type: integer, minimum: 0 }
        needsYou: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        archived:
          type: integer
          minimum: 0
          description: Auto-archived subagents. They are also counted as done.
    DeliverySummary:
      type: object
      required: [id, state, action, updatedAt]
      properties:
        id: { type: string }
        state: { $ref: "#/components/schemas/DeliveryState" }
        action:
          type: string
          enum: [push, open_pull_request]
        pullRequestNumber: { type: integer, format: int64, minimum: 1 }
        pullRequestUrl: { type: string, format: uri }
        updatedAt: { type: string, format: date-time }
    DeliveryState:
      type: string
      enum: [proposed, queued, committing, pushing, opening_pr, succeeded, failed, rejected]
    ApproveDeliveryRequest:
      type: object
      required: [expectedResourceVersion, expectedCapsuleVersion, expectedHead, expectedTree]
      properties:
        expectedResourceVersion: { type: integer, format: int64, minimum: 1 }
        expectedCapsuleVersion: { type: integer, format: int64, minimum: 1 }
        expectedHead: { type: string, pattern: "^[0-9a-f]{40}([0-9a-f]{24})?$" }
        expectedTree: { type: string, pattern: "^[0-9a-f]{40}([0-9a-f]{24})?$" }
        remoteBranch: { type: string, minLength: 1, maxLength: 255 }
        commitMessage: { type: string, maxLength: 16384 }
        pullRequestTitle: { type: string, maxLength: 512 }
        pullRequestBody: { type: string, maxLength: 65536 }
        baseBranch: { type: string, maxLength: 255 }
    RejectDeliveryRequest:
      type: object
      required: [expectedResourceVersion]
      properties:
        expectedResourceVersion: { type: integer, format: int64, minimum: 1 }
    Delivery:
      type: object
      required:
        [id, capsuleId, projectId, state, action, proposedBy, approved,
         remoteBranch, destinationRef, createdAt, updatedAt, resourceVersion]
      properties:
        id: { type: string }
        capsuleId: { type: string }
        projectId: { type: string }
        state: { $ref: "#/components/schemas/DeliveryState" }
        action:
          type: string
          enum: [push, open_pull_request]
        proposedBy:
          type: string
          enum: [agent, operator]
        approved: { type: boolean }
        approvedAt: { type: string, format: date-time }
        expectedResourceVersion: { type: integer, format: int64, minimum: 1 }
        expectedHead: { type: string }
        expectedTree: { type: string }
        remoteBranch: { type: string }
        destinationRef: { type: string }
        baseBranch: { type: string }
        commitMessage: { type: string }
        pullRequestTitle: { type: string }
        pullRequestBody: { type: string }
        resultCommitSha: { type: string }
        resultPullRequestUrl: { type: string, format: uri }
        resultPullRequestNumber: { type: integer, format: int64, minimum: 1 }
        failure: { type: string, maxLength: 512 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        resourceVersion: { type: integer, format: int64, minimum: 1 }
    DeliveryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Delivery" }
        nextCursor: { type: string }
    AttachTicket:
      type: object
      required: [ticket, expiresAt, webSocketPath]
      properties:
        ticket:
          type: string
        expiresAt:
          type: string
          format: date-time
        webSocketPath:
          type: string
    PreviewPort:
      type: object
      required: [port]
      properties:
        port:
          type: integer
          minimum: 1024
          maximum: 65535
    PreviewPortPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/PreviewPort"
    PreviewTicket:
      type: object
      required: [url, expiresAt, reusePolicy]
      properties:
        url:
          type: string
          format: uri
          description: Loopback-only URL containing the bearer token in its path.
        expiresAt:
          type: string
          format: date-time
        reusePolicy:
          type: string
          enum: [reusable_until_expiry]
    HarnessProfile:
      type: object
      required: [name, structured, pty]
      description: A name appears at most twice, once per interaction mode, when one harness offers both a native terminal and a structured session.
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        structured:
          type: boolean
        adapterKind:
          type: string
          enum: [acp, pi, claude, codex, mock, generic, external]
        protocol:
          type: string
          enum: [meridian.adapter.v1]
        pty:
          type: boolean
          description: Native PTY behavior for this profile; structured profiles are always false.
    HarnessProfilePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/HarnessProfile" }
    CreateProjectThreadRequest:
      type: object
      required: [harness]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Optional name for the fresh Capsule.
        harness: { type: string, minLength: 1, maxLength: 128 }
        prompt:
          type: string
          minLength: 1
          maxLength: 131072
          description: >
            First message, delivered once the session starts. Encrypted as a
            transcript envelope before SQLite persistence. Prefer stdin in
            shells. Omit it to start the harness idle, a lead (`coordination`)
            included.
        coordination:
          $ref: "#/components/schemas/CoordinationPolicy"
    CoordinationPolicy:
      type: object
      description: >
        Makes the new Thread a lead that may spawn subagent Threads in their own
        sub-Capsules. Omitted limits take their defaults. Subagents answer to the
        operator: the lead never approves permissions or answers input.
      properties:
        maxDepth: { type: integer, minimum: 1, maximum: 1, default: 1 }
        maxChildren: { type: integer, minimum: 1, maximum: 16, default: 4 }
        maxDescendants: { type: integer, minimum: 1, maximum: 32, default: 8 }
        maxLiveCapsules: { type: integer, minimum: 1, maximum: 16, default: 4 }
        maxMessagesPerLink: { type: integer, minimum: 1, maximum: 500, default: 50 }
        allowedHarnesses:
          type: array
          maxItems: 16
          description: Structured harnesses subagents may use; each must be on the Project allowlist. Defaults to the lead's harness.
          items: { type: string, minLength: 1, maxLength: 128 }
        deadlineSeconds: { type: integer, minimum: 300, maximum: 259200, default: 86400 }
        archiveAfterSeconds:
          type: integer
          minimum: 0
          maximum: 2592000
          default: 3600
          description: >
            How long a finished subagent stays idle before its session is ended
            and its Thread paused. Its Capsule is then deleted if its
            workspace holds nothing unsaved (the last report changed no files,
            or a Delivery of it succeeded); otherwise the Capsule is kept.
            0 disables auto-archive and this cleanup; otherwise at least 60.
            Transcripts are always kept.
        onDeadline:
          type: string
          enum: [cancel_and_pause, stop_new_work]
          default: cancel_and_pause
        spawnApproval:
          type: string
          enum: [auto, operator]
          default: auto
          description: >
            auto starts each accepted spawn. operator queues it until the
            operator approves or denies it. The grant itself is still the
            bound on how many may be requested.
    CoordinationGrantState:
      type: string
      enum: [active, revoked, expired]
    CoordinationGrant:
      type: object
      required:
        [id, projectId, rootThreadId, rootCapsuleId, state, spawnApproval, maxDepth,
         maxChildren, maxDescendants, maxLiveCapsules, maxMessagesPerLink,
         allowedHarnesses, deadlineAt, onDeadline, archiveAfterSeconds,
         descendantsCreated, createdAt, updatedAt, resourceVersion]
      properties:
        id: { type: string }
        projectId: { type: string }
        rootThreadId: { type: string }
        rootCapsuleId: { type: string }
        state: { $ref: "#/components/schemas/CoordinationGrantState" }
        spawnApproval: { type: string, enum: [auto, operator] }
        maxDepth: { type: integer, minimum: 1 }
        maxChildren: { type: integer, minimum: 1 }
        maxDescendants: { type: integer, minimum: 1 }
        maxLiveCapsules: { type: integer, minimum: 1 }
        maxMessagesPerLink: { type: integer, minimum: 1 }
        allowedHarnesses:
          type: array
          items: { type: string }
        deadlineAt: { type: string, format: date-time }
        onDeadline: { type: string, enum: [cancel_and_pause, stop_new_work] }
        archiveAfterSeconds: { type: integer, minimum: 0, maximum: 2592000 }
        descendantsCreated: { type: integer, minimum: 0 }
        revokedAt: { type: string, format: date-time }
        revokeReason: { type: string, enum: [operator, deadline, lead_ended] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        resourceVersion: { type: integer, format: int64, minimum: 1 }
    RevokeCoordinationGrantRequest:
      type: object
      required: [expectedResourceVersion]
      properties:
        expectedResourceVersion: { type: integer, format: int64, minimum: 1 }
        cancelDescendants:
          type: boolean
          default: true
    UpdateCoordinationGrantRequest:
      type: object
      required: [expectedResourceVersion]
      description: >
        Operator update to an active grant. Omitted fields stay unchanged.
        allowedHarnesses, when present, replaces the allowlist and must not
        be empty. deadlineSeconds is remaining time from now.
      properties:
        expectedResourceVersion: { type: integer, format: int64, minimum: 1 }
        spawnApproval: { type: string, enum: [auto, operator] }
        maxChildren: { type: integer, minimum: 1, maximum: 16 }
        maxDescendants: { type: integer, minimum: 1, maximum: 32 }
        maxLiveCapsules: { type: integer, minimum: 1, maximum: 16 }
        maxMessagesPerLink: { type: integer, minimum: 1, maximum: 500 }
        allowedHarnesses:
          type: array
          minItems: 1
          maxItems: 16
          items: { type: string, minLength: 1, maxLength: 128 }
        deadlineSeconds: { type: integer, minimum: 300, maximum: 259200 }
        onDeadline: { type: string, enum: [cancel_and_pause, stop_new_work] }
        archiveAfterSeconds: { type: integer, minimum: 0, maximum: 2592000 }
    CoordinationRequestState:
      type: string
      enum: [pending_approval, completed, rejected]
    CoordinationRequest:
      type: object
      description: >
        Durable idempotency record for one mutating coordination request, and
        the operator queue when spawnApproval is operator. Prompts are never
        included.
      required:
        [id, grantId, capsuleId, key, kind, linkId, state, createdAt, updatedAt,
         resourceVersion]
      properties:
        id: { type: string }
        grantId: { type: string }
        capsuleId: { type: string }
        key: { type: string }
        kind: { type: string, enum: [spawn, send, cancel] }
        linkId: { type: string }
        state: { $ref: "#/components/schemas/CoordinationRequestState" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        resourceVersion: { type: integer, format: int64, minimum: 1 }
    CoordinationRequestPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CoordinationRequest" }
    DecideCoordinationRequest:
      type: object
      required: [expectedResourceVersion]
      properties:
        expectedResourceVersion: { type: integer, format: int64, minimum: 1 }
    ThreadLinkState:
      type: string
      enum: [pending_approval, active, closed]
    ThreadLink:
      type: object
      description: >
        Content-free handle from a lead Thread to one subagent. Report text is
        re-derived from the subagent's encrypted transcript and is never stored
        on the link.
      required:
        [id, grantId, parentThreadId, parentCapsuleId, childThreadId, childCapsuleId,
         childIntentId, depth, name, harness, state, phase, reportSeq,
         reportDeliveredSeq, messagesForwarded, operatorMessages, createdAt, updatedAt,
         resourceVersion]
      properties:
        id: { type: string }
        grantId: { type: string }
        parentThreadId: { type: string }
        parentCapsuleId: { type: string }
        childThreadId: { type: string }
        childCapsuleId: { type: string }
        childIntentId: { type: string }
        depth: { type: integer, minimum: 1, maximum: 3 }
        name: { type: string, pattern: "^[a-z0-9-]{1,48}$" }
        harness: { type: string }
        state: { $ref: "#/components/schemas/ThreadLinkState" }
        closeReason: { type: string, enum: [cancelled, failed, ended, revoked, denied, detached] }
        phase:
          type: string
          enum: [provisioning, working, idle, awaiting_operator, ended, failed]
        model:
          type: string
          maxLength: 128
          description: >-
            The label of the model the subagent's live session last reported,
            derived in memory from its encrypted transcript and never stored.
            Absent when the session has ended or has not reported one.
        effort:
          type: string
          maxLength: 128
          description: >-
            The label of the reasoning effort the subagent's live session last
            reported, when it reports one and is not on the harness default.
        reportSeq: { type: integer, minimum: 0 }
        reportDeliveredSeq: { type: integer, minimum: 0 }
        lastReportStatus: { type: string, enum: [turn_ended, failed, done, blocked] }
        lastReportReason: { type: string, enum: [cancelled, capsule_failed, session_ended, revoked, denied] }
        lastReportAt: { type: string, format: date-time }
        messagesForwarded: { type: integer, minimum: 0 }
        operatorMessages:
          type: integer
          minimum: 0
          description: Operator messages sent straight to this subagent. They do not count against the lead's message limit.
        archivedAt:
          type: string
          format: date-time
          description: Set while the subagent is auto-archived; cleared when its Thread resumes.
        promotedAt:
          type: string
          format: date-time
          description: When the subagent was promoted to a main Capsule. Promoted subagents are never archived.
        capsuleRemoved:
          type: boolean
          description: True once the subagent's Capsule is deleted or being deleted. Its Thread history is kept.
        baseCommit:
          type: string
          description: Child workspace HEAD when the Capsule became Ready. Patch bytes are never stored.
        head:
          type: string
          description: Latest observed child HEAD. Content-free.
        filesChanged: { type: integer, minimum: 0 }
        insertions: { type: integer, minimum: 0 }
        deletions: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        resourceVersion: { type: integer, format: int64, minimum: 1 }
    ThreadLinkPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ThreadLink" }
    CoordinationCapability:
      type: object
      required: [supported, maxDepth, maxDescendants]
      properties:
        supported:
          type: boolean
          description: True when lead Threads may spawn subagent Threads through the Capsule-local coordination mailbox.
        maxDepth: { type: integer, minimum: 0 }
        maxDescendants: { type: integer, minimum: 0 }
    ThreadOrigin:
      type: object
      description: >
        Marks a user-role message Meridian wrote for coordination rather than
        the operator: from_lead on a subagent, from_subagents on a lead.
      required: [source, kind]
      properties:
        source: { type: string, enum: [coordination] }
        kind: { type: string, enum: [from_lead, from_subagents] }
        linkIds:
          type: array
          maxItems: 16
          items: { type: string }
    ProjectThreadIntentState:
      type: string
      enum: [provisioning, ready, failed]
    ProjectThreadIntent:
      type: object
      required:
        [id, projectId, capsuleId, capsuleName, threadId, runId, messageId,
         harness, state, createdAt, updatedAt, resourceVersion]
      properties:
        id: { type: string }
        projectId: { type: string }
        capsuleId: { type: string }
        capsuleName: { type: string }
        threadId: { type: string }
        runId: { type: string }
        messageId:
          type: string
          description: The first message's ID. No message has it when the request had no prompt.
        harness: { type: string }
        state: { $ref: "#/components/schemas/ProjectThreadIntentState" }
        failureCode: { type: string, maxLength: 64 }
        failureMessage:
          type: string
          maxLength: 256
          description: Bounded content-free lifecycle failure summary.
        thread: { $ref: "#/components/schemas/Thread" }
        currentRun: { $ref: "#/components/schemas/Run" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        resourceVersion: { type: integer, format: int64, minimum: 1 }
    CreateThreadRequest:
      type: object
      required: [harness]
      properties:
        harness: { type: string, minLength: 1, maxLength: 128 }
        firstMessage:
          type: string
          minLength: 1
          maxLength: 131072
          description: Encrypted before SQLite persistence. Prefer stdin in shells to avoid command-history disclosure.
        start:
          type: boolean
          default: false
          description: Requires firstMessage and atomically creates the initial Run intent before runtime side effects.
    DeleteThreadRequest:
      type: object
      required: [expectedResourceVersion, confirmation]
      properties:
        expectedResourceVersion: { type: integer, format: int64, minimum: 1 }
        confirmation:
          type: string
          enum: [crypto-shred]
    SendThreadMessageRequest:
      type: object
      required: [expectedResourceVersion, content]
      properties:
        expectedResourceVersion: { type: integer, format: int64, minimum: 1 }
        content:
          type: string
          minLength: 1
          maxLength: 131072
          description: Encrypted before SQLite persistence.
        delivery:
          type: string
          enum: [steer]
          description: >
            Inject into the running turn at the next tool boundary. The daemon
            sets the documented Pi and Codex user-message metadata; other
            adapters ignore it. Omit when idle. Queued follow-ups stay in the
            web UI's memory until the turn is idle and are never written to
            browser storage.
    ThreadResponseRequest:
      type: object
      required: [expectedResourceVersion, responseTo]
      properties:
        expectedResourceVersion: { type: integer, format: int64, minimum: 1 }
        responseTo: { type: string, minLength: 1, maxLength: 160 }
        choice: { type: string, minLength: 1, maxLength: 1024 }
        input: { type: string, maxLength: 131072 }
    ThreadModelRequest:
      type: object
      required: [expectedResourceVersion, model]
      properties:
        expectedResourceVersion: { type: integer, format: int64, minimum: 1 }
        model: { type: string, minLength: 1, maxLength: 256 }
    ThreadEffortRequest:
      type: object
      required: [expectedResourceVersion, effort]
      properties:
        expectedResourceVersion: { type: integer, format: int64, minimum: 1 }
        effort: { type: string, minLength: 1, maxLength: 256 }
    ThreadState:
      type: string
      enum: [active, paused, archived, deleted]
    Thread:
      type: object
      required:
        [id, capsuleId, state, harness, encryptedAtRest, messageCount, encryptedBytes,
         createdAt, updatedAt, resourceVersion]
      properties:
        id: { type: string }
        capsuleId: { type: string }
        state: { $ref: "#/components/schemas/ThreadState" }
        harness: { type: string }
        currentRunId: { type: string }
        currentRunState: { $ref: "#/components/schemas/RunState" }
        awaiting: { $ref: "#/components/schemas/ThreadAwaiting" }
        turn:
          type: string
          enum: [working, idle]
          description: >-
            Present while the structured session is live: whether the agent is
            working on a turn or idle between turns. Derived in memory from the
            encrypted transcript like awaiting, never persisted, and content-free.
        protocol:
          type: string
          enum: [meridian.adapter.v1]
        structuredSupported: { type: boolean }
        coordinationGrantId:
          type: string
          description: The Coordination Grant over this Thread's tree, on the lead and on each subagent.
        parentThreadId:
          type: string
          description: Present on a subagent Thread; the lead that spawned it.
        rootThreadId:
          type: string
          description: The lead at the root of this Thread's coordination tree.
        linkId:
          type: string
          description: Present on a subagent Thread; its link from the lead.
        depth:
          type: integer
          minimum: 0
          maximum: 3
          description: Zero for leads, one for their subagents.
        encryptedAtRest:
          type: boolean
          const: true
        messageCount: { type: integer, format: int64, minimum: 0, maximum: 100000 }
        encryptedBytes: { type: integer, format: int64, minimum: 0, maximum: 268435456 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time }
        resourceVersion: { type: integer, format: int64, minimum: 1 }
    ThreadAwaiting:
      type: object
      description: >-
        Present while the active structured session has an unanswered
        permission or input request. Derived in memory from the encrypted
        transcript and never persisted in plaintext; it carries no request
        summary, options, or prompt text.
      required: [kind, since]
      properties:
        kind:
          type: string
          enum: [permission, input]
        since: { type: string, format: date-time }
    ThreadMutationResult:
      type: object
      required: [thread]
      properties:
        thread: { $ref: "#/components/schemas/Thread" }
        currentRun: { $ref: "#/components/schemas/Run" }
        messageId: { type: string }
        responseTo: { type: string }
    ThreadPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Thread" }
        nextCursor: { type: string }
    ThreadBlockKind:
      type: string
      enum: [text, json, tool_call, tool_result, error]
    ThreadMessageRole:
      type: string
      enum: [system, user, assistant, tool]
    ThreadMessageKind:
      type: string
      enum: [prompt, response, tool_call, tool_result, status]
    ThreadPermission:
      type: object
      required: [kind]
      properties:
        kind: { type: string, maxLength: 512 }
        summary: { type: string, maxLength: 32768 }
        options:
          type: array
          maxItems: 32
          items: { type: string, maxLength: 1024 }
        choice: { type: string, maxLength: 1024 }
    ThreadInput:
      type: object
      properties:
        prompt: { type: string, maxLength: 32768 }
        value: { type: string, maxLength: 131072 }
        secret: { type: boolean }
    ThreadAdapterEvent:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [assistant_delta, assistant_message, tool_start, tool_result, status, error,
                 permission_request, permission_response, input_request, input_response, gap, end,
                 commands, models, set_model, set_effort]
        runtimeSequence: { type: integer, format: int64, minimum: 1 }
        messageId: { type: string }
        responseTo:
          type: string
          description: On permission and input responses, the messageId of the answered request.
        toolCallId: { type: string }
        toolName: { type: string, maxLength: 512 }
        summary: { type: string, maxLength: 131072 }
        result: { type: string, maxLength: 65536 }
        status:
          type: string
          enum: [starting, running, idle, waiting, succeeded, failed, cancelled, restarting]
        code: { type: string }
        retryable: { type: boolean }
        reason: { type: string, maxLength: 32768 }
        permission: { $ref: "#/components/schemas/ThreadPermission" }
        input: { $ref: "#/components/schemas/ThreadInput" }
        requestedAfter: { type: integer, format: int64, minimum: 0 }
        availableFrom: { type: integer, format: int64, minimum: 1 }
        commands:
          type: array
          maxItems: 128
          description: >-
            On commands events, the commands the harness reported for this session.
            The latest commands event replaces earlier ones. Send a command as an
            ordinary message `/name arguments`.
          items: { $ref: "#/components/schemas/ThreadCommand" }
        models: { $ref: "#/components/schemas/ThreadModels" }
        model:
          type: string
          maxLength: 256
          description: On set_model events, the model ID the operator asked for.
        effort:
          type: string
          maxLength: 256
          description: On set_effort events, the effort level the operator asked for.
    ThreadModels:
      type: object
      required: [options]
      description: >-
        On models events, the harness's current model and every model it offers.
        The latest models event replaces earlier ones. current may be empty, and
        need not be one of the options.
      properties:
        current: { type: string, maxLength: 256 }
        resolved:
          type: string
          maxLength: 128
          description: >-
            Display name of the model the current option runs, when the
            harness reports it, such as "Opus 5.5" behind a "default" alias.
        options:
          type: array
          maxItems: 128
          items: { $ref: "#/components/schemas/ThreadModelOption" }
        effort: { $ref: "#/components/schemas/ThreadEffort" }
    ThreadEffort:
      type: object
      required: [options]
      description: >-
        The reasoning effort levels the current model offers. current is the
        level in effect, including the harness's own default when it reports
        one, and empty when it does not say.
      properties:
        current: { type: string, maxLength: 256 }
        options:
          type: array
          maxItems: 16
          items: { $ref: "#/components/schemas/ThreadModelOption" }
    ThreadModelOption:
      type: object
      required: [id, label]
      properties:
        id: { type: string, minLength: 1, maxLength: 256 }
        label: { type: string, minLength: 1, maxLength: 128 }
        description: { type: string, maxLength: 512 }
    ThreadCommand:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"
        description: { type: string, maxLength: 512 }
        argumentHint: { type: string, maxLength: 128 }
        kind:
          type: string
          enum: [prompt, action]
          description: >-
            prompt commands are expanded by the harness; action commands are mapped
            by the adapter to a harness protocol call.
        aliases:
          type: array
          maxItems: 4
          items:
            type: string
            maxLength: 64
            pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"
    ThreadBlock:
      type: object
      required:
        [id, messageId, messageSequence, sequence, role, messageKind, kind, createdAt]
      properties:
        id: { type: string }
        messageId: { type: string }
        messageSequence: { type: integer, format: int64, minimum: 1 }
        sequence: { type: integer, format: int64, minimum: 1, maximum: 128 }
        role: { $ref: "#/components/schemas/ThreadMessageRole" }
        messageKind: { $ref: "#/components/schemas/ThreadMessageKind" }
        kind: { $ref: "#/components/schemas/ThreadBlockKind" }
        content:
          type: string
          maxLength: 1048576
          description: Present only at explicit read/stream decryption boundaries.
        event: { $ref: "#/components/schemas/ThreadAdapterEvent" }
        origin: { $ref: "#/components/schemas/ThreadOrigin" }
        createdAt: { type: string, format: date-time }
    ThreadBlockPage:
      type: object
      required: [items, nextCursor, more]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ThreadBlock" }
        nextCursor: { type: integer, format: int64, minimum: 0 }
        more: { type: boolean }
        gap: { $ref: "#/components/schemas/ThreadAdapterEvent" }
    ProjectPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        nextCursor:
          type: string
    CapsulePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Capsule"
        nextCursor:
          type: string
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/APIError"
    APIError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    HarnessSetupFile:
      type: object
      required: [path, content]
      properties:
        path:
          type: string
        content:
          type: string
        executable:
          type: boolean
    HarnessSetupUpload:
      type: object
      required: [harness, files]
      properties:
        harness: {type: string, enum: [claude, codex, dsh, opencode, pi]}
        files:
          type: array
          maxItems: 256
          items: {$ref: "#/components/schemas/HarnessSetupFile"}
    HarnessSetupPreview:
      type: object
      required: [bundle, issues, digest]
      properties:
        bundle: {$ref: "#/components/schemas/HarnessSetupBundle"}
        digest: {type: string}
        issues:
          type: array
          items:
            type: object
            required: [path, reason]
            properties:
              path: {type: string}
              reason: {type: string}
        warnings:
          type: array
          description: Retained settings that may require Capsule-specific files, tools, or network access.
          items:
            type: object
            required: [path, reason]
            properties:
              path: {type: string}
              reason: {type: string}
    HarnessSetupBundle:
      type: object
      required: [harness, files]
      properties:
        dependencies:
          type: array
          maxItems: 16
          items:
            type: string
          description: Exact npm package versions installed inside the Capsule before harness startup.
        harness:
          type: string
          enum: [claude, codex, dsh, opencode, pi]
        files:
          type: array
          maxItems: 256
          items:
            $ref: '#/components/schemas/HarnessSetupFile'
    HarnessSetup:
      type: object
      required: [id, name, harness, revision, default, deleted, createdAt, resourceVersion]
      properties:
        id:
          type: string
        name:
          type: string
        harness:
          type: string
        revision:
          type: string
        default:
          type: boolean
        deleted:
          type: boolean
        createdAt:
          type: string
          format: date-time
        resourceVersion:
          type: integer
          format: int64
    HarnessSetupPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HarnessSetup'
    HarnessSetupRevision:
      type: object
      required: [id, setupId, digest, files, createdAt]
      properties:
        id:
          type: string
        setupId:
          type: string
        digest:
          type: string
        files:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
    HarnessSetupRevisionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HarnessSetupRevision'
    PinnedHarnessSetup:
      type: object
      required: [harness, setupId, name, revision, revisedAt]
      description: One harness setup revision pinned to a Capsule at creation.
      properties:
        harness:
          type: string
        setupId:
          type: string
        name:
          type: string
          description: Current name of the setup. A rename shows here; the pinned files do not change.
        revision:
          type: string
        revisedAt:
          type: string
          format: date-time
          description: When this pinned revision was saved.
    ImportHarnessSetupRequest:
      type: object
      required: [name, bundle, default, expectedResourceVersion]
      properties:
        id:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 128
        bundle:
          $ref: '#/components/schemas/HarnessSetupBundle'
        default:
          type: boolean
        expectedResourceVersion:
          type: integer
          format: int64
    MutateHarnessSetupRequest:
      type: object
      required: [expectedResourceVersion]
      properties:
        name:
          type: string
        revision:
          type: string
        default:
          type: boolean
        deleted:
          type: boolean
        expectedResourceVersion:
          type: integer
          format: int64
    ClaudeLoginRequest:
      type: object
      properties:
        connectionId:
          type: string
          description: Official Anthropic connection to replace. Empty creates or replaces the existing Claude login.
    ClaudeLogin:
      type: object
      required: [loginId, authorizeUrl, expiresAt, manual]
      properties:
        loginId:
          type: string
        authorizeUrl:
          type: string
          description: Claude's authorize page. It contains the PKCE challenge and state, not the verifier or a token.
        expiresAt:
          type: string
          format: date-time
        manual:
          type: boolean
          description: When true, the browser cannot return to this daemon, so the operator submits the code Claude displays.
    ClaudeLoginCode:
      type: object
      required: [code]
      properties:
        code:
          type: string
          maxLength: 2048
          description: Authorization code from the Claude page, optionally code#state. Not an access token. Not stored.
    ClaudeLoginStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, complete, failed]
        connectionId:
          type: string
          description: Set when status is complete. Not a secret.
    ProviderConnection:
      type: object
      required: [id, provider, name, createdAt, resourceVersion, revoked]
      properties:
        id:
          type: string
        provider:
          $ref: '#/components/schemas/ProviderConnectionType'
        name:
          type: string
        baseUrl:
          type: string
          description: Custom endpoint upstream, normalized without a trailing /v1. Never sent to a Capsule.
        defaultModel:
          type: string
          description: Model name configured in harnesses that use this custom endpoint.
        allowPrivateHttp:
          type: boolean
          description: Whether this custom endpoint uses plaintext HTTP to a private-network address.
        reasoningEfforts:
          type: array
          maxItems: 6
          items: { $ref: '#/components/schemas/ReasoningEffortLevel' }
          description: >-
            The reasoning effort levels the default model accepts, in order.
            Harnesses offer exactly these, plus off, for that model.
        account:
          type: string
          description: ChatGPT connections only. The signed-in account's email, for display.
        needsSignIn:
          type: boolean
          description: ChatGPT connections only. The sign-in stopped working; sign in again to resume.
        revocationUnconfirmed:
          type: boolean
          description: >-
            ChatGPT connections only. Local tokens were deleted but OpenAI did
            not confirm revocation; disconnect Meridian in ChatGPT's settings.
        credentialKind:
          $ref: '#/components/schemas/AnthropicCredentialKind'
        createdAt:
          type: string
          format: date-time
        resourceVersion:
          type: integer
          format: int64
        revoked:
          type: boolean
    ChatGPTSignInRequest:
      type: object
      properties:
        connectionId:
          type: string
          description: Existing ChatGPT connection to reauthorize; omit to create a new one.
        listen:
          type: boolean
          description: >-
            Ask the daemon to accept the browser's loopback callback itself.
            Use when the browser runs on the daemon's machine.
    ChatGPTSignInCompletion:
      type: object
      required: [callbackUrl]
      properties:
        callbackUrl:
          type: string
          maxLength: 8192
          description: The full address the browser was redirected to after approving.
    ChatGPTSignIn:
      type: object
      required: [id, authorizationUrl, redirectUri, listening, expiresAt, state]
      properties:
        id:
          type: string
        authorizationUrl:
          type: string
          description: OpenAI authorization page to open in the user's browser.
        redirectUri:
          type: string
        listening:
          type: boolean
          description: Whether the daemon is accepting the loopback callback itself.
        expiresAt:
          type: string
          format: date-time
        state:
          type: string
          enum: [pending, completed, failed]
        connectionId:
          type: string
        failure:
          type: string
    ProviderConnectionPage:
      type: object
      required: [items, enabled]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProviderConnection'
        enabled:
          type: boolean
        privateHttpAllowed:
          type: boolean
          description: Whether the daemon permits custom endpoints to opt in to plaintext HTTP on private networks.
        chatgptAvailable:
          type: boolean
          description: Whether Sign in with ChatGPT can create plan connections on this installation.
    ReasoningEffortLevel:
      type: string
      enum: [minimal, low, medium, high, xhigh, max]
      description: >-
        An effort level a custom endpoint's model accepts. The name is sent
        upstream as the request's reasoning effort.
    ProviderConnectionType:
      type: string
      enum: [openai, anthropic, openai-compatible, anthropic-compatible, chatgpt]
      description: >-
        openai and anthropic use fixed official upstreams. openai-compatible
        and anthropic-compatible use an operator-configured baseUrl. chatgpt
        uses the signed-in user's ChatGPT plan; it is created only by Sign in
        with ChatGPT and accepts only rename and revocation here.
    AnthropicCredentialKind:
      type: string
      enum: [api_key, oauth]
      description: >-
        How the provider gateway attaches an official Anthropic Claude login.
        api_key sends X-Api-Key. oauth sends Authorization: Bearer for the
        access token from in-UI sign-in, or for a setup token. Omitted means
        api_key. This value is not the secret. Only the anthropic provider
        accepts oauth.
    ProviderConnectionRequest:
      type: object
      required: [name, provider, apiKey, expectedResourceVersion]
      properties:
        name:
          type: string
        provider:
          $ref: '#/components/schemas/ProviderConnectionType'
        apiKey:
          type: string
          writeOnly: true
          maxLength: 4096
          description: >-
            Required for official providers. For anthropic this is the fallback
            Claude login: an API key, or a setup token when credentialKind is
            oauth. In-UI sign-in uses /claude-login and does not send a token
            here. Custom endpoints accept an empty key and then send no
            upstream credential. The value is write-only and is not returned.
        credentialKind:
          $ref: '#/components/schemas/AnthropicCredentialKind'
        baseUrl:
          type: string
          maxLength: 2048
          description: >-
            Required for custom endpoint types; rejected for official ones.
            An https URL, or an http URL on a loopback or private-network
            address when allowPrivateHttp is set. A trailing /v1 is removed.
        defaultModel:
          type: string
          maxLength: 256
          description: Optional model name for custom endpoints; OpenCode and Pi require one.
        allowPrivateHttp:
          type: boolean
          description: Opt in to a plaintext http baseUrl. Requires the daemon's --provider-gateway-allow-private-http flag.
        reasoningEfforts:
          type: array
          maxItems: 6
          items: { $ref: '#/components/schemas/ReasoningEffortLevel' }
          description: >-
            Optional, custom endpoints with a defaultModel only: distinct
            effort levels the model accepts. Stored in canonical order.
        expectedResourceVersion:
          type: integer
          format: int64
        revoked:
          type: boolean
    ProjectProviderConnection:
      type: object
      required: [connectionId]
      properties:
        connectionId:
          type: string
          description: Connection to authorize for this Project and harness; empty revokes access.
    ProjectHarnessSetup:
      type: object
      required: [setup]
      properties:
        setup:
          type: string
          description: Saved setup ID, clean, or empty to inherit the personal default.
tags:
  - name: probes
    description: Process health and readiness.
  - name: audit
    description: Append-only, content-free audit records.
  - name: members
    description: Team mode membership administration.
  - name: capabilities
    description: Effective provider-backed UI features.
  - name: secrets
    description: Encrypted purpose-scoped named secret metadata and mutation.
  - name: projects
    description: Project metadata.
  - name: capsules
    description: Asynchronous Capsule lifecycle.
  - name: runs
    description: Harness execution, ordered events, and reconnectable PTY attachment.
  - name: threads
    description: Provider-independent encrypted structured harness Threads.
  - name: previews
    description: Bounded Capsule-local port discovery and loopback preview tickets.
  - name: files
    description: Bounded workspace browsing and authenticated portable export.
  - name: deliveries
    description: Explicitly approved exact-object commit, push, and GitHub pull request delivery.
