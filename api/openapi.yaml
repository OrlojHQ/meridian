              schema: { $ref: "#/components/schemas/NoteHistory" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/DefaultError" }
  /coordination-grants/{grantId}/notes/{noteName}/promote:
    post:
      operationId: promoteWorkingNote
      summary: Promote a working note to Project notes
      description: >-
        Opens the review of the working note's current revision as a change
        to the Project note of the same name, or a new one. It stores a
        pending proposal; nothing leaves the tree until it is approved.
        A revoked lead's notes can still be promoted.
